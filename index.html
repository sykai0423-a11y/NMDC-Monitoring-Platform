<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTV監控平台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg-void: #F5F7FA;
  --bg-panel: #FFFFFF;
  --bg-panel-2: #F0F2F7;
  --line: #DDE1EC;
  --accent: #4F7CFF;
  --red: #FF5A5F;
  --amber: #FFB020;
  --green: #10B981;
  --text: #1E2235;
  --text-dim: #7A82A0;
}
* { box-sizing: border-box; }
body {
  margin: 0; display: flex; min-height: 100vh;
  background: var(--bg-void); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
}
.mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: .02em; }
.text-dim { color: var(--text-dim); }
.warn-text { color: var(--red); }

.sidebar { width: 220px; flex-shrink: 0; background: var(--bg-panel); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 24px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.brand-title { font-weight: 700; font-size: 15px; }
.brand-sub { font-size: 10px; color: var(--text-dim); }
.nav-list { display: flex; flex-direction: column; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; background: transparent; border: 1px solid transparent; color: var(--text-dim); padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; text-align: left; width: 100%; text-decoration: none; box-sizing: border-box; }
.nav-item:hover { background: var(--bg-panel-2); color: var(--text); }
.nav-item.active { background: rgba(79,124,255,.08); color: var(--accent); border-color: rgba(79,124,255,.35); }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid var(--line); background: var(--bg-panel); }
.topbar-title { font-size: 13px; color: var(--text-dim); }
.clock { display: flex; gap: 10px; font-size: 13px; color: var(--text-dim); }
.clock-time { color: var(--accent); }
.excel-actions { display: flex; gap: 8px; }

.content { flex: 1; overflow-y: auto; padding: 28px; }
.page-title { font-size: 20px; font-weight: 700; margin: 0 0 20px; }
.section-title { font-size: 15px; font-weight: 600; margin: 0; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 12px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } .sidebar { width: 72px; } .brand-title, .brand-sub, .nav-item span { display: none; } }

.viewfinder { position: relative; }
.corner { position: absolute; width: 12px; height: 12px; border: 2px solid var(--accent); opacity: .55; }
.corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
.corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
.corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

.card { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 4px; padding: 18px; }
.card-head { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 12px; }
.card-head span:first-of-type { flex: 1; }

.pill { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-family: monospace; }
.pill-green { background: rgba(51,209,122,.12); color: var(--green); border: 1px solid rgba(51,209,122,.4); }
.pill-red { background: rgba(255,90,95,.12); color: var(--red); border: 1px solid rgba(255,90,95,.4); }
.pill-amber { background: rgba(255,176,32,.14); color: #B4790A; border: 1px solid rgba(255,176,32,.5); }
.pill-gray { background: rgba(140,140,150,.14); color: #6b6b76; border: 1px solid rgba(140,140,150,.4); }

/* 路由器更換表：統計卡片＋進度條 */
.stat-num { font-size: 26px; font-weight: 700; line-height: 1.1; }
.stat-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.progress-card { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; margin-bottom: 24px; }
.progress-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font-size: 13px; }
.progress-track { height: 8px; border-radius: 999px; background: var(--bg-panel-2); overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-radius: 999px; }
.site-tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--bg-panel-2); color: var(--text-dim); }

.light-row { display: flex; gap: 18px; font-size: 13px; flex-wrap: wrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-light { display: inline-flex; align-items: center; font-size: 13px; cursor: pointer; background: none; border: none; color: var(--text); padding: 0; }

/* 首頁 台中端/通霄端 卡片：點已完成/待辦/未完成 展開清單 */
.dash-expand-panel { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.dash-expand-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.dash-expand-close { background: none; border: none; color: var(--text-dim); font-size: 16px; line-height: 1; cursor: pointer; padding: 0 2px; }
.dash-expand-close:hover { color: var(--text); }

.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; padding: 8px 14px; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--bg-panel-2); color: var(--text); }
.btn.primary { background: var(--accent); color: #06201C; border-color: var(--accent); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.danger { background: rgba(255,90,95,.1); color: var(--red); border-color: rgba(255,90,95,.35); }
.btn.full { width: 100%; justify-content: center; margin-top: 10px; }
.btn.small { padding: 5px 10px; font-size: 12px; }
.icon-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px 6px; border-radius: 4px; font-size: 13px; }
.icon-btn:hover { color: var(--text); background: var(--bg-panel-2); }
.icon-btn.danger:hover { color: var(--red); }

.filter-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
.input { background: var(--bg-void); border: 1px solid var(--line); color: var(--text); border-radius: 4px; padding: 8px 10px; font-size: 13px; width: 100%; }
textarea.input { min-height: 70px; resize: vertical; font-family: inherit; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; padding: 10px 12px; background: var(--bg-panel-2); color: var(--text-dim); font-weight: 500; border-bottom: 1px solid var(--line); white-space: nowrap; }
.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.data-table tr:last-child td { border-bottom: none; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tab { background: none; border: none; color: var(--text-dim); padding: 10px 16px; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal-panel { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px; width: 440px; max-width: 92vw; max-height: 86vh; overflow-y: auto; }
.modal-panel.wide { width: 640px; }
.modal-panel.confirm { width: 380px; }
.maint-entry { background: var(--bg-panel-2); border-radius: 4px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
.maint-list { display: flex; flex-direction: column; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
.photo-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid var(--line); }
.lightbox-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox-backdrop img { max-width: 92vw; max-height: 92vh; border-radius: 4px; box-shadow: 0 0 40px rgba(0,0,0,.6); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 13px; }
.modal-body { padding: 18px; }

.form-grid { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 11px; color: var(--text-dim); }
.row-end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

.plan-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.plan-row { display: flex; align-items: center; gap: 10px; background: var(--bg-panel-2); border-radius: 4px; padding: 8px 10px; }
.plan-row.compact { padding: 6px 10px; gap: 8px; }
.plan-text { flex: 1; font-size: 13px; }
.compact-card { padding: 14px 18px; }
.row-form { display: flex; gap: 8px; align-items: center; background: var(--bg-panel-2); padding: 10px; border-radius: 4px; }
.row-form .input { width: auto; flex: 1; }
@media (max-width: 700px) { .row-form { flex-wrap: wrap; } }
.inline-add { display: flex; flex-direction: column; gap: 8px; background: var(--bg-panel-2); padding: 12px; border-radius: 4px; margin-top: 8px; }

.cal-head { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 14px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; position: relative; }
.cal-cell.day { background: var(--bg-panel-2); border: 1px solid transparent; border-radius: 4px; cursor: pointer; color: var(--text); }
.cal-cell.day:hover { border-color: var(--line); }
.cal-cell.day.today { border-color: var(--accent); }
.cal-cell.day.selected { background: rgba(79,124,255,.15); }
.cal-cell.day.has-file { color: var(--accent); }
.cal-cell.empty { visibility: hidden; }
.cal-cell.cal-label { color: var(--text-dim); font-size: 11px; }
.file-dot { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

.monitor-layout { display: flex; gap: 16px; align-items: flex-start; }
.monitor-list { width: 320px; flex-shrink: 0; max-height: 65vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 4px; padding: 8px; background: var(--bg-panel); }
.monitor-row { display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 4px; cursor: pointer; background: var(--bg-panel-2); border: 1px solid transparent; }
.monitor-row:hover { border-color: var(--line); }
.monitor-row.selected { border-color: var(--accent); background: rgba(79,124,255,.12); }
.monitor-row.today .monitor-row-date span:first-child { color: var(--accent); }
.monitor-row-check { display: flex; align-items: center; flex-shrink: 0; cursor: pointer; }
.monitor-row-check input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
.monitor-row-check input[disabled] { cursor: not-allowed; opacity: .35; }
.monitor-row-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.monitor-row-date { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.monitor-row-status { display: flex; align-items: center; gap: 8px; }
.monitor-download-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.monitor-detail { flex: 1; min-width: 260px; }
@media (max-width: 900px) { .monitor-layout { flex-direction: column; } .monitor-list { width: 100%; } }

.duty-list { display: flex; flex-direction: column; gap: 8px; }
.duty-row { display: flex; align-items: flex-start; gap: 14px; padding: 12px 14px; border-radius: 4px; background: var(--bg-panel-2); border: 1px solid transparent; }
.duty-row.today { border-color: var(--accent); background: rgba(79,124,255,.08); }
.duty-row.weekend { border-left: 3px solid var(--amber); }
.duty-date { flex-shrink: 0; width: 120px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; padding-top: 4px; }
@media (max-width: 700px) { .duty-row { flex-wrap: wrap; } .duty-date { width: 100%; flex-direction: row; gap: 8px; } }

.week-widget { display: flex; flex-direction: column; gap: 6px; }
.week-widget-row { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.week-widget-row.today { background: rgba(79,124,255,.1); }
.week-widget-day { width: 78px; flex-shrink: 0; color: var(--text-dim); }
.reminder-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.reminder-item { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.reminder-item:last-child { border-bottom: none; }
.mini-bar-wrap { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.mini-bar-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.mini-bar-label { width: 110px; flex-shrink: 0; color: var(--text-dim); }
.mini-bar-track { flex: 1; height: 8px; border-radius: 4px; background: var(--bg-void); overflow: hidden; }
.mini-bar-fill { height: 100%; border-radius: 4px; }
.mini-bar-val { width: 48px; text-align: right; flex-shrink: 0; font-family: monospace; font-size: 11px; color: var(--text-dim); }
.monitor-summary-title { display: flex; align-items: center; gap: 8px; font-weight: 600; margin: 28px 0 12px; }
.monitor-summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.monitor-summary-card { border: 1px solid var(--line); border-radius: 4px; padding: 12px; background: var(--bg-panel); display: flex; flex-direction: column; gap: 8px; }
.monitor-summary-card.uploaded { border-color: rgba(51,209,122,.3); }
.monitor-summary-card.missing { border-color: rgba(255,90,95,.25); }
.ms-card-top { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.ms-card-status { display: flex; align-items: center; font-size: 12px; }
.ms-card-filename { min-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-card-actions { display: flex; gap: 6px; margin-top: 2px; }
.ms-card-actions .btn { padding: 6px 8px; font-size: 12px; justify-content: center; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.link { color: var(--accent); text-decoration: underline; font-size: 13px; cursor: pointer; }
.cat-block { margin-top: 8px; }
.empty-hint { color: var(--text-dim); }
.ppe-frame { width: 100%; height: calc(100vh - 170px); border: 1px solid var(--line); border-radius: 6px; background: #fff; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">
    <span class="rec-dot"></span>
    <div>
      <div class="brand-title">CCTV監控平台</div>
      <div class="brand-sub mono">SITE SURVEILLANCE OPS</div>
    </div>
  </div>
  <div class="nav-list" id="navList"></div>
</div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title mono" id="topbarTitle"></div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="excel-actions">
        <button class="btn small ghost" onclick="exportExcel()">匯出Excel</button>
        <button class="btn small ghost" onclick="document.getElementById('importFile').click()">匯入Excel</button>
        <input type="file" id="importFile" accept=".xlsx" style="display:none" onchange="importExcel(event)">
      </div>
      <div class="clock mono" id="clockBox"></div>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
/* ============================= Google Apps Script 雲端同步 ============================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbxReHCmCeF1kPhYlxFSOzZv2dgnHAkvsh6i9LD91lSFM_gx8RJzb8Hl84_CfGU6qe_S/exec';
const BOOK = 'cctv';

function getCurrentUser() {
  let u = localStorage.getItem('cctv-current-user');
  if (!u) {
    u = (prompt('請輸入您的姓名（用於紀錄建立/修改人員，僅需輸入一次，之後可在瀏覽器清除資料後重新輸入）：', '') || '').trim() || '未知人員';
    localStorage.setItem('cctv-current-user', u);
  }
  return u;
}

async function apiList(sheet) {
  const url = `${API_URL}?action=list&book=${BOOK}&sheet=${encodeURIComponent(sheet)}`;
  const res = await fetch(url);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '讀取失敗');
  return json.data;
}
async function apiUpsert(sheet, record) {
  showBusyToast('儲存中...');
  try {
    const payload = { action: 'upsert', book: BOOK, sheet, record, user: getCurrentUser() };
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '寫入失敗');
    return json.data;
  } finally {
    hideBusyToast();
  }
}
async function apiDelete(sheet, idValue) {
  showBusyToast('刪除中...');
  try {
    const payload = { action: 'delete', book: BOOK, sheet, id: idValue };
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '刪除失敗');
  } finally {
    hideBusyToast();
  }
}
// 批次刪除（一次網路請求刪多筆），需要 Apps Script 有加 deleteMany action；
// 若後端尚未更新（回傳 unknown action），呼叫端會收到例外，可自行 fallback 成逐筆 apiDelete。
async function apiDeleteMany(sheet, ids) {
  showBusyToast('刪除中...');
  try {
    const payload = { action: 'deleteMany', book: BOOK, sheet, ids };
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '批次刪除失敗');
  } finally {
    hideBusyToast();
  }
}
async function apiUploadFile(file, subfolder, oldFileUrl) {
  showUploadToast();
  try {
    const dataUrl = await fileToBase64(file);
    const payload = { action: 'uploadFile', book: BOOK, filename: file.name, base64Data: dataUrl, mimeType: file.type, subfolder: subfolder || '', oldFileUrl: oldFileUrl || '' };
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '檔案上傳失敗');
    return json.url;
  } finally {
    hideUploadToast();
  }
}

/* ============================= 處理中提示模塊 ============================= */
// 任何跟 Google 試算表/雲端硬碟溝通的動作（存檔、刪除、上傳檔案…）都會顯示這個
// 浮動提示，讓使用者知道「系統正在處理」而不是網頁當掉了。用計數器處理同時有
// 多個請求在跑的情況：全部結束才會真的把提示收起來。
let __busyCount = 0;
function showBusyToast(msg) {
  __busyCount++;
  let el = document.getElementById('uploadToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'uploadToast';
    el.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--bg-panel-2,#F0F2F7);color:var(--text,#1E2235);border:1px solid var(--accent,#4F7CFF);border-radius:10px;padding:12px 20px;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.15);';
    el.innerHTML = '<span style="width:14px;height:14px;border:2px solid var(--accent,#4F7CFF);border-top-color:transparent;border-radius:50%;display:inline-block;animation:uploadSpin .7s linear infinite;flex-shrink:0;"></span><span class="busy-toast-msg">處理中...</span>';
    document.body.appendChild(el);
    if (!document.getElementById('uploadToastStyle')) {
      const style = document.createElement('style');
      style.id = 'uploadToastStyle';
      style.textContent = '@keyframes uploadSpin{to{transform:rotate(360deg);}}';
      document.head.appendChild(style);
    }
  }
  el.querySelector('.busy-toast-msg').textContent = msg || '處理中...';
  el.style.display = 'flex';
}
function hideBusyToast() {
  __busyCount = Math.max(0, __busyCount - 1);
  if (__busyCount > 0) return; // 還有其他請求在跑，先別收起提示
  const el = document.getElementById('uploadToast');
  if (el) el.style.display = 'none';
}
// 舊名稱保留相容（apiUploadFile 等原本呼叫這兩個名字的地方不用全部改）
function showUploadToast() { showBusyToast('檔案上傳中...'); }
function hideUploadToast() { hideBusyToast(); }

async function loadAllData() {
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = '<div class="page"><p class="text-dim">連線 Google 雲端讀取資料中…</p></div>';
  try {
    const [patrolRows, tomorrowRows, poeCheckRows, poeExtraRows, equipTRows, equipXRows, monitorObj, monitorMonthlyObj, poeResRows, equipMaintRows, gpsRows, dutyRows, routerRows, ppeItemRows] = await Promise.all([

      apiList('路由器更換表').catch(() => []), // 同上，尚未新增「路由器更換表」分頁時先降級成空陣列
      apiList('防護具品項清單').catch(() => []), // 首頁「PPE 庫存提醒」直接讀雲端，不再依賴 PPE 頁面的 localStorage
    ]);
    DB.patrol = patrolRows.map(SHEET_MAP.patrol.fromRow);
    DB.tomorrow = tomorrowRows.map(SHEET_MAP.tomorrow.fromRow);
    DB.poeChecks = poeCheckRows.map(SHEET_MAP.poeChecks.fromRow);
    DB.poeExtra = poeExtraRows.map(SHEET_MAP.poeExtra.fromRow);
    DB.equipTaichung = equipTRows.map(SHEET_MAP.equipTaichung.fromRow);
    DB.equipTongxiao = equipXRows.map(SHEET_MAP.equipTongxiao.fromRow);
    DB.monitorFiles = monitorObj;
    DB.monitorMonthly = monitorMonthlyObj;
    DB.poeReservation = poeResRows.map(SHEET_MAP.poeReservation.fromRow);
    DB.equipMaint = equipMaintRows.map(SHEET_MAP.equipMaint.fromRow);
    DB.gpsDevices = gpsRows.map(SHEET_MAP.gpsDevices.fromRow);
    DB.duty = dutyRows.map(SHEET_MAP.duty.fromRow);
    DB.router = routerRows.map(SHEET_MAP.router.fromRow);

async function reloadOne(type) {
  if (type === 'monitorFiles') { DB.monitorFiles = await apiListMonitor(); return; }
  if (type === 'monitorMonthly') { DB.monitorMonthly = await apiListMonitorMonthly(); return; }
  if (type === 'ppeItems') {
    const rows = await apiList('防護具品項清單');
    DB.ppeItems = rows.map(r => ({ name: String(r['品項名稱'] == null ? '' : r['品項名稱']), qty: Number(r['目前庫存']) || 0 }));
    return;
  }
  const map = SHEET_MAP[type];
  const rows = await apiList(map.sheet);
  DB[type] = rows.map(map.fromRow);
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function fileToBase64(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function esc(s) { return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function openFile(url) { if (url) window.open(url, '_blank'); }
function cleanDate(v) {
  if (!v) return v;
  const s = String(v);
  // 把可能殘留的完整時間戳記（例如 2026-04-27T16:00:00.000Z）裁成純日期
  return (s.length >= 10 && s[4] === '-' && s[7] === '-') ? s.slice(0, 10) : s;
}
function toPreviewUrl(url) {
  if (!url) return '';
  const m = url.match(/\/document\/d\/([^\/]+)/);
  if (m) return `https://docs.google.com/document/d/${m[1]}/preview`;
  return '';
}
// 把 Google Drive 的「檢視連結」轉成「直接下載連結」，
// 點擊後才會真的觸發瀏覽器下載檔案到電腦，而不是進到雲端硬碟／文件線上檢視頁。
function toDriveDownloadUrl(url) {
  if (!url) return '';
  // 上傳的 .doc/.docx 如果被 Google 自動轉成 Google 文件格式，連結會是
  // .../document/d/ID/edit 這種形式，要用 export 端點強制輸出成 .docx 才會觸發下載，
  // 不然點下去只會打開線上編輯畫面（就是使用者截圖看到的狀況）。
  const docMatch = url.match(/\/document\/d\/([^\/]+)/);
  if (docMatch) return `https://docs.google.com/document/d/${docMatch[1]}/export?format=docx`;
  const m = url.match(/\/file\/d\/([^\/]+)/) || url.match(/[?&]id=([^&]+)/);
  if (m) return `https://drive.google.com/uc?export=download&id=${m[1]}`;
  return url;
}

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .02em; }
  header .subtitle { font-size: 12px; color: var(--text-muted); }
  .header-right { margin-left: auto; display: flex; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); transition: background .15s; }
  .btn:hover { background: var(--bg); }
  .btn-primary { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }
  .btn-primary:hover { background: #333; }
  .btn-danger { background: var(--zero); color: #fff; border-color: var(--zero); }
  .btn-danger:hover { background: #c23c3b; }
  .btn-success { background: var(--ok); color: #fff; border-color: var(--ok); }
  .btn-success:hover { background: #178a64; }
  .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-accent:hover { background: #2a6fb5; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .layout { display: flex; flex-direction: column; min-height: 100%; }
  nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0; display: flex; overflow-x: auto; }
  .nav-section { display: none; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-size: 13px; cursor: pointer; color: var(--text-secondary); border-left: none; border-bottom: 2px solid transparent; white-space: nowrap; transition: all .12s; }
  .nav-item:hover { background: var(--bg); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent); border-left-color: transparent; border-bottom-color: var(--accent); font-weight: 500; }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .badge { margin-left: auto; font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600; }
  .badge-low { background: var(--low-bg); color: var(--low); }
  main { padding: 24px; }
  .page { display: none; }
  .page.active { display: block; }
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .stat-val { font-size: 26px; font-weight: 600; line-height: 1; }
  .stat-val.ok { color: var(--ok); }
  .stat-val.low { color: var(--low); }
  .stat-val.zero { color: var(--zero); }
  .sec-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 20px 0 10px; letter-spacing: .04em; text-transform: uppercase; }
  .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .inv-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; position: relative; transition: box-shadow .15s, border-color .15s; }
  .inv-card:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(55,138,221,.08); }
  .inv-card .cat { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
  .inv-card .name { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; padding-right: 20px; }
  .inv-card .qty { font-size: 28px; font-weight: 700; line-height: 1; margin-bottom: 4px; cursor: pointer; }
  .inv-card .qty.ok { color: var(--ok); }
  .inv-card .qty.low { color: var(--low); }
  .inv-card .qty.zero { color: var(--zero); }
  .status-pill { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500; }
  .pill-ok { background: var(--ok-bg); color: var(--ok); }
  .pill-low { background: var(--low-bg); color: var(--low); }
  .pill-zero { background: var(--zero-bg); color: var(--zero); }
  .card-actions { display: flex; gap: 4px; margin-top: 8px; }
  .card-btn { flex: 1; padding: 4px 0; text-align: center; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid; transition: opacity .12s; }
  .card-btn:hover { opacity: .75; }
  .card-btn-in { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
  .card-btn-out { background: var(--zero-bg); color: var(--zero); border-color: var(--zero); }
  .del-btn { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; background: transparent; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; transition: background .12s, color .12s; }
  .del-btn:hover { background: var(--zero-bg); color: var(--zero); }
  .bar-list { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-label { width: 90px; font-size: 12px; color: var(--text-secondary); text-align: right; flex-shrink: 0; }
  .bar-track { flex: 1; height: 12px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .bar-val { width: 28px; font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 14px; padding: 24px; width: 400px; max-width: 95vw; box-shadow: 0 12px 40px rgba(0,0,0,.15); }
  .modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .modal .modal-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; display: block; }
  .form-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: var(--font); background: var(--bg); color: var(--text-primary); outline: none; transition: border-color .15s; }
  .form-input:focus { border-color: var(--accent); background: var(--surface); }
  select.form-input { cursor: pointer; }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; justify-content: center; }
  .action-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .action-tab { flex: 1; padding: 8px; text-align: center; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; cursor: pointer; transition: all .15s; color: var(--text-secondary); }
  .action-tab.active-in { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .action-tab.active-out { background: var(--zero-bg); border-color: var(--zero); color: var(--zero); font-weight: 600; }

  /* ── 裝備管理 table ── */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--bg); font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text-primary); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .tag-in { background: var(--ok-bg); color: var(--ok); }
  .tag-out { background: var(--zero-bg); color: var(--zero); }
  .group-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--accent-bg); color: var(--accent); font-weight: 500; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text-primary); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 13px; transform: translateY(80px); opacity: 0; transition: all .3s; z-index: 300; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
  .manage-toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
  .manage-toolbar input { flex: 1; max-width: 260px; }
  .confirm-bar { background: var(--zero-bg); border: 1px solid var(--zero); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--zero); }
  .confirm-bar .btn { flex-shrink: 0; }
  .edit-input { width: 100%; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: var(--font); background: var(--surface); }
  .edit-input:focus { border-color: var(--accent); outline: none; }
  .export-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .export-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
  .export-icon { font-size: 28px; }
  .export-title { font-size: 15px; font-weight: 600; }
  .export-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; flex: 1; }
  .export-preview { font-size: 12px; color: var(--text-muted); background: var(--bg); border-radius: 6px; padding: 6px 10px; }
  .export-btn { width: 100%; justify-content: center; margin-top: 4px; }
  .export-note { background: var(--accent-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; font-size: 13px; color: var(--text-secondary); line-height: 1.7; }

  /* ── 雲端同步狀態指示器 ── */
  #sync-status-bar { transition: color .3s; }
  .sync-writing { color: var(--accent) !important; }
  .sync-ok { color: var(--ok) !important; }
  .sync-err { color: var(--zero) !important; }
  .fsa-note { background: var(--accent-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px; }
  /* 處理中浮動提示（iframe 內自帶一份，視覺與主程式的 showBusyToast 一致） */
  #ppe-busy { display: none; position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 400; background: var(--surface); color: var(--text-primary); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 18px; font-size: 13px; align-items: center; gap: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.15); }
  #ppe-busy.show { display: flex; }
  #ppe-busy .spin { width: 14px; height: 14px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; display: inline-block; animation: ppeSpin .7s linear infinite; flex-shrink: 0; }
  @keyframes ppeSpin { to { transform: rotate(360deg); } }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .card-btn.busy, .del-btn.busy { opacity: .5; pointer-events: none; }
  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    nav { display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 0; }
    .nav-section { display: none; }
    .nav-item { border-left: none; border-bottom: 2px solid transparent; white-space: nowrap; padding: 12px 14px; }
    .nav-item.active { border-bottom-color: var(--accent); border-left-color: transparent; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div>
    <h1>🦺 個人防護具庫存管理</h1>
    <div class="subtitle sync-ok" id="sync-status-bar">☁ 已連接雲端資料庫，所有操作即時同步</div>
  </div>
  <div class="header-right">
    <button class="btn" id="btn-reload" onclick="reloadAll(this)" title="重新從雲端讀取最新資料">🔄 重新整理</button>
    <button class="btn btn-success" onclick="openModal('in')">＋ 進貨</button>
    <button class="btn btn-danger" onclick="openModal('out')">－ 領取</button>
  </div>
</header>

<div id="ppe-busy"><span class="spin"></span><span id="ppe-busy-msg">處理中...</span></div>

<div class="layout">
  <nav>
    <div class="nav-section">主選單</div>
    <div class="nav-item active" onclick="showPage('overview',this)"><span class="nav-icon">📊</span> 庫存總覽</div>
    <div class="nav-item" onclick="showPage('chart',this)"><span class="nav-icon">📈</span> 圖形分析</div>
    <div class="nav-item" onclick="showPage('log',this)"><span class="nav-icon">📋</span> 異動紀錄</div>
    <div class="nav-section">管理</div>
    <div class="nav-item" id="nav-low" onclick="showPage('low',this)">
      <span class="nav-icon">⚠️</span> 偏低品項
      <span class="badge badge-low" id="low-badge">0</span>
    </div>
    <div class="nav-item" id="nav-purchase" onclick="showPage('purchase',this)">
      <span class="nav-icon">🛒</span> 採購裝備
      <span class="badge badge-low" id="purchase-badge">0</span>
    </div>
    <div class="nav-item" onclick="showPage('manage',this)"><span class="nav-icon">⚙️</span> 裝備管理</div>
    <div class="nav-item" onclick="showPage('export',this)"><span class="nav-icon">📊</span> 匯出 / 備份</div>
  </nav>

  <main>
    <\!-- 總覽 -->
    <div class="page active" id="page-overview">
      <div class="stats-row" id="stats-row"></div>
      <div id="inv-sections"></div>
    </div>

    <\!-- 圖形 -->
    <div class="page" id="page-chart">
      <div class="sec-title">安全鞋（按尺碼）</div>
      <div class="bar-list" id="bar-shoes"></div>
      <div class="sec-title">背心（按款式）</div>
      <div class="bar-list" id="bar-vests"></div>
      <div class="sec-title">台中端</div>
      <div class="bar-list" id="bar-taichung"></div>
      <div class="sec-title">其他品項</div>
      <div class="bar-list" id="bar-others"></div>
    </div>

    <\!-- 紀錄 -->
    <div class="page" id="page-log">
      <div class="table-wrap">
        <table>
          <thead><tr><th>時間</th><th>類型</th><th>品項</th><th>數量</th><th>人員</th><th>備註</th></tr></thead>
          <tbody id="log-tbody"><tr><td colspan="6" class="empty">尚無異動紀錄</td></tr></tbody>
        </table>
      </div>
    </div>

    <\!-- 偏低 -->
    <div class="page" id="page-low">
      <div class="inv-grid" id="low-grid"></div>
    </div>

    <\!-- 採購裝備 -->
    <div class="page" id="page-purchase">
      <div class="manage-toolbar">
        <button class="btn btn-accent" onclick="openPurchaseModal()">＋ 新增採購申請</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>品項</th>
              <th>數量</th>
              <th>需求人員</th>
              <th>編輯人員</th>
              <th>登記時間</th>
              <th style="text-align:center">狀態</th>
              <th style="text-align:center">操作</th>
            </tr>
          </thead>
          <tbody id="purchase-tbody"><tr><td colspan="7" class="empty">尚無採購申請</td></tr></tbody>
        </table>
      </div>
    </div>

    <\!-- 匯出 / 備份 -->
    <div class="page" id="page-export">

      <div class="fsa-note" id="cloud-sync-note">
        <b>☁ 雲端同步說明</b><br>
        所有品項、異動紀錄與採購申請都直接存放在公司的 <b>Google 試算表</b>，
        每次進貨 / 領取 / 新增裝備都會<b>立即寫回雲端</b>，不需要手動按任何儲存按鈕，
        任何一台電腦或手機打開這個頁面看到的都是同一份最新資料。<br>
        下方的「下載」功能只是<b>另存一份當下的快照</b>給主管看，不會影響雲端資料。
      </div>

      <div class="export-grid">

        <div class="export-card" style="border-color:var(--accent);background:var(--accent-bg)">
          <div class="export-icon">☁</div>
          <div class="export-title">雲端資料庫狀態</div>
          <div class="export-desc">本模組已改為直接讀寫 Google 試算表（防護具品項清單 / 防護具異動紀錄 / 防護具採購申請三個分頁），不再依賴本機瀏覽器儲存。</div>
          <div class="export-preview" id="cloud-status-preview">☁ 已連接雲端資料庫，所有操作即時同步</div>
          <button class="btn btn-accent export-btn" onclick="reloadAll(this)">🔄 重新讀取雲端資料</button>
        </div>

        <div class="export-card">
          <div class="export-icon">📋</div>
          <div class="export-title">備份：庫存清冊</div>
          <div class="export-desc">下載所有品項的目前庫存數量、類別、群組與狀態，適合存檔或給主管確認。</div>
          <div class="export-preview" id="preview-inv">共 <b id="prev-inv-count">0</b> 筆品項</div>
          <button class="btn btn-success export-btn" onclick="exportInventory()">⬇ 下載庫存清冊</button>
        </div>

        <div class="export-card">
          <div class="export-icon">📈</div>
          <div class="export-title">異動紀錄同步</div>
          <div class="export-desc">下載所有進貨與領取的歷史紀錄，包含時間、人員、品項與前後庫存量。如果你有時候會先把新紀錄手動寫在 Excel 裡，填好後可以直接在這裡上傳，系統會自動比對、只把系統裡還沒有的新紀錄補進來，已經同步過的不會重複新增。</div>
          <div class="export-preview">共 <b id="prev-log-count">0</b> 筆紀錄</div>
          <button class="btn btn-accent export-btn" onclick="exportLogs()">⬇ 下載異動紀錄</button>
          <button class="btn export-btn" style="margin-top:8px;" onclick="document.getElementById('log-import-input').click()">⬆ 上傳異動紀錄</button>
          <input type="file" id="log-import-input" accept=".xlsx,.xls" style="display:none" onchange="handlePpeLogImport(event)">
        </div>

        <div class="export-card">
          <div class="export-icon">✏️</div>
          <div class="export-title">盤點匯入</div>
          <div class="export-desc">下載盤點表現場清點填數字，或直接把清點好的 Excel（含「品項名稱」＋「目前庫存／實際清點」欄位）上傳，系統會自動比對差異、產生「盤點調整」紀錄，不用再手動一筆筆輸入。</div>
          <div class="export-preview">包含所有 <b id="prev-count-count">0</b> 個品項</div>
          <button class="btn export-btn" onclick="exportCountSheet()">⬇ 下載盤點表</button>
          <button class="btn btn-accent export-btn" style="margin-top:8px;" onclick="document.getElementById('count-import-input').click()">⬆ 上傳盤點結果</button>
          <input type="file" id="count-import-input" accept=".xlsx,.xls" style="display:none" onchange="handlePpeCountImport(event)">
        </div>

        <div class="export-card">
          <div class="export-icon">🛒</div>
          <div class="export-title">備份：採購申請</div>
          <div class="export-desc">下載所有同事提出的採購裝備申請，包含品項、數量、需求人員、編輯人員與採購狀態。</div>
          <div class="export-preview">共 <b id="prev-purchase-count">0</b> 筆申請</div>
          <button class="btn export-btn" onclick="exportPurchases()">⬇ 下載採購申請</button>
        </div>

      </div>
    </div>

    <\!-- 裝備管理 -->
    <div class="page" id="page-manage">
      <div id="delete-confirm-bar" style="display:none"></div>
      <div class="manage-toolbar">
        <button class="btn btn-accent" onclick="openAddModal()">＋ 新增裝備</button>
        <input class="form-input" id="manage-search" placeholder="搜尋品項名稱…" oninput="renderManageTable()" style="max-width:240px">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>品項名稱</th>
              <th>類別</th>
              <th>群組</th>
              <th style="text-align:center">目前庫存</th>
              <th style="text-align:center">操作</th>
            </tr>
          </thead>
          <tbody id="manage-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<\!-- 進貨/領取 Modal -->

<script>
/* ============================= 雲端資料層（Google 試算表） =============================
   這個模組原本把資料存在瀏覽器 localStorage（ppe_inv / ppe_logs / ppe_purchases），
   另外再用「連結 Excel」(File System Access API) 寫回本機檔案。那個作法有兩個問題：
     1. 換一台電腦 / 換瀏覽器就看不到資料；
     2. 「匯入 Excel」會整包覆蓋現有庫存，選錯檔案就整份資料不見。
   現已全面改為直接讀寫 Google 試算表的三個分頁（與系統其他模組同一個後端）：
     防護具品項清單 / 防護具異動紀錄 / 防護具採購申請
   注意：這份 HTML 是用 iframe srcdoc 載入的，屬於獨立的執行環境，
   沒辦法直接呼叫外層主程式的 apiList / apiUpsert，所以這裡自帶一份最小的 API helper。
*/
const PPE_API_URL = 'https://script.google.com/macros/s/AKfycbxReHCmCeF1kPhYlxFSOzZv2dgnHAkvsh6i9LD91lSFM_gx8RJzb8Hl84_CfGU6qe_S/exec';
const PPE_BOOK = 'cctv';
const SHEET_ITEMS = '防護具品項清單';
const SHEET_LOGS = '防護具異動紀錄';
const SHEET_PURCHASES = '防護具採購申請';

// iframe srcdoc 的 storage origin 在多數瀏覽器是隔離的，讀不到主頁存的名字時就重問一次。
function getCurrentUser() {
  let u = '';
  try { u = localStorage.getItem('cctv-current-user') || ''; } catch (e) { u = ''; }
  if (!u) {
    u = (prompt('請輸入您的姓名（用於紀錄建立/修改人員，僅需輸入一次）：', '') || '').trim() || '未知人員';
    try { localStorage.setItem('cctv-current-user', u); } catch (e) {}
  }
  return u;
}

/* ── 處理中提示：用計數器，重疊的請求不會提早把提示收起來 ── */
let __ppeBusy = 0;
function showBusy(msg) {
  __ppeBusy++;
  const m = document.getElementById('ppe-busy-msg');
  if (m) m.textContent = msg || '處理中...';
  const el = document.getElementById('ppe-busy');
  if (el) el.classList.add('show');
}
function hideBusy() {
  __ppeBusy = Math.max(0, __ppeBusy - 1);
  if (__ppeBusy > 0) return;
  const el = document.getElementById('ppe-busy');
  if (el) el.classList.remove('show');
}
// 按下去的那顆按鈕在等待期間變成停用 +「儲存中...」，避免重複送出、也讓人知道沒有當掉。
// label 傳 null 代表只停用不改文字（例如卡片上的小按鈕）。
async function withButton(btn, label, fn) {
  let original = null;
  if (btn) {
    original = btn.textContent;
    btn.classList.add('busy');
    if ('disabled' in btn) btn.disabled = true;
    if (label) btn.textContent = label;
  }
  try {
    return await fn();
  } finally {
    if (btn) {
      btn.classList.remove('busy');
      if ('disabled' in btn) btn.disabled = false;
      if (label) btn.textContent = original;
    }
  }
}

async function ppeApiList(sheet) {
  showBusy('讀取中...');
  try {
    const url = PPE_API_URL + '?action=list&book=' + PPE_BOOK + '&sheet=' + encodeURIComponent(sheet);
    const res = await fetch(url);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '讀取失敗');
    return json.data || [];
  } finally { hideBusy(); }
}
async function ppeApiUpsert(sheet, record) {
  showBusy('儲存中...');
  try {
    const payload = { action: 'upsert', book: PPE_BOOK, sheet: sheet, record: record, user: getCurrentUser() };
    const res = await fetch(PPE_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '寫入失敗');
    return json.data;
  } finally { hideBusy(); }
}
async function ppeApiDelete(sheet, idValue) {
  showBusy('刪除中...');
  try {
    const payload = { action: 'delete', book: PPE_BOOK, sheet: sheet, id: idValue };
    const res = await fetch(PPE_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '刪除失敗');
  } finally { hideBusy(); }
}

/* ── 小工具 ── */
function uid(prefix) { return (prefix || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function num(v) { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; }
function pad2(n) { return String(n).padStart(2, '0'); }
function fmtTime(d) { return d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
// Google 試算表如果把「2026/09/09 10:35」這格認成日期，apiList 會回傳 ISO 字串，這裡轉回原本的顯示格式。
function cleanTime(v) {
  if (v == null || v === '') return '';
  const s = String(v);
  if (/^\\d{4}-\\d{2}-\\d{2}T/.test(s)) {
    const d = new Date(s);
    if (!isNaN(d.getTime())) {
      const t = fmtTime(d);
      return t.slice(-6) === ' 00:00' ? t.slice(0, -6) : t;
    }
  }
  return s;
}

/* ── 群組：程式內用英文 key，試算表存中文名稱 ── */
const GROUPS = [
  { key: 'main', label: '主要裝備' },
  { key: 'vest', label: '背心' },
  { key: 'shoe', label: '安全鞋' },
  { key: 'taichung', label: '台中端' },
  { key: 'other', label: '其他' }
];
function groupLabel(g) { const f = GROUPS.find(x => x.key === g); return f ? f.label : (g || '其他'); }
function groupKey(v) {
  const s = String(v == null ? '' : v).trim();
  const byLabel = GROUPS.find(x => x.label === s);
  if (byLabel) return byLabel.key;
  const byKey = GROUPS.find(x => x.key === s);
  return byKey ? byKey.key : 'other';
}

/* ── 分頁欄位 <-> 程式物件 對應 ── */
function itemToRow(i) {
  return { '品項ID': i.id || '', '類別': i.cat || '', '品項名稱': i.name || '', '群組': groupLabel(i.group),
           '目前庫存': i.qty, '期初庫存': (i.base === '' || i.base == null) ? '' : i.base, '備註': i.note || '' };
}
function itemFromRow(s) {
  return { id: String(s['品項ID'] == null ? '' : s['品項ID']).trim(), cat: String(s['類別'] == null ? '' : s['類別']),
           name: String(s['品項名稱'] == null ? '' : s['品項名稱']), group: groupKey(s['群組']),
           qty: num(s['目前庫存']), base: (s['期初庫存'] === '' || s['期初庫存'] == null) ? '' : num(s['期初庫存']),
           note: s['備註'] == null ? '' : String(s['備註']) };
}
function logToRow(l) {
  return { '紀錄ID': l.id || '', '時間': l.time || '', '類型': l.typeLabel || '', '品項名稱': l.name || '',
           '異動數量': l.delta, '人員或事由': l.person || '', '備註': l.note || '',
           '異動前庫存': l.prev === '' || l.prev == null ? '' : l.prev, '異動後庫存': l.after === '' || l.after == null ? '' : l.after };
}
function logFromRow(s) {
  const delta = num(s['異動數量']);
  return { id: String(s['紀錄ID'] == null ? '' : s['紀錄ID']).trim(), time: cleanTime(s['時間']),
           typeLabel: String(s['類型'] == null ? '' : s['類型']).trim(), name: String(s['品項名稱'] == null ? '' : s['品項名稱']),
           delta: delta, qty: Math.abs(delta), person: String(s['人員或事由'] == null ? '' : s['人員或事由']),
           note: s['備註'] == null ? '' : String(s['備註']),
           prev: s['異動前庫存'] === '' || s['異動前庫存'] == null ? '' : num(s['異動前庫存']),
           after: s['異動後庫存'] === '' || s['異動後庫存'] == null ? '' : num(s['異動後庫存']) };
}
function purchaseToRow(p) {
  return { '申請ID': p.id || '', '品項': p.item || '', '數量': p.qty, '需求人員': p.requester || '',
           '編輯人員': p.editor || '', '登記時間': p.time || '', '狀態': p.status === 'done' ? '已採購' : '待採購' };
}
function purchaseFromRow(s) {
  const st = String(s['狀態'] == null ? '' : s['狀態']);
  return { id: String(s['申請ID'] == null ? '' : s['申請ID']).trim(), item: String(s['品項'] == null ? '' : s['品項']),
           qty: num(s['數量']), requester: String(s['需求人員'] == null ? '' : s['需求人員']),
           editor: String(s['編輯人員'] == null ? '' : s['編輯人員']), time: cleanTime(s['登記時間']),
           status: st.indexOf('已採購') >= 0 ? 'done' : 'pending' };
}

/* ── 記憶體中的資料（來源一律是雲端，這裡只是快取，方便畫面即時更新）── */
let inventory = [];
let logs = [];
let purchases = [];
let modalType = 'in';
let preselect = null;
let pendingDeleteId = null;
let editingPurchaseId = null;

function setSyncStatus(state, text) {
  const bar = document.getElementById('sync-status-bar');
  if (bar) { bar.className = 'subtitle' + (state ? ' sync-' + state : ''); bar.textContent = text; }
  const prev = document.getElementById('cloud-status-preview');
  if (prev) prev.textContent = text;
}

async function loadAll() {
  setSyncStatus('writing', '⏳ 正在讀取雲端資料…');
  try {
    const [itemRows, logRows, purchaseRows] = await Promise.all([
      ppeApiList(SHEET_ITEMS), ppeApiList(SHEET_LOGS), ppeApiList(SHEET_PURCHASES)
    ]);
    inventory = itemRows.map(itemFromRow).filter(i => i.id && i.name);
    logs = logRows.map(logFromRow).filter(l => l.id);
    purchases = purchaseRows.map(purchaseFromRow).filter(p => p.id);
    setSyncStatus('ok', '☁ 已連接雲端資料庫，所有操作即時同步');
    return true;
  } catch (err) {
    console.error(err);
    setSyncStatus('err', '❌ 雲端讀取失敗：' + (err && err.message ? err.message : err));
    showToast('雲端讀取失敗，請確認 Google 試算表已建立「防護具品項清單 / 防護具異動紀錄 / 防護具採購申請」三個分頁');
    return false;
  }
}
async function reloadAll(btn) {
  await withButton(btn, '讀取中...', async () => { await loadAll(); renderAll(); });
  showToast('已重新讀取雲端資料');
}

// 一筆異動：先寫「異動紀錄」，再更新「品項清單」的目前庫存。兩個都成功才更新畫面。
// time 可以不傳，不傳就用「現在」；表單上加了日期時間欄位後，補登以前的紀錄就會傳實際發生的時間進來。
async function commitTransaction(item, delta, typeLabel, person, note, time) {
  const prev = item.qty;
  const after = prev + delta;
  const log = { id: uid('r'), time: time || fmtTime(new Date()), typeLabel: typeLabel, name: item.name,
                delta: delta, qty: Math.abs(delta), person: person || '', note: note || '', prev: prev, after: after };
  await ppeApiUpsert(SHEET_LOGS, logToRow(log));
  const updated = Object.assign({}, item, { qty: after });
  await ppeApiUpsert(SHEET_ITEMS, itemToRow(updated));
  item.qty = after;
  logs.push(log);
  return log;
}
function statusClass(q) { return q===0?'zero':q<=4?'low':'ok'; }
function statusLabel(q) { return q===0?'❌ 缺貨':q<=4?'⚠️ 偏低':'✅ 充足'; }
function pillClass(q) { return q===0?'pill-zero':q<=4?'pill-low':'pill-ok'; }
function barColor(q) { return q===0?'#E24B4A':q<=4?'#BA7517':'#1D9E75'; }

function renderAll() {
  renderStats(); renderOverview(); renderCharts(); renderLow(); renderLog(); renderManageTable(); renderPurchase(); updateLowBadge(); updatePurchaseBadge(); updateExportCounts();
}

function renderStats() {
  const okC = inventory.filter(i=>i.qty>=5).length;
  const lowC = inventory.filter(i=>i.qty>0&&i.qty<5).length;
  const zeroC = inventory.filter(i=>i.qty===0).length;
  document.getElementById('stats-row').innerHTML = \`
    <div class="stat-card"><div class="stat-label">品項總數</div><div class="stat-val">\${inventory.length}</div></div>
    <div class="stat-card"><div class="stat-label">庫存充足</div><div class="stat-val ok">\${okC}</div></div>
    <div class="stat-card"><div class="stat-label">庫存偏低</div><div class="stat-val low">\${lowC}</div></div>
    <div class="stat-card"><div class="stat-label">缺貨品項</div><div class="stat-val zero">\${zeroC}</div></div>\`;
}

function renderOverview() {
  const groups = [{key:'main',label:'主要裝備'},{key:'vest',label:'背心'},{key:'shoe',label:'安全鞋'},{key:'taichung',label:'台中端'},{key:'other',label:'其他'}];
  let html = '';
  groups.forEach(g => {
    const items = inventory.filter(i=>i.group===g.key);
    if (!items.length) return;
    html += \`<div class="sec-title">\${g.label}</div><div class="inv-grid">\`;
    items.forEach(item => {
      const sc = statusClass(item.qty);
      html += \`<div class="inv-card">
        <button class="del-btn" title="刪除此品項" onclick="askDelete('\${item.id}')">×</button>

function renderBarList(id, items) {
  if (!items.length) { document.getElementById(id).innerHTML='<div class="empty">無品項</div>'; return; }
  const max = Math.max(...items.map(i=>i.qty), 1);
  document.getElementById(id).innerHTML = items.map(item => {
    const pct = Math.round(item.qty/max*100);
    return \`<div class="bar-row">
      <div class="bar-label">\${item.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:\${pct}%;background:\${barColor(item.qty)}"></div></div>
      <div class="bar-val">\${item.qty}</div>
    </div>\`;
  }).join('');
}

function startEditPurchase(id) {

function closePurchaseModal() { document.getElementById('purchase-overlay').classList.remove('open'); editingPurchaseId = null; }
function closePurchaseOutside(e) { if(e.target===document.getElementById('purchase-overlay')) closePurchaseModal(); }
async function submitPurchase() {
  const btn = document.getElementById('purchase-submit-btn');
  const item = document.getElementById('purchase-item').value.trim();
  const qty = parseInt(document.getElementById('purchase-qty').value, 10);
  const requester = document.getElementById('purchase-requester').value.trim();
  const editor = document.getElementById('purchase-editor').value.trim();
  if (!item) { showToast('請填寫品項'); return; }
  if (!qty || qty < 1) { showToast('請輸入有效數量'); return; }
  const time = fmtTime(new Date());
  const editingId = editingPurchaseId;
  const existing = editingId ? purchases.find(x=>x.id===editingId) : null;
  const rec = existing
    ? Object.assign({}, existing, { item: item, qty: qty, requester: requester, editor: editor, time: time })
    : { id: uid('p'), item: item, qty: qty, requester: requester, editor: editor, time: time, status: 'pending' };
  try {
    await withButton(btn, '儲存中...', () => ppeApiUpsert(SHEET_PURCHASES, purchaseToRow(rec)));
  } catch (err) {
    showToast('儲存失敗：' + (err && err.message ? err.message : err));
    return;
  }
  if (existing) { Object.assign(existing, rec); showToast('採購申請已更新'); }
  else { purchases.push(rec); showToast('採購申請已新增'); }
  renderAll(); closePurchaseModal();
}
async function togglePurchaseDone(id, el) {
  const p = purchases.find(x=>x.id===id); if (!p) return;
  const next = p.status==='done' ? 'pending' : 'done';
  try {
    await withButton(el, null, () => ppeApiUpsert(SHEET_PURCHASES, purchaseToRow(Object.assign({}, p, { status: next }))));
  } catch (err) { showToast('更新失敗：' + (err && err.message ? err.message : err)); return; }
  p.status = next;
  renderAll();
}
async function deletePurchase(id, btn) {
  const p = purchases.find(x=>x.id===id); if (!p) return;
  if (!confirm(\`確定要刪除「\${p.item}」的採購申請嗎？\`)) return;
  try {
    await withButton(btn, '刪除中...', () => ppeApiDelete(SHEET_PURCHASES, id));
  } catch (err) { showToast('刪除失敗：' + (err && err.message ? err.message : err)); return; }
  purchases = purchases.filter(x=>x.id!==id);
  renderAll();
  showToast('採購申請已刪除');
}

function startEdit(id, field) {
  document.getElementById(\`\${field}-display-\${id}\`).style.display='none';
  const inp = document.getElementById(\`\${field}-edit-\${id}\`);
  inp.style.display='inline-block';
  inp.focus(); inp.select();
}
async function saveEdit(id, field) {
  const inp = document.getElementById(\`\${field}-edit-\${id}\`);
  if (!inp || inp.dataset.saving === '1') return;
  const val = inp.value.trim();
  const item = inventory.find(i=>i.id===id);
  const closeBack = () => { inp.style.display='none'; const d = document.getElementById(\`\${field}-display-\${id}\`); if (d) d.style.display='inline'; };
  if (!item || !val || val === item[field]) { closeBack(); return; }
  inp.dataset.saving = '1'; inp.disabled = true;
  try {
    await ppeApiUpsert(SHEET_ITEMS, itemToRow(Object.assign({}, item, { [field]: val })));
  } catch (err) {
    inp.dataset.saving = ''; inp.disabled = false;
    showToast('儲存失敗：' + (err && err.message ? err.message : err));
    return;
  }
  item[field] = val;
  renderAll();
  showToast('已更新「' + item.name + '」');
}
function editKeydown(e, id, field) {
  if (e.key==='Enter') { e.target.blur(); }
  if (e.key==='Escape') { e.target.style.display='none'; document.getElementById(\`\${field}-display-\${id}\`).style.display='inline'; }
}

// ── 進貨/領取 Modal ──
// datetime-local 欄位要的格式是 "YYYY-MM-DDTHH:MM"（沒有秒），這裡用目前時間當預設值。
function nowForDatetimeLocal() {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
// 把表單填的日期時間轉成系統統一的顯示格式；沒填或格式看不懂就直接用現在時間。
function datetimeLocalToFmt(v) {
  if (!v) return fmtTime(new Date());
  const d = new Date(v);
  return isNaN(d.getTime()) ? fmtTime(new Date()) : fmtTime(d);
}
function openModal(type, itemId) {
  modalType = type; preselect = itemId||null; setType(type);
  const sel = document.getElementById('sel-item');
  sel.innerHTML = inventory.map(i=>\`<option value="\${i.id}">\${i.name}（剩 \${i.qty}）</option>\`).join('');
  if (preselect) sel.value = preselect;
  document.getElementById('inp-qty').value=1;
  document.getElementById('inp-time').value = nowForDatetimeLocal();
  document.getElementById('inp-person').value='';
  document.getElementById('inp-note').value='';
  document.getElementById('overlay').classList.add('open');
}
function setType(t) {
  modalType=t;
  document.getElementById('tab-in').className='action-tab'+(t==='in'?' active-in':'');
  document.getElementById('tab-out').className='action-tab'+(t==='out'?' active-out':'');
  document.getElementById('modal-submit').className='btn '+(t==='in'?'btn-success':'btn-danger');
  document.getElementById('modal-submit').textContent=t==='in'?'確認進貨':'確認領取';
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
function closeModalOutside(e) { if(e.target===document.getElementById('overlay')) closeModal(); }
async function submitModal() {
  const btn=document.getElementById('modal-submit');
  const id=document.getElementById('sel-item').value;
  const qty=parseInt(document.getElementById('inp-qty').value,10);
  const person=document.getElementById('inp-person').value.trim();
  const note=document.getElementById('inp-note').value.trim();
  if(!qty||qty<1){showToast('請輸入有效數量');return;}
  const item=inventory.find(i=>i.id===id); if(!item)return;
  if(modalType==='out'&&qty>item.qty){
    // 目前庫存可能因為之前「領取後歸還但未恢復庫存」之類的狀況已經是 0 或負數，
    // 這種情況下還是要讓使用者能把「實際發生的領取」記下來，只是要跳出來提醒一下，
    // 不能像以前一樣直接擋掉、讓紀錄整筆消失卻沒有任何提示。
    const proceed = confirm(\`\${item.name} 目前庫存僅剩 \${item.qty} 件，登記後將變成 \${item.qty - qty} 件（負數代表帳面已經對不上，可能是先前有未計入的異動）。\n\n確定仍要登記這筆領取嗎？\`);
    if (!proceed) return;
  }
  const typeLabel = modalType==='in' ? '進貨' : '領取';
  const delta = modalType==='in' ? qty : -qty;
  const time = datetimeLocalToFmt(document.getElementById('inp-time').value);
  try {
    await withButton(btn, '儲存中...', () => commitTransaction(item, delta, typeLabel, person, note, time));
  } catch (err) {
    showToast('儲存失敗：' + (err && err.message ? err.message : err));
    return;
  }
  renderAll(); closeModal();
  showToast(\`\${item.name} \${typeLabel} \${qty} 件，剩餘 \${item.qty} 件\`);
}

// ── 核心：用 SheetJS 產生 xlsx ──
function downloadXlsx(rows, sheetName, filename, opts) {
  if (typeof XLSX === 'undefined') { showToast('Excel 套件載入中，請稍後再試…'); return; }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);

function parseCountFile(wb) {

    const qtyKey = QTY_KEYS.find(k => headers.includes(k));

// ── 異動紀錄匯入：如果你有時候是先把新的進貨/領取寫在 Excel 裡，再用這個功能一次同步 ──
// 因為 Excel 裡的每一列沒有系統的「紀錄ID」，比對重複只能靠「時間＋品項＋數量＋人員」四個欄位
// 是否完全一樣：一樣的話視為已經同步過（跳過，不重複新增），不一樣才當成新紀錄寫入。
// 所以上傳前系統會先列出「即將新增」的清單讓你確認一次，不會靜默寫入。
function normalizeExcelTime(v) {
  let t = '';
  if (v instanceof Date && !isNaN(v.getTime())) {
    t = fmtTime(v);
  } else if (v == null || v === '') {
    return '';
  } else {
    const s = String(v).trim();
    const m = s.match(/^(\\d{4})\\/(\\d{1,2})\\/(\\d{1,2})(?:[ T](\\d{1,2}):(\\d{1,2}))?/);
    if (m) {
      const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]), Number(m[4]||0), Number(m[5]||0));
      if (!isNaN(d.getTime())) t = fmtTime(d);
      else return s;
    } else {
      return s;
    }
  }
  // 跟 cleanTime() 的規則保持一致：原始資料只有日期、沒有時間的情況，系統既有紀錄讀進來也會把
  // 「 00:00」去掉，這裡要用同一套規則，不然這種資料每次都會被誤判成系統裡還沒有的新紀錄。

// 對不齊是正常的，不是資料錯誤），如果連分鐘都要求完全一樣，反而會讓明明已經同步過的紀錄被誤判
// 成新紀錄、重複匯入。同一天、同品項、同數量、同人員，就視為同一筆。
function txSignature(time, name, delta, person) {
  const datePart = String(time || '').split(' ')[0];
  return datePart + '|' + name + '|' + Math.round(Number(delta)||0) + '|' + String(person||'').trim();
}
function parseTransactionFile(wb) {
  const REQUIRED = ['時間', '類型', '品項名稱', '異動數量'];
  let best = null;
  wb.SheetNames.forEach(sn => {
    let json;
    try { json = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval: '' }); } catch (e) { return; }
    if (!json.length) return;
    const headers = Object.keys(json[0]);
    if (!REQUIRED.every(k => headers.includes(k))) return;
    const rows = json.map(r => ({
      time: normalizeExcelTime(r['時間']),
      typeLabel: String(r['類型']||'').trim(),
      name: String(r['品項名稱']||'').trim(),
      delta: r['異動數量'],
      person: String(r['人員/事由']||r['人員或事由']||'').trim(),
      note: String(r['備註']||'').trim()
    })).filter(r => r.name && r.time);
    if (!best || rows.length > best.rows.length) best = { sheetName: sn, rows };
  });

}
async function handlePpeLogImport(event) {
  const file = event.target.files[0];

  let wb;

    wb = XLSX.read(buf, { type: 'array', cellDates: true });
  } catch (err) {

    return;
  }

  if (!parsed) {
    alert('在這份 Excel 裡找不到可辨識的「時間／類型／品項名稱／異動數量」欄位。\\n\\n請確認格式跟「下載異動紀錄」的備份範本一致。');

    if (!item) { unmatched.push(r.name); return; }
    const deltaRounded = Math.round(delta);
    const sig = txSignature(r.time, r.name, deltaRounded, r.person);
    if (existingKeys.has(sig)) { skippedCount++; return; }

  if (skippedCount) subText += '（另有 ' + skippedCount + ' 筆內容與系統已有的紀錄完全相同，視為已同步過，不會重複新增。）';

      + '<td style="padding:8px;">' + r.person + '</td>'

  const warn = [];
  if (unmatched.length) warn.push('⚠ 有 ' + unmatched.length + ' 個品項名稱在系統中找不到對應，未列入：' + unmatched.slice(0,10).join('、') + (unmatched.length>10?'…':''));

// 跟 commitTransaction 幾乎一樣，差別只在時間用 Excel 原本記錄的時間，不是「現在」。
async function commitImportedTransaction(item, delta, typeLabel, person, note, time) {
  const prev = item.qty;
  const after = prev + delta;
  const log = { id: uid('r'), time: time, typeLabel: typeLabel, name: item.name,
                delta: delta, qty: Math.abs(delta), person: person || '', note: note || '', prev: prev, after: after };
  await ppeApiUpsert(SHEET_LOGS, logToRow(log));
  const updated = Object.assign({}, item, { qty: after });
  await ppeApiUpsert(SHEET_ITEMS, itemToRow(updated));
  item.qty = after;
  logs.push(log);
  return log;
}

  const items = pendingLogImports;

  await withButton(btn, '寫入中...', async () => {
    for (const r of items) {
      const noteText = (r.note ? r.note + '　' : '') + '(Excel 匯入同步)';
