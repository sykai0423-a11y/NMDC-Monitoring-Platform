    border:1px solid #C7D2E8;
    background:#fff;
    width:100%;
    text-align:center;
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    outline:none;
    border-radius:6px;
    padding:5px 4px;
    cursor:text;
  }
  thead th .colname:hover{border-color:var(--steel);}
  thead th .colname:focus{border-color:var(--steel);box-shadow:0 0 0 2px rgba(74,111,165,.15);}
  thead th .colname::placeholder{color:#93A0BC;}
  thead th .rm-col{
    position:absolute;
    top:2px; right:2px;
    width:16px;height:16px;
    line-height:14px;
    font-size:11px;
    border-radius:50%;
    background:transparent;
    color:#B0B8C8;
    cursor:pointer;
  }
  thead th .rm-col:hover{background:#FCE8E8;color:#C0392B;}

  td.note-cell{padding:6px 10px;}
  .note-input{
    width:100%;
    border:1px solid var(--line-soft);
    background:#fff;
    font-size:12px;
    color:var(--ink);
    outline:none;
    border-radius:6px;
    padding:6px 8px;
  }
  .note-input:hover{border-color:var(--steel);}
  .note-input:focus{border-color:var(--steel);box-shadow:0 0 0 2px rgba(74,111,165,.15);}
  .note-input::placeholder{color:#93A0BC;}

  tbody tr{border-bottom:1px solid var(--line-soft);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:#FAFBFE;}
  td.item{
    padding:11px 20px;
  }
  td.item .zh{font-size:14px;font-weight:600;color:var(--ink);}
  td.item .en{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  td.chk{text-align:center;}

  .checkbox{
    width:20px;height:20px;
    border:1.6px solid #B7C3DC;
    border-radius:5px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:all .12s ease;
    background:#fff;
  }
  .checkbox:hover{border-color:var(--steel);}
  .checkbox.checked{
    background:var(--accent);
    border-color:var(--accent);
  }
  .checkbox.checked::after{
    content:"";
    width:5px;height:9px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(45deg) translate(-1px,-1px);
  }

  .add-col-cell{
    width:40px;
    text-align:center;
    vertical-align:middle;
  }
  .add-col-btn{
    width:26px;height:26px;
    border-radius:50%;
    background:var(--line-soft);
    color:var(--navy);
    font-size:16px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .add-col-btn:hover{background:var(--line);}

  .rm-row{
    width:22px;height:22px;
    border-radius:50%;
    color:#B0B8C8;
    font-size:13px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:opacity .1s ease;
  }
  tr:hover .rm-row{opacity:1;}
  .rm-row:hover{background:#FCE8E8;color:#C0392B;}

  tr.add-row td{
    padding:0;
    border-bottom:none;
  }
  .add-row-btn{
    width:100%;
    text-align:left;
    padding:10px 20px;
    background:transparent;
    color:var(--steel);
    font-size:13px;
    font-weight:600;
  }
  .add-row-btn:hover{background:var(--line-soft);}
  .add-row-btn::before{content:"+ ";}

  .new-item-form{
    display:flex;
    gap:8px;
    padding:10px 20px;
    flex-wrap:wrap;
    background:#FAFBFE;
    align-items:center;
  }
  .new-item-form input{
    font-family:inherit;
    font-size:13px;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    outline:none;
  }
  .new-item-form input:focus{border-color:var(--steel);}
  .new-item-form input.zh{flex:1;min-width:160px;}
  .new-item-form input.en{flex:2;min-width:200px;}
  .new-item-form .btn{padding:7px 12px;font-size:12.5px;}

  footer{
    text-align:center;
    margin-top:28px;
    font-size:12px;
    color:var(--ink-soft);
  }

  @media (max-width:640px){
    .masthead{padding:22px 18px;}
    .masthead h1{font-size:21px;}
    td.item{padding:10px 12px;}
    thead th.item-col{padding-left:12px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="brand">N M D C · E N E R G Y</div>
    <h1>CCTV 工作事項分類表</h1>
    <div class="sub">CCTV Task Classification Overview</div>
    <div class="meta">
      <span>據點 <b>台中端 · 通霄端</b></span>
      <span>共 <b id="total-count">22</b> 項工作</span>
    </div>
  </div>

  <div class="toolbar">
    <div class="label">每列可直接勾選；欄位標題可點擊改成人名（如：Kai／志明），右上角「+」可新增更多欄</div>
    <div class="actions">
      <button class="btn ghost" id="export-word-btn">匯出 Word</button>
      <button class="btn ghost" id="reset-btn">全部清空</button>
      <span class="save-state" id="save-state">已載入</span>
    </div>
  </div>

  <div id="sections"></div>

  <footer>2026.08.24 · 資料自動儲存於此裝置</footer>
</div>

<script>
const SECTION_META = [
  { id: "recurring", zh: "固定型 Recurring", en: "常態／持續性工作 Ongoing Duties" },
  { id: "onetime", zh: "任務型 One-Time", en: "單次執行，完成即結束 Project-Based Tasks" },
  { id: "applications", zh: "行政申請 Applications", en: "文件／證件申請作業 Administrative Applications" },
];

const DEFAULT_ITEMS = {
  recurring: [
    ["CCTV 監視系統", "CCTV Surveillance System"],
    ["100 吋電視牆後台維護與更新", "100-Inch Video Wall Backend Maintenance & Updates"],
    ["AI 安全帽辨識系統(含 UWB)缺失通報處理", "AI Safety Helmet Recognition System (incl. UWB) – Violation Reporting"],
    ["微氣象後台維護與更新", "Micro-Weather Station Backend Maintenance & Updates"],
    ["全民督工網站維護", "Public Construction Supervision Website Maintenance"],
    ["門禁管制系統維護(含太陽能系統)", "Access Control System Maintenance (incl. Solar Power System)"],
    ["門禁卡登錄作業", "Access Card Registration"],
    ["各系統後台管理", "Cross-System Backend Administration"],
  ],
  onetime: [
    ["門禁管制三叉機維護", "Access Control Turnstile Maintenance"],
    ["貨櫃鐵門維修", "Container Steel Door Repair"],
    ["柵欄機 (台中)", "Barrier Gate (Taichung)"],
    ["剪刀門安裝 (通霄)", "Scissor Gate Installation (Tongxiao)"],
    ["紅外線系統", "Infrared System"],
    ["GPS 系統", "GPS System"],
    ["PMIS 系統 (發文)", "PMIS System (Correspondence)"],
  ],
  applications: [
    ["PPCO 出入證資料申請", "PPCO Access Badge Application"],
    ["危害告知申請", "Hazard Notification Application"],
    ["加班單申請", "Overtime Application"],
    ["車輛通行證申請", "Vehicle Pass Application"],
    ["機具放行單申請", "Equipment Release Permit Application"],
    ["物品攜入攜出單申請", "Item In/Out Permit Application"],
    ["電廠出入證申請", "Power Plant Access Badge Application"],
  ],
};

const STORAGE_KEY = "cctv-checklist-state-v4";
const DEFAULT_COLUMNS = ["", "", ""];

/* ============================= 雲端同步（改用 Google Sheet，取代原本的 window.storage）============================= */
const WT_API_URL = 'https://script.google.com/macros/s/AKfycbxReHCmCeF1kPhYlxFSOzZv2dgnHAkvsh6i9LD91lSFM_gx8RJzb8Hl84_CfGU6qe_S/exec';
const WT_BOOK = 'cctv';
const WT_SHEET = '工作事項分類表設定';
const WT_RECORD_ID = 'checklist_state';

async function wtApiLoad(){
  const url = \`\${WT_API_URL}?action=list&book=\${WT_BOOK}&sheet=\${encodeURIComponent(WT_SHEET)}\`;
  const res = await fetch(url);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || '讀取失敗');
  const row = (json.data || []).find(r => r['設定ID'] === WT_RECORD_ID);
  return row ? row['資料內容'] : null;
}
async function wtApiSave(jsonString){
  const payload = { action: 'upsert', book: WT_BOOK, sheet: WT_SHEET, record: { '設定ID': WT_RECORD_ID, '資料內容': jsonString } };
  const res = await fetch(WT_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || '儲存失敗');
}


let state = {
  columns: [...DEFAULT_COLUMNS],
  checks: {}, // itemId -> [bool,...]
  items: {},  // sectionId -> [{id, zh, en}]
  notes: {},  // itemId -> string
};

let openAddForm = null; // sectionId currently showing the "new item" form

function ensureRowLength(id){
  const row = state.checks[id] || [];
  while(row.length < state.columns.length) row.push(false);
  state.checks[id] = row.slice(0, state.columns.length);
}

function totalItems(){
  return SECTION_META.reduce((n,s)=>n+(state.items[s.id]||[]).length,0);
}

async function loadState(){
  try{
    const res = await wtApiLoad();
    if(res){
      const parsed = JSON.parse(res);
      if(parsed.columns && parsed.columns.length) state.columns = parsed.columns;
      if(parsed.checks) state.checks = parsed.checks;
      if(parsed.items) state.items = parsed.items;
      if(parsed.notes) state.notes = parsed.notes;
    }
  }catch(e){
    // no saved state yet, use defaults
  }
  // fill in default items for any section not yet in saved state
  SECTION_META.forEach(sec=>{
    if(!state.items[sec.id]){
      state.items[sec.id] = DEFAULT_ITEMS[sec.id].map(([zh,en],i)=>({id:\`\${sec.id}-\${i}\`, zh, en}));
    }
  });
  SECTION_META.forEach(sec=>{
    state.items[sec.id].forEach(it=>ensureRowLength(it.id));
  });
}

let saveTimer = null;
function scheduleSave(){
  const el = document.getElementById("save-state");
  if(el) el.textContent = "儲存中…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await wtApiSave(JSON.stringify(state));
      if(el) el.textContent = "已儲存 ✓";
    }catch(e){
      if(el) el.textContent = "儲存失敗";
      console.error("storage set failed", e);
    }
  }, 350);
}

function render(){
  document.getElementById("total-count").textContent = totalItems();
  const root = document.getElementById("sections");
  root.innerHTML = "";

  SECTION_META.forEach(sec=>{
    const items = state.items[sec.id];
    const done = items.reduce((n,it)=>{
      const row = state.checks[it.id] || [];
      return n + (row.some(Boolean) ? 1 : 0);
    },0);
    const pct = items.length ? Math.round(done/items.length*100) : 0;

    const section = document.createElement("div");
    section.className = "section";
    section.dataset.secId = sec.id;

    section.innerHTML = \`
      <div class="section-head">
        <div class="titles">
          <div class="zh">\${sec.zh}　<span style="font-weight:400;font-size:12px;color:#C7D4EC;">\${items.length} 項 Items</span></div>
          <div class="en">\${sec.en}</div>
        </div>
        <div class="progress-pill">
          <span>\${done}/\${items.length||0} 已標記</span>
          <div class="progress-track"><div class="progress-fill" style="width:\${pct}%"></div></div>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th class="item-col">項目 Item</th>
            \${state.columns.map((c,ci)=>\`
              <th class="chk-col">
                <input class="colname" data-ci="\${ci}" value="\${escapeAttr(c)}" placeholder="欄\${ci+1}" />
                \${state.columns.length>1 ? \`<span class="rm-col" data-ci="\${ci}" title="刪除此欄">×</span>\` : ""}
              </th>
            \`).join("")}
            <th class="note-col">備註</th>
            <th class="add-col-cell"><span class="add-col-btn" data-sec="\${sec.id}" title="新增欄位">+</span></th>
          </tr>
        </thead>
        <tbody>
          \${items.map(it=>{
            const row = state.checks[it.id] || [];
            return \`
              <tr>
                <td class="item">
                  <div class="zh">▪ \${escapeHtml(it.zh)}</div>
                  <div class="en">\${escapeHtml(it.en)}</div>
                </td>
                \${state.columns.map((_,ci)=>\`
                  <td class="chk">
                    <span class="checkbox \${row[ci] ? "checked" : ""}" data-id="\${it.id}" data-ci="\${ci}"></span>
                  </td>
                \`).join("")}
                <td class="note-cell">
                  <input class="note-input" data-id="\${it.id}" value="\${escapeAttr(state.notes[it.id]||'')}" placeholder="備註" />
                </td>
                <td><span class="rm-row" data-sec="\${sec.id}" data-id="\${it.id}" title="刪除此項目">×</span></td>
              </tr>
            \`;
          }).join("")}
          <tr class="add-row">
            <td colspan="\${state.columns.length+3}">
              \${openAddForm===sec.id ? \`
                <div class="new-item-form">
                  <input class="zh" placeholder="項目名稱（中文）" id="new-zh-\${sec.id}" />
                  <input class="en" placeholder="Item name (English，可留空)" id="new-en-\${sec.id}" />
                  <button class="btn" data-sec="\${sec.id}" data-action="confirm-add">新增</button>
                  <button class="btn ghost" data-action="cancel-add">取消</button>
                </div>
              \` : \`
                <button class="add-row-btn" data-sec="\${sec.id}" data-action="open-add">新增項目</button>
              \`}
            </td>
          </tr>
        </tbody>
      </table>
    \`;
    root.appendChild(section);
  });

  // wire events
  root.querySelectorAll(".checkbox").forEach(box=>{
    box.addEventListener("click", ()=>{
      const id = box.dataset.id;
      const ci = parseInt(box.dataset.ci,10);
      ensureRowLength(id);
      state.checks[id][ci] = !state.checks[id][ci];
      box.classList.toggle("checked");
      updateSectionProgress(box.closest(".section"));
      scheduleSave();
    });
  });

  root.querySelectorAll(".colname").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const ci = parseInt(inp.dataset.ci,10);
      state.columns[ci] = inp.value;
      scheduleSave();
    });
  });

  root.querySelectorAll(".note-input").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const id = inp.dataset.id;
      state.notes[id] = inp.value;
      scheduleSave();
    });
  });

  root.querySelectorAll(".rm-col").forEach(x=>{
    x.addEventListener("click", ()=>{
      const ci = parseInt(x.dataset.ci,10);
      state.columns.splice(ci,1);
      Object.keys(state.checks).forEach(id=>{
        state.checks[id].splice(ci,1);
      });
      render();
      scheduleSave();
    });
  });

  root.querySelectorAll(".add-col-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.columns.push("");
      SECTION_META.forEach(sec=>state.items[sec.id].forEach(it=>ensureRowLength(it.id)));
      render();
      scheduleSave();
    });
  });

  root.querySelectorAll(".rm-row").forEach(x=>{
    x.addEventListener("click", ()=>{
      const secId = x.dataset.sec;
      const id = x.dataset.id;
      if(!confirm("確定要刪除這個項目嗎？")) return;
      state.items[secId] = state.items[secId].filter(it=>it.id!==id);
      delete state.checks[id];
      delete state.notes[id];
      render();
      scheduleSave();
    });
  });

  root.querySelectorAll('[data-action="open-add"]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      openAddForm = btn.dataset.sec;
      render();
      const inp = document.getElementById(\`new-zh-\${openAddForm}\`);
      if(inp) inp.focus();
    });
  });

  root.querySelectorAll('[data-action="cancel-add"]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      openAddForm = null;
      render();
    });
  });

  root.querySelectorAll('[data-action="confirm-add"]').forEach(btn=>{
    btn.addEventListener("click", ()=>submitNewItem(btn.dataset.sec));
  });

  root.querySelectorAll('.new-item-form input').forEach(inp=>{
    inp.addEventListener("keydown", (e)=>{
      if(e.key==="Enter"){
        const secId = inp.id.split("-").pop();
        submitNewItem(secId);
      }
    });
  });
}

function submitNewItem(secId){
  const zhInp = document.getElementById(\`new-zh-\${secId}\`);
  const enInp = document.getElementById(\`new-en-\${secId}\`);
  const zh = (zhInp && zhInp.value.trim()) || "";
  const en = (enInp && enInp.value.trim()) || "";
  if(!zh){
    if(zhInp) zhInp.focus();
    return;
  }
  const id = \`\${secId}-custom-\${Date.now()}\`;
  state.items[secId].push({id, zh, en});
  ensureRowLength(id);
  openAddForm = null;
  render();
  scheduleSave();
}

function escapeHtml(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function updateSectionProgress(sectionEl){
  if(!sectionEl) return;
  const secId = sectionEl.dataset.secId;
  const items = state.items[secId] || [];
  const done = items.reduce((n,it)=>{
    const row = state.checks[it.id] || [];
    return n + (row.some(Boolean) ? 1 : 0);
  },0);
  const pct = items.length ? Math.round(done/items.length*100) : 0;
  const pill = sectionEl.querySelector(".progress-pill span");
  const fill = sectionEl.querySelector(".progress-fill");
  if(pill) pill.textContent = \`\${done}/\${items.length||0} 已標記\`;
  if(fill) fill.style.width = pct + "%";
}

function escapeAttr(s){
  return String(s).replace(/"/g,"&quot;");
}

document.getElementById("reset-btn").addEventListener("click", ()=>{
  if(!confirm("確定要清空所有勾選狀態嗎？")) return;
  Object.keys(state.checks).forEach(id=>{
    state.checks[id] = state.checks[id].map(()=>false);
  });
  render();
  scheduleSave();
});

document.getElementById("export-word-btn").addEventListener("click", exportToWord);

function exportToWord(){
  const columns = state.columns.map((c,ci)=> (c && c.trim()) ? c.trim() : \`欄\${ci+1}\`);
  const today = new Date();
  const dateStr = \`\${today.getFullYear()}.\${String(today.getMonth()+1).padStart(2,"0")}.\${String(today.getDate()).padStart(2,"0")}\`;

  const sectionsHtml = SECTION_META.map(sec=>{
    const items = state.items[sec.id];
    const rows = items.map(it=>{
      const row = state.checks[it.id] || [];
      const chkCells = columns.map((_,ci)=>\`
        <td style="border:1px solid #B7C3DC;text-align:center;vertical-align:middle;width:70px;">
          <span style="font-size:16pt;font-family:'Segoe UI Symbol','DejaVu Sans',sans-serif;">\${row[ci] ? "☑" : "☐"}</span>
        </td>\`).join("");
      return \`
        <tr>
          <td style="border:1px solid #B7C3DC;padding:8px 12px;">
            <div style="font-weight:bold;font-size:11pt;color:#1A2233;">▪ \${escapeHtml(it.zh)}</div>
            \${it.en ? \`<div style="font-size:9.5pt;color:#5B6478;">\${escapeHtml(it.en)}</div>\` : ""}
          </td>
          \${chkCells}
        </tr>\`;
    }).join("");

    const headerCols = columns.map(c=>\`
      <td style="border:1px solid #B7C3DC;background-color:#D9E2F3;text-align:center;font-size:9.5pt;font-weight:bold;color:#1A2233;">\${escapeHtml(c)}</td>\`
    ).join("");

    return \`
      <table style="border-collapse:collapse;width:100%;margin-bottom:24px;" cellspacing="0" cellpadding="0">
        <tr>
          <td colspan="\${columns.length+1}" style="background-color:#1F3864;color:#ffffff;padding:10px 16px;">
            <span style="font-size:12.5pt;font-weight:bold;">\${sec.zh}</span>
            <span style="font-size:9.5pt;color:#C7D4EC;"> \${sec.en} － \${items.length} 項 Items</span>
          </td>
        </tr>
        <tr>
          <td style="border:1px solid #B7C3DC;background-color:#D9E2F3;padding:6px 12px;font-size:9.5pt;font-weight:bold;color:#5B6478;">項目 Item</td>
          \${headerCols}
        </tr>
        \${rows}
      </table>\`;
  }).join("");

  const html = \`<!doctype html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<!--[if gte mso 9]>
<xml>
<w:WordDocument>
<w:View>Print</w:View>
<w:Zoom>100</w:Zoom>
</w:WordDocument>
</xml>
<![endif]-->
<style>
  body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;}

<body>
  <div style="text-align:center;letter-spacing:4px;font-size:11pt;font-weight:bold;color:#1F3864;">N M D C&nbsp;&nbsp;&nbsp;E N E R G Y</div>
  <h1 style="text-align:center;font-size:20pt;margin:8px 0 2px;color:#1A2233;">CCTV 工作事項分類表</h1>

// ===== LOCALSTORAGE PERSISTENCE =====
const LS_EMP = 'coverall_employees_v1';
const LS_INV = 'coverall_inventory_v1';

function loadFromStorage() {
  try {
    const empData = localStorage.getItem(LS_EMP);
    const invData = localStorage.getItem(LS_INV);
    if (empData) employees = JSON.parse(empData);
    if (invData) inventory = JSON.parse(invData);
  } catch(e) {
    console.warn('localStorage 讀取失敗，使用預設資料', e);
  }
}

function persistToStorage() {
  try {
    localStorage.setItem(LS_EMP, JSON.stringify(employees));
    localStorage.setItem(LS_INV, JSON.stringify(inventory));
  } catch(e) {
    console.warn('localStorage 寫入失敗', e);
  }
}

function resetToDefault() {
  if (!confirm('確定要清除所有儲存的資料，回復到原始預設值嗎？\\n（此動作無法復原）')) return;
  localStorage.removeItem(LS_EMP);
  localStorage.removeItem(LS_INV);
  location.reload();
}


const receivedFields = ['jacket_received','pants_received','winter_received'];
let nextId = Math.max(...employees.map(e=>e.id)) + 1;
let modalLoc = 'taichung'; // which location modal is adding to

// ===== TABS =====
function switchTab(tab, el) {
  // 切換分頁前先把目前畫面所有 input 值同步回陣列，確保不遺失
  flushAllInputs();
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-' + tab).classList.add('active');
  if (tab === 'taichung') renderLoc('taichung');
  if (tab === 'taipei') renderLoc('taipei');
  if (tab === 'inventory') renderInventory();
  if (tab === 'stats') renderStats();
}

// ===== MODAL =====
function openModal(loc) {
  modalLoc = loc;
  const locVal = loc === 'taichung' ? '台中' : '台北';
  document.getElementById('modal-title').textContent = \`＋ 新增人員 — \${locVal}\`;
  // populate datalist
  const depts = [...new Set(employees.filter(e=>e.location===locVal).map(e=>e.department))].sort();
  document.getElementById('m-dept-list').innerHTML = depts.map(d=>\`<option value="\${d}">\`).join('');
  // clear fields
  ['m-badge','m-name','m-dept','m-jeu','m-juk','m-jrec','m-peu','m-puk','m-prec','m-wj','m-wrec'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('m-name').focus(), 100);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function confirmAddEmployee() {
  const name = document.getElementById('m-name').value.trim();
  const dept = document.getElementById('m-dept').value.trim();
  if (!name) { showToast('⚠ 請填入姓名'); document.getElementById('m-name').focus(); return; }
  if (!dept) { showToast('⚠ 請填入部門'); document.getElementById('m-dept').focus(); return; }
  const locVal = modalLoc === 'taichung' ? '台中' : '台北';
  const emp = {
    id: nextId++, badge: document.getElementById('m-badge').value.trim(),
    name, department: dept,
    jacket_eu: document.getElementById('m-jeu').value.trim(),
    jacket_uk: document.getElementById('m-juk').value.trim(), jacket_vocab: '',
    pants_eu: document.getElementById('m-peu').value.trim(),
    jacket_received: document.getElementById('m-jrec').value.trim(),
    pants_uk: document.getElementById('m-puk').value.trim(), pants_vocab: '',
    pants_received: document.getElementById('m-prec').value.trim(),
    winter_jacket: document.getElementById('m-wj').value.trim(), winter_vocab: '',
    winter_received: document.getElementById('m-wrec').value.trim(),
    location: locVal, isNew: true
  };
  employees.push(emp);
  closeModal();
  renderLoc(modalLoc);
  markUnsaved();
  showToast(\`✓ 已新增：\${name} (\${dept}) — 記得按儲存\`);
}

// ===== RENDER LOCATION =====
function renderLoc(loc) {
  const locVal = loc === 'taichung' ? '台中' : '台北';
  const prefix = loc === 'taichung' ? 'tc' : 'tp';
  const search = document.getElementById(prefix+'-search').value.toLowerCase();
  const deptFilter = document.getElementById(prefix+'-dept').value;

  let all = employees.filter(e => e.location === locVal);

  // Rebuild dept dropdown preserving selection
  const depts = [...new Set(all.map(e => e.department))].sort();
  const dSel = document.getElementById(prefix+'-dept');
  const prev = dSel.value;
  dSel.innerHTML = '<option value="">全部部門</option>' + depts.map(d=>\`<option value="\${d}"\${d===prev?' selected':''}>\${d}</option>\`).join('');

  let filtered = all;
  if (search) filtered = filtered.filter(e=>(e.name+e.badge).toLowerCase().includes(search));
  if (deptFilter) filtered = filtered.filter(e=>e.department===deptFilter);

  const groups = {};
  filtered.forEach(e => { if(!groups[e.department]) groups[e.department]=[]; groups[e.department].push(e); });

  const cont = document.getElementById(prefix+'-content');
  cont.innerHTML = '';

  if (!filtered.length) {
    cont.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">沒有找到符合的記錄</div>';
    return;
  }

  Object.entries(groups).forEach(([dept, emps]) => {
    const recCnt = emps.filter(e=>e.jacket_received||e.pants_received||e.winter_received).length;
    const newCnt = emps.filter(e=>e.isNew).length;
    const dkey = dept.replace(/[^a-zA-Z0-9]/g,'_');

    const sec = document.createElement('div');
    sec.className = 'dept';
    sec.id = \`dept-\${loc}-\${dkey}\`;
    sec.innerHTML = \`
      <div class="dept-hdr" onclick="toggleDept(this)">
        <div class="dept-name">\${esc(dept)}</div>
        <div class="dept-meta">
          <span class="dept-cnt">\${emps.length} 人</span>
          \${recCnt?\`<span style="color:var(--ok)">✓ \${recCnt} 已領</span>\`:''}
          \${newCnt?\`<span class="loc loc-new">NEW \${newCnt}</span>\`:''}
          <button class="btn btn-p" style="padding:3px 11px;font-size:11px"
            onclick="event.stopPropagation();openModalForDept('\${loc}','\${dept.replace(/'/g,"\\'")}')">＋ 新增</button>
          <span class="caret">▼</span>
        </div>
      </div>
      <div class="dept-body">
        <div class="twrap">
          <table>
            <thead>
              <tr>
                <th rowspan="2" style="min-width:65px">Badge #</th>
                <th rowspan="2" style="min-width:120px">姓名</th>
                <th colspan="2" class="cg" style="color:#60a5fa">🧥 夾克</th>
                <th colspan="2" class="cg" style="color:#a78bfa">👖 褲子</th>
                <th colspan="2" class="cg" style="color:#34d399">❄ 冬季外套</th>
                <th rowspan="2" style="width:34px"></th>
              </tr>
              <tr>
                <th style="color:#60a5fa">尺寸(UK)</th><th style="color:#0d9488">實際領用</th>
                <th style="color:#a78bfa">尺寸(UK)</th><th style="color:#0d9488">實際領用</th>
                <th style="color:#34d399">尺寸</th><th style="color:#0d9488">實際領用</th>
              </tr>
            </thead>
            <tbody id="tbody-\${loc}-\${dkey}">
              \${emps.map(e=>renderRow(e)).join('')}
            </tbody>
          </table>
        </div>
      </div>\`;
    cont.appendChild(sec);
  });
}

function openModalForDept(loc, dept) {
  openModal(loc);
  setTimeout(()=>{ document.getElementById('m-dept').value = dept; }, 50);
}

function renderRow(e) {
  const newCls = e.isNew ? 'new-row' : '';
  function cell(field, val) {
    const isRec = receivedFields.includes(field);
    const cls = isRec ? (val?'ei rec':'ei') : 'ei';
    return \`<td><input class="\${cls}" data-id="\${e.id}" data-field="\${field}"
      value="\${esc(val)}"
      oninput="updateField(\${e.id},'\${field}',this.value,this)"
      placeholder="\${isRec?'填入領用':''}"/></td>\`;
  }
  const newBadge = e.isNew ? '<span class="loc loc-new">NEW</span> ' : '';
  return \`<tr id="row-\${e.id}" class="\${newCls}">
    <td><span style="font-family:monospace;font-size:11px;color:var(--muted)">\${esc(e.badge)||'—'}</span></td>
    <td style="font-weight:500;white-space:nowrap">\${newBadge}\${esc(e.name)}</td>
    \${cell('jacket_uk',e.jacket_uk)}
    \${cell('jacket_received',e.jacket_received)}
    \${cell('pants_uk',e.pants_uk)}
    \${cell('pants_received',e.pants_received)}
    \${cell('winter_jacket',e.winter_jacket)}
    \${cell('winter_received',e.winter_received)}
    <td><button class="del-btn" onclick="deleteEmp(\${e.id})">✕</button></td>
  </tr>\`;
}

function updateField(id, field, value, el) {
  const emp = employees.find(e=>e.id===id);
  if (!emp) return;
  emp[field] = value;
  if (receivedFields.includes(field)) {
    el.className = 'ei ' + (value ? 'rec' : '');
  } else {
    el.className = 'ei chg';
  }
  markUnsaved();
}

function markUnsaved() {
  const u = document.getElementById('unsavedBadge');
  const s = document.getElementById('savedBadge');
  if (u) u.style.display = 'inline';
  if (s) s.style.display = 'none';
}

function deleteEmp(id) {
  const emp = employees.find(e=>e.id===id);
  if (!emp) return;
  if (!confirm(\`確定刪除「\${emp.name}」？\`)) return;
  employees = employees.filter(e=>e.id!==id);
  const row = document.getElementById('row-'+id);
  if (row) {
    row.style.opacity = '0'; row.style.transition = 'opacity .3s';
    setTimeout(()=>{ if(row.parentNode) row.remove(); }, 300);
  }
  markUnsaved();
  showToast(\`已刪除：\${emp.name} — 記得按儲存\`);
}

function toggleDept(hdr) { hdr.parentElement.classList.toggle('collapsed'); }

const INV_CATS = [
  {key:'winter_blue', label:'冬季外套 (藍色)', color:'#4f7cff'},
  {key:'winter_red',  label:'冬季外套 (紅色)', color:'#e85c4a'},

function renderInventory() {

        <span style="font-size:12px;color:var(--muted);font-weight:400">

              <th style="text-align:left">名稱</th>
              <th style="text-align:left">尺寸</th>
              <th>數量</th>

            </tr>

        </div>
        <div>
          <label>數量</label>
          <input id="inv-nq-\${cat.key}" type="number" min="0" value="0" style="width:65px"/>
        </div>
        <button class="btn btn-p" style="padding:5px 13px;font-size:12px" onclick="addInvSize('\${cat.key}')">＋ 新增</button>
      </div>
    </div>\`).join('');
}

function renderInvRows(key, label) {
  const rows = Object.entries(inventory).filter(([,vals]) => (vals[key]||0) > 0);
  if (!rows.length) {
    return \`<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:14px">無庫存</td></tr>\`;
  }
  return rows.map(([size, vals]) => \`
    <tr id="inv-row-\${key}-\${size.replace(/[^a-zA-Z0-9]/g,'_')}">
      <td><span style="color:\${INV_CATS.find(c=>c.key===key).color};font-weight:600">\${esc(label)}</span></td>
      <td>
        <input class="inv-size-input" value="\${esc(size)}"
          onchange="renameSize('\${esc(size)}','\${key}',this.value)"
          title="點擊編輯尺寸名稱"/>
      </td>
      <td>
        <input class="inv-num" type="number" min="0" value="\${vals[key]||0}"
          onchange="updateInv('\${esc(size)}','\${key}',this.value)"/>
      </td>
      <td>
        <button class="size-del" onclick="delInvSize('\${esc(size)}','\${key}')" title="刪除此列">✕</button>
      </td>
    </tr>\`).join('');
}

function updateInv(size, key, val) {
  if (!inventory[size]) inventory[size]={};
  inventory[size][key] = parseInt(val)||0;
  markUnsaved();
  renderInventory();
}

function addInvSize(key) {
  const sEl = document.getElementById(\`inv-ns-\${key}\`);
  const qEl = document.getElementById(\`inv-nq-\${key}\`);
  const size = sEl.value.trim();
  if (!size) { showToast('⚠ 請填入尺寸名稱'); sEl.focus(); return; }
  if (!inventory[size]) inventory[size] = {winter_blue:0,winter_red:0,jacket_red:0,jacket_blue:0,pants_red:0,pants_blue:0};
  inventory[size][key] = parseInt(qEl.value)||0;
  sEl.value=''; qEl.value='0';
  markUnsaved();
  renderInventory();
  showToast(\`✓ 已新增尺寸：\${size}\`);
}

function delInvSize(size, key) {
  if (!confirm(\`確定清除「\${size}」的 \${key} 數量嗎？\`)) return;
  if (inventory[size]) inventory[size][key] = 0;
  if (inventory[size] && Object.values(inventory[size]).every(v=>v===0)) {
    if (confirm(\`「\${size}」所有類別均為零，要完全移除此尺寸嗎？\`)) {
      delete inventory[size];
    }
  }
  markUnsaved();
  renderInventory();
  showToast(\`已清除：\${size} / \${key}\`);
}

function renameSize(oldSize, key, newSize) {
  newSize = newSize.trim();
  if (!newSize || newSize === oldSize) return;
  if (inventory[newSize] && newSize !== oldSize) {
    showToast('⚠ 此尺寸名稱已存在');
    renderInventory(); return;
  }
  inventory[newSize] = {...(inventory[oldSize]||{})};
  delete inventory[oldSize];
  markUnsaved();
  renderInventory();
  showToast(\`✓ 尺寸重命名：\${oldSize} → \${newSize}\`);
}

function renderStats() {
  const tc = employees.filter(e=>e.location==='台中');
  const tp = employees.filter(e=>e.location==='台北');

  function block(list, label, color) {
    const depts={};
    list.forEach(e=>{
      if(!depts[e.department]) depts[e.department]={t:0,js:0,jr:0,ps:0,pr:0,ws:0,wr:0};
      const d=depts[e.department];
      d.t++; if(e.jacket_uk)d.js++; if(e.jacket_received)d.jr++;
      if(e.pants_uk)d.ps++; if(e.pants_received)d.pr++;
      if(e.winter_jacket)d.ws++; if(e.winter_received)d.wr++;
    });
    const totRec=list.filter(e=>e.winter_received||e.jacket_received||e.pants_received).length;
    return \`<div class="scard" style="grid-column:1/-1;border-left:3px solid \${color}">
      <h3 style="font-size:15px;color:\${color};margin-bottom:14px">\${label} — \${list.length} 人 · 已領 \${totRec} 人</h3>
      <div class="twrap"><table style="font-size:12.5px">
        <thead><tr><th>部門</th><th>人數</th><th style="color:#60a5fa">夾克登記</th><th style="color:var(--ok)">夾克領用</th>
          <th style="color:#a78bfa">褲子登記</th><th style="color:var(--ok)">褲子領用</th>
          <th style="color:#34d399">冬套登記</th><th style="color:var(--ok)">冬套領用</th></tr></thead>
        <tbody>
          \${Object.entries(depts).map(([dep,d])=>\`<tr>
            <td style="font-weight:600">\${esc(dep)}</td>
            <td style="text-align:center">\${d.t}</td>
            <td style="text-align:center;color:#60a5fa">\${d.js}</td><td style="text-align:center;color:var(--ok)">\${d.jr}</td>
            <td style="text-align:center;color:#a78bfa">\${d.ps}</td><td style="text-align:center;color:var(--ok)">\${d.pr}</td>
            <td style="text-align:center;color:#34d399">\${d.ws}</td><td style="text-align:center;color:var(--ok)">\${d.wr}</td>
          </tr>\`).join('')}
          <tr class="sum-row">
            <td>合計</td><td style="text-align:center">\${list.length}</td>
            <td style="text-align:center">\${list.filter(e=>e.jacket_uk).length}</td>
            <td style="text-align:center">\${list.filter(e=>e.jacket_received).length}</td>
            <td style="text-align:center">\${list.filter(e=>e.pants_uk).length}</td>
            <td style="text-align:center">\${list.filter(e=>e.pants_received).length}</td>
            <td style="text-align:center">\${list.filter(e=>e.winter_jacket).length}</td>
            <td style="text-align:center">\${list.filter(e=>e.winter_received).length}</td>
          </tr>
        </tbody>
      </table></div>
    </div>\`;
  }

  function sizeDist(list, field, title) {
    const s={};
    list.forEach(e=>{ if(e[field]) s[e[field]]=(s[e[field]]||0)+1; });
    const rows = Object.entries(s).sort((a,b)=>b[1]-a[1]).map(([sz,c])=>
      \`<div class="srow"><span class="size-tag">\${esc(sz)}</span><span class="sv">\${c}</span></div>\`).join('');
    return \`<div class="scard"><h3>\${title}</h3>\${rows||'<div style="color:var(--muted);text-align:center;padding:8px">無資料</div>'}</div>\`;
  }

  function invBlock(catKey, label, colorClass) {
    const rows = Object.entries(inventory).filter(([,v])=>(v[catKey]||0)>0)
      .map(([sz,v])=>\`<div class="srow"><span class="size-tag">\${esc(sz)}</span><span class="sv \${colorClass}">\${v[catKey]}</span></div>\`).join('');
    return \`<div class="scard"><h3>\${label} 庫存</h3>\${rows||'<div style="color:var(--muted);text-align:center;padding:8px">無庫存</div>'}</div>\`;
  }

  document.getElementById('stats-content').innerHTML = \`
    <div class="stats-grid">
      \${block(tc,'🏭 台中 Taichung','var(--tc)')}
      \${block(tp,'🏢 台北 Taipei','var(--tp)')}
    </div>
    <div style="margin:20px 0 10px;font-size:15px;font-weight:700">尺寸分佈</div>
    <div class="stats-grid">
      \${sizeDist(tc,'winter_jacket','台中 冬季外套')}
      \${sizeDist(tc,'jacket_uk','台中 夾克')}
      \${sizeDist(tc,'pants_uk','台中 褲子')}
      \${sizeDist(tp,'winter_jacket','台北 冬季外套')}
    </div>
    <div style="margin:20px 0 10px;font-size:15px;font-weight:700">現有庫存</div>
    <div class="stats-grid">
      \${invBlock('winter_blue','冬季外套 (藍)','g')}
      \${invBlock('winter_red','冬季外套 (紅)','r')}
      \${invBlock('jacket_red','夾克 (紅)','')}
      \${invBlock('jacket_blue','夾克 (藍)','')}
      \${invBlock('pants_red','褲子 (紅)','')}
      \${invBlock('pants_blue','褲子 (藍)','')}
    </div>\`;
}

// ===== EXPORT =====
function exportExcel() {
  const wb = XLSX.utils.book_new();
  const date = new Date().toISOString().slice(0,10);

  // ── Color palette ──────────────────────────────────────────────
  const C = {
    headerBg:    '1A1D27',  // dark surface
    headerFg:    'E2E8F0',  // light text
    deptBg:      '22263A',  // dept row bg
    deptFg:      'E2E8F0',
    jacketFg:    '60A5FA',  // blue
    pantsFg:     'A78BFA',  // purple
    winterFg:    '34D399',  // green
    recFg:       '86EFAC',  // light green (received)
    tcBg:        '0D1F3C',  // taichung tint
    tpBg:        '2D0F0A',  // taipei tint
    tcAccent:    '4F7CFF',
    tpAccent:    'E85C4A',
    recBg:       '0D2B1E',  // received cell bg
    emptyFg:     '7D8AB0',  // muted
    sumBg:       '1A2640',
    sumFg:       '4F7CFF',
    white:       'FFFFFF',
    borderClr:   '2E3350',
  };

  // ── Font / border helpers ──────────────────────────────────────
  function font(bold, sz, color, italic) {
    return { bold:!!bold, sz:sz||10, color:{rgb: color||C.headerFg}, italic:!!italic };
  }
  function fill(rgb) { return { patternType:'solid', fgColor:{rgb} }; }
  function border(clr) {
    const s = { style:'thin', color:{rgb: clr||C.borderClr} };
    return { top:s, bottom:s, left:s, right:s };
  }
  function align(h, v, wrap) {
    return { horizontal:h||'left', vertical:v||'center', wrapText:!!wrap };
  }

  // Merge helper: collect merges to add to ws['!merges']
  function mk(r1,c1,r2,c2){ return {s:{r:r1,c:c1},e:{r:r2,c:c2}}; }

  // ── Cell builder ──────────────────────────────────────────────
  function cell(v, bold, sz, fgClr, bgClr, ha, wrap, italic) {
    const t = (v===null||v===undefined||v==='') ? '' : String(v);
    const c = { v:t, t:'s',
      s:{ font: font(bold,sz,fgClr,italic),
          fill: bgClr ? fill(bgClr) : {patternType:'none'},
          border: border(),
          alignment: align(ha||'left','center',wrap) }};
    return c;
  }
  function numCell(v, bold, fgClr, bgClr, ha) {
    const n = Number(v);
    return { v: isNaN(n)?0:n, t:'n',
      s:{ font: font(bold,10,fgClr),
          fill: bgClr ? fill(bgClr) : {patternType:'none'},
          border: border(),
          alignment: align(ha||'center','center') }};
  }

  // ── Write array-of-arrays + style into a worksheet ──────────────
  function buildSheet(rows, merges, colWidths) {
    const ws = {};
    let maxC = 0;
    rows.forEach((row, r) => {
      row.forEach((c, col) => {
        if(c === null) return; // skip (covered by merge)
        ws[XLSX.utils.encode_cell({r,c:col})] = c;
        if(col > maxC) maxC = col;
      });
    });
    ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:maxC}});
    if(merges && merges.length) ws['!merges'] = merges;
    if(colWidths) ws['!cols'] = colWidths;
    return ws;
  }

  // ══════════════════════════════════════════════════════════════
  // SHEET 1 & 2: 台中 / 台北 — grouped by department (無 Vocab、有線框)
  // 欄位: Badge(0) 姓名(1) 部門(2) 夾克尺寸(3) 夾克領用(4) 褲子尺寸(5) 褲子領用(6) 冬季尺寸(7) 冬季領用(8)
  // ══════════════════════════════════════════════════════════════
  function makeLocSheet(locVal, accentClr) {
    const locEmp = employees.filter(e => e.location === locVal);
    const depts  = [...new Set(locEmp.map(e=>e.department))].sort();
    const rows   = [];
    const merges = [];
    const NC     = 9; // total columns 0-8

    // 統一白底深字線框樣式
    const WH = 'FFFFFF';
    const BK = '222222';
    const HDR_BG = '2D3A5A';   // 深藍標頭
    const DEPT_BG = 'E8ECF8';  // 淡藍部門列
    const REC_BG  = 'E6F7EE';  // 淡綠已領
    const SUB_BG  = 'F0F4FF';  // 小計列

    function bdr(thin) {
      const s = {style: thin ? 'thin' : 'medium', color:{rgb:'999999'}};
      return {top:s,bottom:s,left:s,right:s};
    }
    function xc(v, bold, sz, fgClr, bgClr, ha, wrap) {
      return { v: v||'', t:'s',
        s:{ font:{bold:!!bold, sz:sz||10, color:{rgb:fgClr||BK}},
            fill:{patternType:'solid', fgColor:{rgb:bgClr||WH}},
            border: bdr(true),
            alignment:{horizontal:ha||'center', vertical:'center', wrapText:!!wrap} }};
    }
    function xn(v, bold, fgClr, bgClr) {
      const n = Number(v)||0;
      return { v:n, t:'n',
        s:{ font:{bold:!!bold, sz:10, color:{rgb:fgClr||BK}},
            fill:{patternType:'solid', fgColor:{rgb:bgClr||WH}},
            border: bdr(true),
            alignment:{horizontal:'center', vertical:'center'} }};
    }

    // ── 標題 ──────────────────────────────────────────────
    rows.push([
      xc(\`NMDC Coverall 領用管理 — \${locVal}　　匯出日期：\${date}　共 \${locEmp.length} 人\`,
         true, 12, WH, HDR_BG, 'left'),
      null,null,null,null,null,null,null,null
    ]);
    merges.push(mk(0,0,0,NC-1));

    // ── 表頭 row 1 ────────────────────────────────────────
    const H = rows.length;
    rows.push([
      xc('Badge #',  true,10,WH,HDR_BG),
      xc('姓名',      true,10,WH,HDR_BG,'left'),
      xc('部門',      true,10,WH,HDR_BG),
      xc('夾克尺寸',  true,10,'93C5FD',HDR_BG),
      xc('夾克領用',  true,10,'6EE7B7',HDR_BG),
      xc('褲子尺寸',  true,10,'C4B5FD',HDR_BG),
      xc('褲子領用',  true,10,'6EE7B7',HDR_BG),
      xc('冬季尺寸',  true,10,'FCD34D',HDR_BG),
      xc('冬季領用',  true,10,'6EE7B7',HDR_BG),
    ]);

    // ── 部門群組 ──────────────────────────────────────────
    depts.forEach(dept => {
      const emps   = locEmp.filter(e=>e.department===dept);
      const recCnt = emps.filter(e=>e.jacket_received||e.pants_received||e.winter_received).length;
      const dRow   = rows.length;

      // 部門標題列（合併全行）
      rows.push([
        xc(\`\${dept}　（\${emps.length} 人\${recCnt ? '，已領 '+recCnt+' 人' : ''}）\`,
           true, 10, '1E3A8A', DEPT_BG, 'left'),
        null,null,null,null,null,null,null,null
      ]);
      merges.push(mk(dRow, 0, dRow, NC-1));

      // 員工列
      emps.forEach(e => {
        const hasRec = e.jacket_received||e.pants_received||e.winter_received;
        const bg = hasRec ? REC_BG : WH;
        const nameFg = '111111';
        rows.push([
          xc(e.badge||'—',       false,9,'555555',bg),
          xc(e.name,             false,10,nameFg,bg,'left'),
          xc(e.department,       false,9,'555555',bg),
          xc(e.jacket_uk||'—',   false,9,'1D4ED8',bg),
          xc(e.jacket_received||'—', e.jacket_received,9, e.jacket_received?'065F46':'AAAAAA', bg),
          xc(e.pants_uk||'—',    false,9,'5B21B6',bg),
          xc(e.pants_received||'—',  e.pants_received, 9, e.pants_received?'065F46':'AAAAAA', bg),
          xc(e.winter_jacket||'—',false,9,'92400E',bg),
          xc(e.winter_received||'—', e.winter_received,9, e.winter_received?'065F46':'AAAAAA', bg),
        ]);
      });

      // 小計列
      rows.push([
        xc('小計', true,9,'1E3A8A',SUB_BG),
        xn(emps.length, true,'1E3A8A',SUB_BG),
        xc('', false,9,BK,SUB_BG),
        xn(emps.filter(e=>e.jacket_uk).length,        true,'1D4ED8',SUB_BG),
        xn(emps.filter(e=>e.jacket_received).length,   true,'065F46',SUB_BG),
        xn(emps.filter(e=>e.pants_uk).length,          true,'5B21B6',SUB_BG),
        xn(emps.filter(e=>e.pants_received).length,    true,'065F46',SUB_BG),
        xn(emps.filter(e=>e.winter_jacket).length,     true,'92400E',SUB_BG),
        xn(emps.filter(e=>e.winter_received).length,   true,'065F46',SUB_BG),
      ]);
    });

    // ── 總計列 ────────────────────────────────────────────
    rows.push([
      xc('總計', true,11,WH,HDR_BG),
      xn(locEmp.length, true,WH,HDR_BG),
      xc('', false,10,WH,HDR_BG),
      xn(locEmp.filter(e=>e.jacket_uk).length,       true,'93C5FD',HDR_BG),
      xn(locEmp.filter(e=>e.jacket_received).length,  true,'6EE7B7',HDR_BG),
      xn(locEmp.filter(e=>e.pants_uk).length,         true,'C4B5FD',HDR_BG),
      xn(locEmp.filter(e=>e.pants_received).length,   true,'6EE7B7',HDR_BG),
      xn(locEmp.filter(e=>e.winter_jacket).length,    true,'FCD34D',HDR_BG),
      xn(locEmp.filter(e=>e.winter_received).length,  true,'6EE7B7',HDR_BG),
    ]);

    const colW = [
      {wch:12},  // Badge
      {wch:24},  // 姓名
      {wch:18},  // 部門
      {wch:14},  // 夾克尺寸
      {wch:14},  // 夾克領用
      {wch:14},  // 褲子尺寸
      {wch:14},  // 褲子領用
      {wch:14},  // 冬季尺寸
      {wch:14},  // 冬季領用
    ];
    return buildSheet(rows, merges, colW);
  }

  // ══════════════════════════════════════════════════════════════
  // SHEET 3: 庫存
  // ══════════════════════════════════════════════════════════════
  function makeInventorySheet() {
    const WH='FFFFFF', HDR_BG='2D3A5A';
    const cats = [
      {key:'winter_blue', label:'冬套藍', fg:'4F7CFF'},
      {key:'winter_red',  label:'冬套紅', fg:'E85C4A'},
      {key:'jacket_red',  label:'夾克紅', fg:'F87171'},
      {key:'jacket_blue', label:'夾克藍', fg:'60A5FA'},
      {key:'pants_red',   label:'褲子紅', fg:'FB923C'},
      {key:'pants_blue',  label:'褲子藍', fg:'A78BFA'},
    ];
    const rows = [], merges = [];
    const bdr = () => { const s={style:'thin',color:{rgb:'999999'}}; return {top:s,bottom:s,left:s,right:s}; };
    const xc = (v,bold,sz,fg,bg,ha) => ({v:v||'',t:'s',s:{font:{bold:!!bold,sz:sz||10,color:{rgb:fg||'222222'}},fill:{patternType:'solid',fgColor:{rgb:bg||WH}},border:bdr(),alignment:{horizontal:ha||'center',vertical:'center'}}});
    const xn = (v,bold,fg,bg) => ({v:Number(v)||0,t:'n',s:{font:{bold:!!bold,sz:10,color:{rgb:fg||'222222'}},fill:{patternType:'solid',fgColor:{rgb:bg||WH}},border:bdr(),alignment:{horizontal:'center',vertical:'center'}}});

    // 標題
    rows.push([xc(\`現有庫存　匯出：\${date}\`,true,12,WH,HDR_BG,'left'),null,null,null,null,null,null]);
    merges.push(mk(0,0,0,6));

    // 表頭
    rows.push([xc('尺寸',true,10,WH,HDR_BG), ...cats.map(c=>xc(c.label,true,9,c.fg,HDR_BG))]);

    // 資料列
    Object.entries(inventory).forEach(([sz,v]) => {
      const total = cats.reduce((s,c)=>s+(v[c.key]||0),0);
      const bg = total>0 ? 'F0F9FF' : WH;
      rows.push([
        xc(sz, true, 10, '1E3A8A', bg),
        ...cats.map(c => {
          const n = v[c.key]||0;
          return n>0 ? xn(n, true, c.fg, 'F0FDF4') : xc('—', false, 9, 'CCCCCC', bg);
        })
      ]);
    });

    // 合計
    rows.push([
      xc('合計',true,10,WH,HDR_BG),
      ...cats.map(c=>xn(Object.values(inventory).reduce((s,v)=>s+(v[c.key]||0),0),true,c.fg,HDR_BG))
    ]);

    const colW = [{wch:10},...cats.map(()=>({wch:12}))];
    return buildSheet(rows, merges, colW);
  }

  // ══════════════════════════════════════════════════════════════
  // SHEET 4: 統計總覽
  // ══════════════════════════════════════════════════════════════
  function makeStatsSheet() {
    const WH='FFFFFF', HDR_BG='2D3A5A', SUB='F0F4FF';
    const bdr = () => { const s={style:'thin',color:{rgb:'999999'}}; return {top:s,bottom:s,left:s,right:s}; };
    const xc = (v,bold,sz,fg,bg,ha) => ({v:v||'',t:'s',s:{font:{bold:!!bold,sz:sz||10,color:{rgb:fg||'222222'}},fill:{patternType:'solid',fgColor:{rgb:bg||WH}},border:bdr(),alignment:{horizontal:ha||'center',vertical:'center'}}});
    const xn = (v,bold,fg,bg) => ({v:Number(v)||0,t:'n',s:{font:{bold:!!bold,sz:10,color:{rgb:fg||'222222'}},fill:{patternType:'solid',fgColor:{rgb:bg||WH}},border:bdr(),alignment:{horizontal:'center',vertical:'center'}}});

    function deptStat(list) {
      const d={};
      list.forEach(e=>{
        if(!d[e.department])d[e.department]={t:0,js:0,jr:0,ps:0,pr:0,ws:0,wr:0};
        const r=d[e.department];
        r.t++;if(e.jacket_uk)r.js++;if(e.jacket_received)r.jr++;
        if(e.pants_uk)r.ps++;if(e.pants_received)r.pr++;
        if(e.winter_jacket)r.ws++;if(e.winter_received)r.wr++;
      });
      return d;
    }
    const tcEmp = employees.filter(e=>e.location==='台中');
    const tpEmp = employees.filter(e=>e.location==='台北');
    const tc = deptStat(tcEmp);
    const tp = deptStat(tpEmp);
    const rows = [], merges = [];

    // 標題
    rows.push([xc(\`統計總覽　匯出：\${date}\`,true,12,WH,HDR_BG,'left'),null,null,null,null,null,null,null]);
    merges.push(mk(0,0,0,7));

    function locBlock(label, empList, statObj, acClr) {
      const sRow = rows.length;
      rows.push([xc(\`\${label}　共 \${empList.length} 人\`,true,11,WH,acClr,'left'),null,null,null,null,null,null,null]);
      merges.push(mk(sRow,0,sRow,7));

      rows.push([
        xc('部門',  true,9,WH,HDR_BG),
        xc('人數',  true,9,WH,HDR_BG),
        xc('夾克尺寸',true,9,'93C5FD',HDR_BG),
        xc('夾克領用',true,9,'6EE7B7',HDR_BG),
        xc('褲子尺寸',true,9,'C4B5FD',HDR_BG),
        xc('褲子領用',true,9,'6EE7B7',HDR_BG),
        xc('冬季尺寸',true,9,'FCD34D',HDR_BG),
        xc('冬季領用',true,9,'6EE7B7',HDR_BG),
      ]);

      Object.entries(statObj).forEach(([dep,v]) => {
        rows.push([
          xc(dep,false,10,'111111',WH,'left'),
          xn(v.t, false,'333333',WH),
          xn(v.js,false,'1D4ED8',WH),
          xn(v.jr,true, '065F46',v.jr>0?'F0FDF4':WH),
          xn(v.ps,false,'5B21B6',WH),
          xn(v.pr,true, '065F46',v.pr>0?'F0FDF4':WH),
          xn(v.ws,false,'92400E',WH),
          xn(v.wr,true, '065F46',v.wr>0?'F0FDF4':WH),
        ]);
      });

      rows.push([
        xc('合計',true,10,WH,acClr),
        xn(empList.length,true,WH,acClr),
        xn(empList.filter(e=>e.jacket_uk).length,       true,'93C5FD',acClr),
        xn(empList.filter(e=>e.jacket_received).length,  true,'6EE7B7',acClr),
        xn(empList.filter(e=>e.pants_uk).length,         true,'C4B5FD',acClr),
        xn(empList.filter(e=>e.pants_received).length,   true,'6EE7B7',acClr),
        xn(empList.filter(e=>e.winter_jacket).length,    true,'FCD34D',acClr),
        xn(empList.filter(e=>e.winter_received).length,  true,'6EE7B7',acClr),
      ]);
    }

    locBlock('台中 Taichung', tcEmp, tc, '1D4ED8');
    locBlock('台北 Taipei',   tpEmp, tp, 'B91C1C');

    const colW = [{wch:22},{wch:8},{wch:11},{wch:11},{wch:11},{wch:11},{wch:11},{wch:11}];
    return buildSheet(rows, merges, colW);
  }

  // ── Assemble workbook ─────────────────────────────────────────
  XLSX.utils.book_append_sheet(wb, makeLocSheet('台中','1D4ED8'), '台中');
  XLSX.utils.book_append_sheet(wb, makeLocSheet('台北','B91C1C'), '台北總公司');
  XLSX.utils.book_append_sheet(wb, makeInventorySheet(), '現有衣服尺寸');
  XLSX.utils.book_append_sheet(wb, makeStatsSheet(), '統計總覽');

  XLSX.writeFile(wb, \`NMDC_Coverall_\${date}.xlsx\`);
  showToast('📥 Excel 已匯出！');
}

// ===== UTILS =====
function flushAllInputs() {
  // 強制把畫面上所有編輯中的 input 值同步回 employees 陣列
  // 這樣即使使用者沒有離開欄位（onchange 未觸發），值也不會遺失
  document.querySelectorAll('input[data-id][data-field]').forEach(el => {
    const id    = parseInt(el.getAttribute('data-id'));
    const field = el.getAttribute('data-field');
    const emp   = employees.find(e => e.id === id);
    if (emp) emp[field] = el.value;
  });
}

function saveOnly() {
  // 1. flush 所有 DOM input 到陣列
  flushAllInputs();
  // 2. 寫入 localStorage（關閉網頁後仍保留）
  persistToStorage();
  // 3. UI 更新
  const u = document.getElementById('unsavedBadge');
  const b = document.getElementById('savedBadge');
  if (u) u.style.display = 'none';
  if (b) { b.style.display = 'inline'; setTimeout(()=>b.style.display='none', 3500); }
  renderStats();
  const now = new Date();
  const timeStr = now.toLocaleString('zh-TW', {hour12:false});
  const timeEl = document.getElementById('last-saved-time');
  if (timeEl) { timeEl.textContent = '最後儲存：' + timeStr; timeEl.style.display = 'inline'; }
  showToast('✓ 已儲存到瀏覽器，關閉後資料仍在');
}

// 保留 saveAll 供向下相容
function saveAll() { saveOnly(); }

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>t.classList.remove('show'),3000);
}

function esc(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 首頁 台中端/通霄端 卡片：點「已完成/待辦/未完成」展開對應清單（可同時展開多個），點右上角 × 收合
function toggleDashExpand(key) {
  state.dashboardExpanded[key] = !state.dashboardExpanded[key];
  render();
}

function renderDashboard() {
  const patrol = DB.patrol;
  const tomorrow = DB.tomorrow;
  const poeChecks = DB.poeChecks;
  const monitorFiles = DB.monitorFiles;
  const reservations = DB.poeReservation;
  const today = todayStr();

  const DASH_STATUS_LABEL = { done: '已完成', pending: '待辦', incomplete: '未完成' };
  const DASH_STATUS_COLOR = { done: 'var(--green)', pending: 'var(--amber)', incomplete: 'var(--red)' };
  function siteCard(site) {
    const done = patrol.some(p => p.date === today && p.site === site);
    const plans = tomorrow.filter(t => t.site === site);
    const counts = { done:0, pending:0, incomplete:0 };
    plans.forEach(p => counts[p.status] = (counts[p.status]||0)+1);
    const panels = ['done','pending','incomplete'].map(k => {
      const expandKey = site + '__' + k;
      if (!state.dashboardExpanded[expandKey]) return '';
      const items = plans.filter(p => p.status === k).slice().sort((a, b) => {
        const da = a.date || '', db = b.date || '';
        if (!da && !db) return 0;
        if (!da) return 1;
        if (!db) return -1;
        return da.localeCompare(db);
      });
      const body = items.length
        ? `<div class="reminder-list">${items.map(p => `<div class="reminder-item"><span>${p.date?`<span class="text-dim mono" style="margin-right:8px;">${esc(p.date)}</span>`:''}${esc(p.task||'（未填寫工作項目）')}</span><span class="text-dim">${esc(p.assignee||'')}</span></div>`).join('')}</div>`
        : `<p class="text-dim" style="margin:0;">目前沒有項目</p>`;
      return `<div class="dash-expand-panel">
        <div class="dash-expand-head"><span style="color:${DASH_STATUS_COLOR[k]};">${DASH_STATUS_LABEL[k]}（${counts[k]||0}）</span><button class="dash-expand-close" onclick="toggleDashExpand('${expandKey}')" title="收合">×</button></div>
        ${body}
      </div>`;
    }).join('');
    return `<div class="viewfinder card">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="card-head"><span>${site}</span><span class="pill ${done?'pill-green':'pill-red'}">${done?'今日已巡檢':'今日尚未巡檢'}</span></div>
      <div class="light-row">
        <button class="status-light" onclick="toggleDashExpand('${site}__done')"><span class="dot" style="background:var(--green)"></span>${counts.done||0} 已完成</button>
        <button class="status-light" onclick="toggleDashExpand('${site}__pending')"><span class="dot" style="background:var(--amber)"></span>${counts.pending||0} 待辦</button>
        <button class="status-light" onclick="toggleDashExpand('${site}__incomplete')"><span class="dot" style="background:var(--red)"></span>${counts.incomplete||0} 未完成</button>
      </div>
      ${panels}
    </div>`;
  }

  const missing = [];
  for (let i=1;i<=7;i++) { const d = new Date(); d.setDate(d.getDate()-i); const ds = d.toISOString().slice(0,10); if (!monitorFiles[ds]) missing.push(ds); }
  const pendingImprove = poeChecks.filter(p => p.improveStatus && p.improveStatus !== '已完成').length;
  const resCounts = { done:0, pending:0, incomplete:0 };
  reservations.forEach(r => resCounts[r.status] = (resCounts[r.status]||0)+1);

  // ── 本週值班表 ──
  const weekLabel = ['一','二','三','四','五','六','日'];
  const monday = thisWeekMonday();
  const weekDates = weekDatesFrom(monday);
  const weekRows = weekDates.map((ds, i) => {
    const recs = DB.duty.filter(x => x.date === ds);
    const isToday = ds === today;
    const content = recs.length
      ? recs.map(r => { const [,color] = DUTY_TYPE_MAP[r.type]||DUTY_TYPE_MAP['正常值班']; return `<span style="color:${color};">●</span> ${esc(r.person)}${r.type!=='正常值班'?`（${r.type}）`:''}` ; }).join('　')
      : `<span class="text-dim">未排班</span>`;
    return `<div class="week-widget-row ${isToday?'today':''}">
      <span class="week-widget-day mono">週${weekLabel[i]} ${ds.slice(5)}</span>
      <span style="flex:1;">${content}</span>
    </div>`;
  }).join('');

  // ── PPE 庫存提醒（直接讀雲端 DB.ppeItems，與 Coverall 未領提醒的 localStorage 來源不同）──
  function ppeReminder() {
    const inv = DB.ppeItems;
    if (!inv || !inv.length) return `<p class="text-dim">尚無資料</p>`;
    const low = inv.filter(i => Number(i.qty) < 5).sort((a,b)=>a.qty-b.qty);
    if (!low.length) return `<p class="text-dim">庫存皆正常 ✅</p>`;
    return `<div class="reminder-list">${low.slice(0,6).map(i=>`<div class="reminder-item"><span>${esc(i.name)}</span><span class="warn-text mono">剩 ${i.qty}</span></div>`).join('')}${low.length>6?`<div class="text-dim" style="font-size:12px;">…等共 ${low.length} 項偏低</div>`:''}</div>`;
  }
  function coverallReminder() {
    let emps = null;
    try { emps = JSON.parse(localStorage.getItem('coverall_employees_v1') || 'null'); } catch(e) {}
    if (!emps) return `<p class="text-dim">尚無資料（請先開啟一次「NMDC Coverall」頁面）</p>`;
    const pending = emps.filter(e => !e.jacket_received || !e.pants_received);
    if (!pending.length) return `<p class="text-dim">全數人員皆已領取 ✅</p>`;
    return `<div class="reminder-list">${pending.slice(0,6).map(e=>`<div class="reminder-item"><span>${esc(e.name)}（${esc(e.department||'')}）</span><span class="warn-text">未領齊</span></div>`).join('')}${pending.length>6?`<div class="text-dim" style="font-size:12px;">…等共 ${pending.length} 人尚未領齊</div>`:''}</div>`;
  }

  // ── 本週巡檢統計（過去7天，兩端達成天數）──
  function siteWeekRate(site) {
    let count = 0;
    for (let i=0;i<7;i++) { const d = new Date(); d.setDate(d.getDate()-i); const ds = d.toISOString().slice(0,10); if (patrol.some(p=>p.date===ds && p.site===site)) count++; }
    return count;
  }
  const tcRate = siteWeekRate('台中端'), txRate = siteWeekRate('通霄端');
  const barChart = `<div class="mini-bar-wrap">
    <div class="mini-bar-row"><span class="mini-bar-label">台中端</span><div class="mini-bar-track"><div class="mini-bar-fill" style="width:${tcRate/7*100}%;background:var(--accent);"></div></div><span class="mini-bar-val">${tcRate}/7 天</span></div>
    <div class="mini-bar-row"><span class="mini-bar-label">通霄端</span><div class="mini-bar-track"><div class="mini-bar-fill" style="width:${txRate/7*100}%;background:var(--accent);"></div></div><span class="mini-bar-val">${txRate}/7 天</span></div>
  </div>`;

  return `
  <h1 class="page-title">首頁儀表板</h1>
  <div class="grid-2">${siteCard('台中端')}${siteCard('通霄端')}</div>
  <div class="grid-2" style="margin-top:20px;">
    <div class="viewfinder card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="card-head"><span>監看紀錄表 · 缺件提醒</span></div>
      <p class="${missing.length?'warn-text':'text-dim'}">${missing.length ? '尚未上傳：'+missing.join('、') : '近 7 日紀錄完整'}</p>
    </div>
    <div class="viewfinder card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="card-head"><span>POE抽查事項</span></div>
      <p class="${pendingImprove>0?'warn-text':'text-dim'}" style="margin-bottom:8px;">${pendingImprove>0 ? `缺失待改善：${pendingImprove} 筆` : '缺失待改善：無'}</p>
      <div class="light-row">
        <span><span class="dot" style="background:var(--green)"></span>${resCounts.done||0} 預約已完成</span>
        <span><span class="dot" style="background:var(--amber)"></span>${resCounts.pending||0} 預約待辦</span>
        <span><span class="dot" style="background:var(--red)"></span>${resCounts.incomplete||0} 預約未完成</span>
      </div>
    </div>
  </div>
  <div class="viewfinder card" style="margin-top:20px;"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="card-head"><span>📅 本週值班表（監看CCTV）</span><button class="btn ghost" onclick="goPage('duty')">前往排班管理</button></div>
    <div class="week-widget">${weekRows}</div>
  </div>
  <div class="grid-2" style="margin-top:20px;">
    <div class="viewfinder card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="card-head"><span>🦺 PPE 庫存提醒</span></div>
      ${ppeReminder()}
    </div>
    <div class="viewfinder card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="card-head"><span>🧥 Coverall 未領提醒</span></div>
      ${coverallReminder()}

  </div>
  <div class="viewfinder card" style="margin-top:20px;"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="card-head"><span>📊 本週巡檢達成率（過去7天）</span></div>
    ${barChart}
  </div>`;
}

/* ============================= 值班排班表（監看CCTV） ============================= */
const DUTY_TYPE_MAP = {
  '正常值班': ['正常值班', 'var(--accent)'],
  '假日加班': ['假日加班', 'var(--amber)'],
  '請假代班': ['請假代班', 'var(--red)'],
};
function getDutyPeople() {
  const names = new Set();
  DB.duty.forEach(d => { if (d.person) names.add(d.person); if (d.backup) names.add(d.backup); });
  return [...names].sort();
}
function weekDatesFrom(monday) {
  const arr = [];
  for (let i=0;i<7;i++) { const d = new Date(monday); d.setDate(monday.getDate()+i); arr.push(d.toISOString().slice(0,10)); }
  return arr;
}
function thisWeekMonday() {
  const d = new Date();
  const dow = d.getDay(); // 0=日 ... 6=六
  const diff = dow === 0 ? -6 : 1 - dow; // 週一為一週開始
  d.setDate(d.getDate()+diff);
  return d;
}
function renderDuty() {
  const cursor = state.dutyCursor;
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const weekLabel = ['日','一','二','三','四','五','六'];
  const people = getDutyPeople();

  const rows = [];
  for (let d=1; d<=daysInMonth; d++) {
    const dateObj = new Date(year, month, d);
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const wd = dateObj.getDay();
    const isWeekend = wd===0 || wd===6;
    const isToday = key === todayStr();
    const recs = DB.duty.filter(x => x.date === key).sort((a,b)=>(a.id||'').localeCompare(b.id||''));
    const recHtml = recs.map(r => {
      const [label, color] = DUTY_TYPE_MAP[r.type] || DUTY_TYPE_MAP['正常值班'];
      return `<div class="plan-row compact" style="margin-bottom:6px;">
        <span class="pill" style="background:${color}22;color:${color};border:1px solid ${color}66;flex-shrink:0;">${label}</span>
        <div class="plan-text"><b>${esc(r.person)}</b>${r.backup?`　代班：${esc(r.backup)}`:''}${r.note?`　<span class="text-dim">${esc(r.note)}</span>`:''}</div>
        <button class="icon-btn" onclick="showDutyForm('${r.id}')">✎</button>
        <button class="icon-btn danger" onclick="confirmDelDuty('${r.id}')">✕</button>
      </div>`;
    }).join('') || `<p class="text-dim" style="padding:4px 0;font-size:13px;">尚未排班</p>`;
    rows.push(`<div class="duty-row ${isToday?'today':''} ${isWeekend?'weekend':''}">
      <div class="duty-date">
        <span class="mono">${key}</span><span class="text-dim" style="font-size:11px;">週${weekLabel[wd]}${isWeekend?'・假日':''}${isToday?'・今天':''}</span>
      </div>
      <div style="flex:1;min-width:0;">${recHtml}</div>
      <button class="btn ghost" style="flex-shrink:0;" onclick="showDutyForm(null,'${key}')">＋ 排班</button>
    </div>`);
  }

  return `
  <h1 class="page-title">📅 值班排班表</h1>
  <p class="text-dim" style="margin-bottom:16px;">監看CCTV人員排班，含假日加班與請假代班標記。</p>
  <div class="cal-head" style="justify-content:flex-start;gap:16px;margin-bottom:14px;">
    <button class="icon-btn" onclick="shiftDutyMonth(-1)">◀ 上個月</button>
    <span class="mono">${year} / ${String(month+1).padStart(2,'0')}</span>
    <button class="icon-btn" onclick="shiftDutyMonth(1)">下個月 ▶</button>
    <button class="btn primary" onclick="showDutyForm()">＋ 新增排班</button>
  </div>
  <datalist id="duty-people-list">${people.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
  <div class="duty-list">${rows.join('')}</div>`;
}
function shiftDutyMonth(delta) { const c = state.dutyCursor; state.dutyCursor = new Date(c.getFullYear(), c.getMonth()+delta, 1); render(); }
function showDutyForm(id, presetDate) {

  openModal(item ? '編輯排班' : '新增排班', `

      <input type="hidden" id="du-id" value="${item?item.id:''}">
      <label class="field"><span class="field-label mono">日期</span><input class="input" type="date" id="du-date" value="${item?item.date:(presetDate||todayStr())}"></label>
      <label class="field"><span class="field-label mono">值班人員</span><input class="input" id="du-person" list="duty-people-list" value="${item?esc(item.person):''}" placeholder="輸入姓名"></label>
      <label class="field"><span class="field-label mono">班別</span><select class="input" id="du-type">
        <option ${item&&item.type==='正常值班'?'selected':''}>正常值班</option>
        <option ${item&&item.type==='假日加班'?'selected':''}>假日加班</option>
        <option ${item&&item.type==='請假代班'?'selected':''}>請假代班</option>
      </select></label>

/* ============================= 工作日誌 ============================= */
function renderWorklog() {
  const patrol = DB.patrol;
  const tomorrow = DB.tomorrow;
  window.__filterSite = window.__filterSite || '全部';
  window.__filterDate = window.__filterDate || '';

  const STATUS_MAP = { done:['已完成','var(--green)'], pending:['待完成','var(--amber)'], incomplete:['未完成','var(--red)'] };

  function tomorrowSortKey(it) {
    // 工作項目文字常常自己打了日期（例如「8/31 …」「9/4(三) …」），
    // 有的話優先用它排序；沒有的話退回新增當下記錄的日期。
    const m = (it.task || '').match(/^(\d{1,2})\/(\d{1,2})/);
    if (m) {
      const year = (it.date || todayStr()).slice(0, 4);
      return `${year}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
    }
    return it.date || '9999-99-99';
  }

  function tomorrowRows() {
    const items = tomorrow.slice().sort((a, b) => {
      const bySite = (a.site || '').localeCompare(b.site || '');
      if (bySite !== 0) return bySite;
      return tomorrowSortKey(a).localeCompare(tomorrowSortKey(b));
    });
    return items.map(it => {
      const [label, color] = STATUS_MAP[it.status] || STATUS_MAP.pending;
      return `<div class="plan-row compact">
        <span class="pill" style="flex-shrink:0;">${it.site}</span>
        <button class="status-light" onclick="cycleTomorrow('${it.id}')"><span class="dot" style="background:${color};box-shadow:0 0 8px ${color}"></span>${label}</button>
        <div class="plan-text">${esc(it.task)}${it.assignee?` <span class="text-dim mono" style="font-size:12px;">（${esc(it.assignee)}）</span>`:''}</div>
        <button class="icon-btn danger" onclick="delTomorrow('${it.id}')">✕</button>
      </div>`;
    }).join('') || `<p class="text-dim" style="padding:8px 0;">尚無預計項目</p>`;
  }

  const tomorrowWidget = `<div class="viewfinder card compact-card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="card-head"><span>明日預計工作</span></div>
    <div class="row-form">
      <select class="input" id="tw-site" style="width:110px;flex-shrink:0;"><option>台中端</option><option>通霄端</option></select>
      <input class="input" id="tw-task" placeholder="工作項目">
      <input class="input" id="tw-assignee" placeholder="負責人員（選填）" style="width:140px;flex-shrink:0;">
      <button class="btn primary" style="flex-shrink:0;" onclick="addTomorrow(document.getElementById('tw-site').value)">＋新增</button>
    </div>
    <div class="plan-list" style="margin-top:10px;">${tomorrowRows()}</div>
  </div>`;

  const filtered = patrol.filter(p => (window.__filterSite==='全部'||p.site===window.__filterSite) && (!window.__filterDate||p.date===window.__filterDate));
  const rows = filtered.map(p => {
    const [label, color] = STATUS_MAP[p.status] || STATUS_MAP.pending;
    return `<tr>
    <td>${p.date}</td><td>${p.site}</td><td>${esc(p.personnel)}</td><td>${esc(p.timeRange)}</td><td>${esc(p.items)}</td>
    <td><button class="status-light" onclick="cyclePatrol('${p.id}')"><span class="dot" style="background:${color};box-shadow:0 0 8px ${color}"></span>${label}</button></td>
    <td>${esc(p.abnormalNote)||'—'}</td><td>${esc(p.signer)}</td>
    <td><button class="icon-btn danger" onclick="confirmDelPatrol('${p.id}')">🗑</button></td>
  </tr>`;
  }).join('') || `<tr><td colspan="9" class="text-dim" style="text-align:center;padding:20px;">尚無紀錄</td></tr>`;

  return `
  <h1 class="page-title">工作日誌</h1>
  ${tomorrowWidget}
  <div class="section-head"><h2 class="section-title">今日巡檢紀錄</h2><button class="btn primary" onclick="showPatrolForm()">＋ 新增紀錄</button></div>
  <div class="filter-row">
    <select class="input" style="width:140px" onchange="window.__filterSite=this.value;render()">
      <option ${window.__filterSite==='全部'?'selected':''}>全部</option>
      <option ${window.__filterSite==='台中端'?'selected':''}>台中端</option>
      <option ${window.__filterSite==='通霄端'?'selected':''}>通霄端</option>
    </select>
    <input class="input" style="width:160px" type="date" value="${window.__filterDate}" onchange="window.__filterDate=this.value;render()">
  </div>
  <div class="table-wrap"><table class="data-table">
    <thead><tr><th>日期</th><th>地點</th><th>人員</th><th>時段</th><th>巡檢項目</th><th>狀態（點擊切換）</th><th>異常說明</th><th>簽核人</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

async function addTomorrow(site) {
  const task = document.getElementById('tw-task').value.trim();
  const assignee = document.getElementById('tw-assignee').value.trim();
  if (!task) return;
  try {
    await apiUpsert(SHEET_MAP.tomorrow.sheet, SHEET_MAP.tomorrow.toRow({ site, task, assignee, status: 'pending', date: todayStr() }));
    await reloadOne('tomorrow');
  } catch (err) { alert('新增失敗：' + err); }
  render();
}
async function cycleTomorrow(id) {
  const it = DB.tomorrow.find(r => r.id === id);
  if (!it) return;
  const order = ['pending','done','incomplete'];
  const nextStatus = order[(order.indexOf(it.status)+1) % order.length];
  try {
    await apiUpsert(SHEET_MAP.tomorrow.sheet, SHEET_MAP.tomorrow.toRow({ ...it, status: nextStatus }));
    await reloadOne('tomorrow');
  } catch (err) { alert('更新失敗：' + err); }
  render();
}
async function delTomorrow(id) {
  try { await apiDelete(SHEET_MAP.tomorrow.sheet, id); await reloadOne('tomorrow'); }
  catch (err) { alert('刪除失敗：' + err); }
  render();
}
async function cyclePatrol(id) {
  const it = DB.patrol.find(r => r.id === id);
  if (!it) return;
  const order = ['pending','done','incomplete'];
  const nextStatus = order[(order.indexOf(it.status)+1) % order.length];
  try {
    await apiUpsert(SHEET_MAP.patrol.sheet, SHEET_MAP.patrol.toRow({ ...it, status: nextStatus }));
    await reloadOne('patrol');
  } catch (err) { alert('更新失敗：' + err); }
  render();
}
