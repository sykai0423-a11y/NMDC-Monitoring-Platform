<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTV監控平台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg-void: #0B0F14;
  --bg-panel: #121924;
  --bg-panel-2: #1A2330;
  --line: #24323D;
  --accent: #00D9C0;
  --red: #FF5A5F;
  --amber: #FFB020;
  --green: #33D17A;
  --text: #D7E1E6;
  --text-dim: #7C8B96;
}
* { box-sizing: border-box; }
body {
  margin: 0; display: flex; min-height: 100vh;
  background: var(--bg-void); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
}
.mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: .02em; }
.text-dim { color: var(--text-dim); }
.warn-text { color: var(--red); }

.sidebar { width: 220px; flex-shrink: 0; background: var(--bg-panel); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 24px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.brand-title { font-weight: 700; font-size: 15px; }
.brand-sub { font-size: 10px; color: var(--text-dim); }
.nav-list { display: flex; flex-direction: column; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; background: transparent; border: 1px solid transparent; color: var(--text-dim); padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; text-align: left; width: 100%; }
.nav-item:hover { background: var(--bg-panel-2); color: var(--text); }
.nav-item.active { background: rgba(0,217,192,.08); color: var(--accent); border-color: rgba(0,217,192,.35); }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid var(--line); background: var(--bg-panel); }
.topbar-title { font-size: 13px; color: var(--text-dim); }
.clock { display: flex; gap: 10px; font-size: 13px; color: var(--text-dim); }
.clock-time { color: var(--accent); }
.excel-actions { display: flex; gap: 8px; }

.content { flex: 1; overflow-y: auto; padding: 28px; }
.page-title { font-size: 20px; font-weight: 700; margin: 0 0 20px; }
.section-title { font-size: 15px; font-weight: 600; margin: 0; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 12px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } .sidebar { width: 72px; } .brand-title, .brand-sub, .nav-item span { display: none; } }

.viewfinder { position: relative; }
.corner { position: absolute; width: 12px; height: 12px; border: 2px solid var(--accent); opacity: .55; }
.corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
.corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
.corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

.card { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 4px; padding: 18px; }
.card-head { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 12px; }
.card-head span:first-of-type { flex: 1; }

.pill { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-family: monospace; }
.pill-green { background: rgba(51,209,122,.12); color: var(--green); border: 1px solid rgba(51,209,122,.4); }
.pill-red { background: rgba(255,90,95,.12); color: var(--red); border: 1px solid rgba(255,90,95,.4); }

.light-row { display: flex; gap: 18px; font-size: 13px; flex-wrap: wrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-light { display: inline-flex; align-items: center; font-size: 13px; cursor: pointer; background: none; border: none; color: var(--text); padding: 0; }

.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; padding: 8px 14px; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--bg-panel-2); color: var(--text); }
.btn.primary { background: var(--accent); color: #06201C; border-color: var(--accent); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.danger { background: rgba(255,90,95,.1); color: var(--red); border-color: rgba(255,90,95,.35); }
.btn.full { width: 100%; justify-content: center; margin-top: 10px; }
.btn.small { padding: 5px 10px; font-size: 12px; }
.icon-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px 6px; border-radius: 4px; font-size: 13px; }
.icon-btn:hover { color: var(--text); background: var(--bg-panel-2); }
.icon-btn.danger:hover { color: var(--red); }

.filter-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
.input { background: var(--bg-void); border: 1px solid var(--line); color: var(--text); border-radius: 4px; padding: 8px 10px; font-size: 13px; width: 100%; }
textarea.input { min-height: 70px; resize: vertical; font-family: inherit; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; padding: 10px 12px; background: var(--bg-panel-2); color: var(--text-dim); font-weight: 500; border-bottom: 1px solid var(--line); white-space: nowrap; }
.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.data-table tr:last-child td { border-bottom: none; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tab { background: none; border: none; color: var(--text-dim); padding: 10px 16px; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal-panel { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px; width: 440px; max-width: 92vw; max-height: 86vh; overflow-y: auto; }
.modal-panel.wide { width: 640px; }
.modal-panel.confirm { width: 380px; }
.maint-entry { background: var(--bg-panel-2); border-radius: 4px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
.maint-list { display: flex; flex-direction: column; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
.photo-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid var(--line); }
.lightbox-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox-backdrop img { max-width: 92vw; max-height: 92vh; border-radius: 4px; box-shadow: 0 0 40px rgba(0,0,0,.6); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 13px; }
.modal-body { padding: 18px; }

.form-grid { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 11px; color: var(--text-dim); }
.row-end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

.plan-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.plan-row { display: flex; align-items: center; gap: 10px; background: var(--bg-panel-2); border-radius: 4px; padding: 8px 10px; }
.plan-row.compact { padding: 6px 10px; gap: 8px; }
.plan-text { flex: 1; font-size: 13px; }
.compact-card { padding: 14px 18px; }
.row-form { display: flex; gap: 8px; align-items: center; background: var(--bg-panel-2); padding: 10px; border-radius: 4px; }
.row-form .input { width: auto; flex: 1; }
@media (max-width: 700px) { .row-form { flex-wrap: wrap; } }
.inline-add { display: flex; flex-direction: column; gap: 8px; background: var(--bg-panel-2); padding: 12px; border-radius: 4px; margin-top: 8px; }

.cal-head { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 14px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; position: relative; }
.cal-cell.day { background: var(--bg-panel-2); border: 1px solid transparent; border-radius: 4px; cursor: pointer; color: var(--text); }
.cal-cell.day:hover { border-color: var(--line); }
.cal-cell.day.today { border-color: var(--accent); }
.cal-cell.day.selected { background: rgba(0,217,192,.15); }
.cal-cell.day.has-file { color: var(--accent); }
.cal-cell.empty { visibility: hidden; }
.cal-cell.cal-label { color: var(--text-dim); font-size: 11px; }
.file-dot { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

.monitor-layout { display: flex; gap: 16px; align-items: flex-start; }
.monitor-list { width: 320px; flex-shrink: 0; max-height: 65vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 4px; padding: 8px; background: var(--bg-panel); }
.monitor-row { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 4px; cursor: pointer; background: var(--bg-panel-2); border: 1px solid transparent; }
.monitor-row:hover { border-color: var(--line); }
.monitor-row.selected { border-color: var(--accent); background: rgba(0,217,192,.12); }
.monitor-row.today .monitor-row-date span:first-child { color: var(--accent); }
.monitor-row-date { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.monitor-row-status { display: flex; align-items: center; gap: 8px; }
.monitor-detail { flex: 1; min-width: 260px; }
@media (max-width: 900px) { .monitor-layout { flex-direction: column; } .monitor-list { width: 100%; } }

.duty-list { display: flex; flex-direction: column; gap: 8px; }
.duty-row { display: flex; align-items: flex-start; gap: 14px; padding: 12px 14px; border-radius: 4px; background: var(--bg-panel-2); border: 1px solid transparent; }
.duty-row.today { border-color: var(--accent); background: rgba(0,217,192,.08); }
.duty-row.weekend { border-left: 3px solid var(--amber); }
.duty-date { flex-shrink: 0; width: 120px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; padding-top: 4px; }
@media (max-width: 700px) { .duty-row { flex-wrap: wrap; } .duty-date { width: 100%; flex-direction: row; gap: 8px; } }

.week-widget { display: flex; flex-direction: column; gap: 6px; }
.week-widget-row { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.week-widget-row.today { background: rgba(0,217,192,.1); }
.week-widget-day { width: 78px; flex-shrink: 0; color: var(--text-dim); }
.reminder-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.reminder-item { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.reminder-item:last-child { border-bottom: none; }
.mini-bar-wrap { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.mini-bar-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.mini-bar-label { width: 110px; flex-shrink: 0; color: var(--text-dim); }
.mini-bar-track { flex: 1; height: 8px; border-radius: 4px; background: var(--bg-void); overflow: hidden; }
.mini-bar-fill { height: 100%; border-radius: 4px; }
.mini-bar-val { width: 48px; text-align: right; flex-shrink: 0; font-family: monospace; font-size: 11px; color: var(--text-dim); }
.monitor-summary-title { display: flex; align-items: center; gap: 8px; font-weight: 600; margin: 28px 0 12px; }
.monitor-summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.monitor-summary-card { border: 1px solid var(--line); border-radius: 4px; padding: 12px; background: var(--bg-panel); display: flex; flex-direction: column; gap: 8px; }
.monitor-summary-card.uploaded { border-color: rgba(51,209,122,.3); }
.monitor-summary-card.missing { border-color: rgba(255,90,95,.25); }
.ms-card-top { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.ms-card-status { display: flex; align-items: center; font-size: 12px; }
.ms-card-filename { min-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-card-actions { display: flex; gap: 6px; margin-top: 2px; }
.ms-card-actions .btn { padding: 6px 8px; font-size: 12px; justify-content: center; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.link { color: var(--accent); text-decoration: underline; font-size: 13px; cursor: pointer; }
.cat-block { margin-top: 8px; }
.empty-hint { color: var(--text-dim); }
.ppe-frame { width: 100%; height: calc(100vh - 170px); border: 1px solid var(--line); border-radius: 6px; background: #fff; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">
    <span class="rec-dot"></span>
    <div>
      <div class="brand-title">CCTV監控平台</div>
      <div class="brand-sub mono">SITE SURVEILLANCE OPS</div>
    </div>
  </div>
  <div class="nav-list" id="navList"></div>
</div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title mono" id="topbarTitle"></div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="excel-actions">
        <button class="btn small ghost" onclick="exportExcel()">匯出Excel</button>
        <button class="btn small ghost" onclick="document.getElementById('importFile').click()">匯入Excel</button>
        <input type="file" id="importFile" accept=".xlsx" style="display:none" onchange="importExcel(event)">
      </div>
      <div class="clock mono" id="clockBox"></div>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
/* ============================= Google Apps Script 雲端同步 ============================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbxReHCmCeF1kPhYlxFSOzZv2dgnHAkvsh6i9LD91lSFM_gx8RJzb8Hl84_CfGU6qe_S/exec';
const BOOK = 'cctv';

function getCurrentUser() {
  let u = localStorage.getItem('cctv-current-user');
  if (!u) {
    u = (prompt('請輸入您的姓名（用於紀錄建立/修改人員，僅需輸入一次，之後可在瀏覽器清除資料後重新輸入）：', '') || '').trim() || '未知人員';
    localStorage.setItem('cctv-current-user', u);
  }
  return u;
}

async function apiList(sheet) {
  const url = `${API_URL}?action=list&book=${BOOK}&sheet=${encodeURIComponent(sheet)}`;
  const res = await fetch(url);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '讀取失敗');
  return json.data;
}
async function apiUpsert(sheet, record) {
  const payload = { action: 'upsert', book: BOOK, sheet, record, user: getCurrentUser() };
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '寫入失敗');
  return json.data;
}
async function apiDelete(sheet, idValue) {
  const payload = { action: 'delete', book: BOOK, sheet, id: idValue };
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '刪除失敗');
}
// 批次刪除（一次網路請求刪多筆），需要 Apps Script 有加 deleteMany action；
// 若後端尚未更新（回傳 unknown action），呼叫端會收到例外，可自行 fallback 成逐筆 apiDelete。
async function apiDeleteMany(sheet, ids) {
  const payload = { action: 'deleteMany', book: BOOK, sheet, ids };
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '批次刪除失敗');
}
async function apiUploadFile(file, subfolder, oldFileUrl) {
  const dataUrl = await fileToBase64(file);
  const payload = { action: 'uploadFile', book: BOOK, filename: file.name, base64Data: dataUrl, mimeType: file.type, subfolder: subfolder || '', oldFileUrl: oldFileUrl || '' };
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '檔案上傳失敗');
  return json.url;
}

// 各資料類型 <-> Google試算表分頁欄位對應
function equipToRow(r) { return { '設備ID': r.id||'', '類別': r.category, '設備名稱/編號': r.name, '安裝位置': r.location, '型號/廠牌': r.model, '安裝日期': r.installDate, '保固期限': r.warranty, '最近維護日期': r.lastMaintenance, '目前狀態': r.status, '負責廠商/人員': r.vendor, '備註': r.note }; }
function equipFromRow(s) { return { id: s['設備ID'], category: s['類別'], name: s['設備名稱/編號'], location: s['安裝位置'], model: s['型號/廠牌'], installDate: cleanDate(s['安裝日期']), warranty: cleanDate(s['保固期限']), lastMaintenance: cleanDate(s['最近維護日期']), status: s['目前狀態'], vendor: s['負責廠商/人員'], note: s['備註'] }; }
function gpsToRow(r) { return { '設備ID': r.id||'', 'NUM編號': r.num, '品名': r.name, '型號': r.model, 'IMEI': r.imei, 'MAC': r.mac, '產地': r.origin, '區域': r.site, '安裝位置': r.location, '備註': r.note, '照片連結': r.photo||'' }; }
function gpsFromRow(s) { return { id: s['設備ID'], num: s['NUM編號'], name: s['品名'], model: s['型號'], imei: s['IMEI']!=null?String(s['IMEI']):'', mac: s['MAC'], origin: s['產地'], site: s['區域']||'未分類', location: s['安裝位置'], note: s['備註'], photo: s['照片連結']||'' }; }

// 監看紀錄表：以日期為主鍵，獨立處理
async function apiListMonitor() {
  const rows = await apiList('監看紀錄表');
  const obj = {};
  rows.forEach(r => { if (r['日期']) obj[r['日期']] = { filename: r['檔名'], fileUrl: r['雲端硬碟檔案連結'], uploader: r['上傳人'], uploadTime: r['上傳時間'], overwriteCount: r['覆蓋次數']||0 }; });
  return obj;
}
async function apiSaveMonitor(date, filename, fileUrl, overwriteCount) {
  return apiUpsert('監看紀錄表', { '日期': date, '檔名': filename, '雲端硬碟檔案連結': fileUrl, '上傳人': getCurrentUser(), '上傳時間': new Date().toISOString(), '覆蓋次數': overwriteCount });
}

// 全域資料快取：畫面渲染時直接讀這裡（同步），寫入/刪除成功後才重新從雲端拉取該類型資料
let DB = { patrol: [], tomorrow: [], poeChecks: [], poeExtra: [], equipTaichung: [], equipTongxiao: [], monitorFiles: {}, monitorMonthly: {}, poeReservation: [], equipMaint: [], gpsDevices: [], duty: [] };

async function loadAllData() {
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = '<div class="page"><p class="text-dim">連線 Google 雲端讀取資料中…</p></div>';
  try {
    const [patrolRows, tomorrowRows, poeCheckRows, poeExtraRows, equipTRows, equipXRows, monitorObj, monitorMonthlyObj, poeResRows, equipMaintRows, gpsRows, dutyRows] = await Promise.all([
      apiList('工作日誌'), apiList('明日預計工作'), apiList('POE抽查日誌'), apiList('POE其他需求檔案'),
      apiList('台中端設備清單'), apiList('通霄端設備清單'), apiListMonitor(), apiListMonitorMonthly(),
      apiList('POE預約抽查'), apiList('設備維護紀錄'), apiList('GPS機台資料表'),
      apiList('監看值班表').catch(() => []), // 若試算表尚未新增「監看值班表」分頁，先以空陣列降級，不中斷其他資料讀取
    ]);
    DB.patrol = patrolRows.map(SHEET_MAP.patrol.fromRow);
    DB.tomorrow = tomorrowRows.map(SHEET_MAP.tomorrow.fromRow);
    DB.poeChecks = poeCheckRows.map(SHEET_MAP.poeChecks.fromRow);
    DB.poeExtra = poeExtraRows.map(SHEET_MAP.poeExtra.fromRow);
    DB.equipTaichung = equipTRows.map(SHEET_MAP.equipTaichung.fromRow);
    DB.equipTongxiao = equipXRows.map(SHEET_MAP.equipTongxiao.fromRow);
    DB.monitorFiles = monitorObj;
    DB.monitorMonthly = monitorMonthlyObj;
    DB.poeReservation = poeResRows.map(SHEET_MAP.poeReservation.fromRow);
    DB.equipMaint = equipMaintRows.map(SHEET_MAP.equipMaint.fromRow);
    DB.gpsDevices = gpsRows.map(SHEET_MAP.gpsDevices.fromRow);
    DB.duty = dutyRows.map(SHEET_MAP.duty.fromRow);
  } catch (err) {
    contentEl.innerHTML = `<div class="page"><p class="warn-text">雲端資料讀取失敗：${esc(String(err))}</p><button class="btn primary" onclick="loadAllData()">重試</button></div>`;
    return;
  }
  render();
}

async function reloadOne(type) {
  if (type === 'monitorFiles') { DB.monitorFiles = await apiListMonitor(); return; }
  if (type === 'monitorMonthly') { DB.monitorMonthly = await apiListMonitorMonthly(); return; }
  const map = SHEET_MAP[type];
  const rows = await apiList(map.sheet);
  DB[type] = rows.map(map.fromRow);
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function fileToBase64(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function esc(s) { return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function openFile(url) { if (url) window.open(url, '_blank'); }
function cleanDate(v) {
  if (!v) return v;
  const s = String(v);
  // 把可能殘留的完整時間戳記（例如 2026-04-27T16:00:00.000Z）裁成純日期
  return (s.length >= 10 && s[4] === '-' && s[7] === '-') ? s.slice(0, 10) : s;
}
function toPreviewUrl(url) {
  if (!url) return '';
  const m = url.match(/\/document\/d\/([^\/]+)/);
  if (m) return `https://docs.google.com/document/d/${m[1]}/preview`;
  return '';
}
// 把 Google Drive 的「檢視連結」(.../file/d/ID/view) 轉成「直接下載連結」，
// 點擊後才會真的觸發瀏覽器下載檔案到電腦，而不是進到雲端硬碟線上預覽頁。
function toDriveDownloadUrl(url) {
  if (!url) return '';
  const m = url.match(/\/file\/d\/([^\/]+)/) || url.match(/[?&]id=([^&]+)/);
  if (m) return `https://drive.google.com/uc?export=download&id=${m[1]}`;
  return url;
}

  .card-btn:hover { opacity: .75; }
  .card-btn-in { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
  .card-btn-out { background: var(--zero-bg); color: var(--zero); border-color: var(--zero); }
  .del-btn { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; background: transparent; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; transition: background .12s, color .12s; }
  .del-btn:hover { background: var(--zero-bg); color: var(--zero); }
  .bar-list { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-label { width: 90px; font-size: 12px; color: var(--text-secondary); text-align: right; flex-shrink: 0; }
  .bar-track { flex: 1; height: 12px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .bar-val { width: 28px; font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 14px; padding: 24px; width: 400px; max-width: 95vw; box-shadow: 0 12px 40px rgba(0,0,0,.15); }
  .modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .modal .modal-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; display: block; }
  .form-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: var(--font); background: var(--bg); color: var(--text-primary); outline: none; transition: border-color .15s; }
  .form-input:focus { border-color: var(--accent); background: var(--surface); }
  select.form-input { cursor: pointer; }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; justify-content: center; }
  .action-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .action-tab { flex: 1; padding: 8px; text-align: center; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; cursor: pointer; transition: all .15s; color: var(--text-secondary); }
  .action-tab.active-in { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .action-tab.active-out { background: var(--zero-bg); border-color: var(--zero); color: var(--zero); font-weight: 600; }

  /* ── 裝備管理 table ── */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--bg); font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text-primary); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .tag-in { background: var(--ok-bg); color: var(--ok); }
  .tag-out { background: var(--zero-bg); color: var(--zero); }
  .group-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--accent-bg); color: var(--accent); font-weight: 500; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text-primary); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 13px; transform: translateY(80px); opacity: 0; transition: all .3s; z-index: 300; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
  .manage-toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
  .manage-toolbar input { flex: 1; max-width: 260px; }
  .confirm-bar { background: var(--zero-bg); border: 1px solid var(--zero); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--zero); }
  .confirm-bar .btn { flex-shrink: 0; }
  .edit-input { width: 100%; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: var(--font); background: var(--surface); }
  .edit-input:focus { border-color: var(--accent); outline: none; }
  .export-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .export-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
  .export-icon { font-size: 28px; }
  .export-title { font-size: 15px; font-weight: 600; }
  .export-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; flex: 1; }
  .export-preview { font-size: 12px; color: var(--text-muted); background: var(--bg); border-radius: 6px; padding: 6px 10px; }
  .export-btn { width: 100%; justify-content: center; margin-top: 4px; }
  .export-note { background: var(--accent-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; font-size: 13px; color: var(--text-secondary); line-height: 1.7; }

  /* ── Excel 同步指示器 ── */
  #sync-status-bar { transition: color .3s; }
  .sync-writing { color: var(--accent) !important; }
  .sync-ok { color: var(--ok) !important; }
  .sync-err { color: var(--zero) !important; }
  #btn-link-excel.linked { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .fsa-note { background: var(--accent-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px; }
  .fsa-warn { background: var(--low-bg); border: 1px solid var(--low); border-radius: 10px; padding: 12px 16px; font-size: 12px; color: var(--low); margin-bottom: 16px; display: none; }
  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    nav { display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 0; }
    .nav-section { display: none; }
    .nav-item { border-left: none; border-bottom: 2px solid transparent; white-space: nowrap; padding: 12px 14px; }
    .nav-item.active { border-bottom-color: var(--accent); border-left-color: transparent; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div>
    <h1>🦺 個人防護具庫存管理</h1>
    <div class="subtitle" id="sync-status-bar">📂 點擊右上角「連結 Excel」即可開始即時同步</div>
  </div>
  <div class="header-right">
    <button class="btn" id="btn-link-excel" onclick="linkExcelFile()" title="選取本機 Excel 檔案，之後每次變更都會自動寫入">📂 連結 Excel</button>
    <button class="btn btn-success" onclick="openModal('in')">＋ 進貨</button>
    <button class="btn btn-danger" onclick="openModal('out')">－ 領取</button>
  </div>
</header>

<div class="layout">
  <nav>
    <div class="nav-section">主選單</div>
    <div class="nav-item active" onclick="showPage('overview',this)"><span class="nav-icon">📊</span> 庫存總覽</div>
    <div class="nav-item" onclick="showPage('chart',this)"><span class="nav-icon">📈</span> 圖形分析</div>
    <div class="nav-item" onclick="showPage('log',this)"><span class="nav-icon">📋</span> 異動紀錄</div>
    <div class="nav-section">管理</div>
    <div class="nav-item" id="nav-low" onclick="showPage('low',this)">
      <span class="nav-icon">⚠️</span> 偏低品項
      <span class="badge badge-low" id="low-badge">0</span>
    </div>
    <div class="nav-item" id="nav-purchase" onclick="showPage('purchase',this)">
      <span class="nav-icon">🛒</span> 採購裝備
      <span class="badge badge-low" id="purchase-badge">0</span>
    </div>
    <div class="nav-item" onclick="showPage('manage',this)"><span class="nav-icon">⚙️</span> 裝備管理</div>
    <div class="nav-item" onclick="showPage('export',this)"><span class="nav-icon">📊</span> 匯出 / 備份</div>
  </nav>

  <main>
    <\!-- 總覽 -->
    <div class="page active" id="page-overview">
      <div class="stats-row" id="stats-row"></div>
      <div id="inv-sections"></div>
    </div>

    <\!-- 圖形 -->
    <div class="page" id="page-chart">
      <div class="sec-title">安全鞋（按尺碼）</div>
      <div class="bar-list" id="bar-shoes"></div>
      <div class="sec-title">背心（按款式）</div>
      <div class="bar-list" id="bar-vests"></div>
      <div class="sec-title">台中端</div>
      <div class="bar-list" id="bar-taichung"></div>
      <div class="sec-title">其他品項</div>
      <div class="bar-list" id="bar-others"></div>
    </div>

    <\!-- 紀錄 -->
    <div class="page" id="page-log">
      <div class="table-wrap">
        <table>
          <thead><tr><th>時間</th><th>類型</th><th>品項</th><th>數量</th><th>人員</th><th>備註</th></tr></thead>
          <tbody id="log-tbody"><tr><td colspan="6" class="empty">尚無異動紀錄</td></tr></tbody>
        </table>
      </div>
    </div>

    <\!-- 偏低 -->
    <div class="page" id="page-low">
      <div class="inv-grid" id="low-grid"></div>
    </div>

    <\!-- 採購裝備 -->
    <div class="page" id="page-purchase">
      <div class="manage-toolbar">
        <button class="btn btn-accent" onclick="openPurchaseModal()">＋ 新增採購申請</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>品項</th>
              <th>數量</th>
              <th>需求人員</th>
              <th>編輯人員</th>
              <th>登記時間</th>
              <th style="text-align:center">狀態</th>
              <th style="text-align:center">操作</th>
            </tr>
          </thead>
          <tbody id="purchase-tbody"><tr><td colspan="7" class="empty">尚無採購申請</td></tr></tbody>
        </table>
      </div>
    </div>

    <\!-- 匯出 / 備份 -->
    <div class="page" id="page-export">

      <div class="fsa-note" id="fsa-support-note">
        <b>🔗 即時同步說明</b><br>
        點擊右上角「連結 Excel」後選取本機的 xlsx 檔案，系統會立即讀入現有庫存，
        且之後每次進貨 / 領取都會在 <b>2 秒內自動寫回</b>該 Excel，不需要手動按任何按鈕。<br>
        ⚠️ 此功能需要 <b>Chrome 86+ 或 Edge 86+</b>（File System Access API）。Firefox / Safari 請改用下方「備份下載」。
      </div>
      <div class="fsa-warn" id="fsa-not-supported">
        ⚠️ 你的瀏覽器不支援 File System Access API，無法即時寫回本機 Excel。請改用下方「備份下載」功能。
      </div>

      <div class="export-grid">

        <div class="export-card" style="border-color:var(--accent);background:var(--accent-bg)">
          <div class="export-icon">🔗</div>
          <div class="export-title">即時連結 Excel 檔案</div>
          <div class="export-desc">選取本機的「個人防護具數量清冊.xlsx」，自動讀入現有庫存，之後每次操作都會自動寫回，無需手動同步。</div>
          <div class="export-preview" id="linked-file-preview">尚未連結任何檔案</div>
          <button class="btn btn-accent export-btn" id="btn-link-excel2" onclick="linkExcelFile()">📂 選取並連結 Excel</button>
          <button class="btn export-btn" id="btn-unlink-excel" onclick="unlinkExcel()" style="display:none;background:var(--zero-bg);color:var(--zero);border-color:var(--zero)">✕ 解除連結</button>
        </div>

        <div class="export-card">
          <div class="export-icon">📋</div>
          <div class="export-title">備份：庫存清冊</div>
          <div class="export-desc">下載所有品項的目前庫存數量、類別、群組與狀態，適合存檔或給主管確認。</div>
          <div class="export-preview" id="preview-inv">共 <b id="prev-inv-count">0</b> 筆品項</div>
          <button class="btn btn-success export-btn" onclick="exportInventory()">⬇ 下載庫存清冊</button>
        </div>

        <div class="export-card">
          <div class="export-icon">📈</div>
          <div class="export-title">備份：異動紀錄</div>
          <div class="export-desc">下載所有進貨與領取的歷史紀錄，包含時間、人員、品項與前後庫存量。</div>
          <div class="export-preview">共 <b id="prev-log-count">0</b> 筆紀錄</div>
          <button class="btn btn-accent export-btn" onclick="exportLogs()">⬇ 下載異動紀錄</button>
        </div>

        <div class="export-card">
          <div class="export-icon">✏️</div>
          <div class="export-title">備份：空白盤點表</div>
          <div class="export-desc">產生含所有品項的空白盤點 Excel，有「預期數量」與「實際清點」兩欄，方便現場填寫後回傳。</div>
          <div class="export-preview">包含所有 <b id="prev-count-count">0</b> 個品項</div>
          <button class="btn export-btn" onclick="exportCountSheet()">⬇ 下載盤點表</button>
        </div>

        <div class="export-card">
          <div class="export-icon">🛒</div>
          <div class="export-title">備份：採購申請</div>
          <div class="export-desc">下載所有同事提出的採購裝備申請，包含品項、數量、需求人員、編輯人員與採購狀態。</div>
          <div class="export-preview">共 <b id="prev-purchase-count">0</b> 筆申請</div>
          <button class="btn export-btn" onclick="exportPurchases()">⬇ 下載採購申請</button>
        </div>

      </div>
    </div>

    <\!-- 裝備管理 -->
    <div class="page" id="page-manage">
      <div id="delete-confirm-bar" style="display:none"></div>
      <div class="manage-toolbar">
        <button class="btn btn-accent" onclick="openAddModal()">＋ 新增裝備</button>
        <input class="form-input" id="manage-search" placeholder="搜尋品項名稱…" oninput="renderManageTable()" style="max-width:240px">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>品項名稱</th>
              <th>類別</th>
              <th>群組</th>
              <th style="text-align:center">目前庫存</th>
              <th style="text-align:center">操作</th>
            </tr>
          </thead>
          <tbody id="manage-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<\!-- 進貨/領取 Modal -->
<div class="overlay" id="overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <h2 id="modal-title">新增異動</h2>
    <div class="modal-sub" id="modal-sub">選擇品項並輸入數量</div>
    <div class="action-tabs">
      <div class="action-tab active-in" id="tab-in" onclick="setType('in')">＋ 進貨 / 補庫</div>
      <div class="action-tab" id="tab-out" onclick="setType('out')">－ 領取 / 扣除</div>
    </div>
    <div class="form-group">
      <label class="form-label">品項</label>
      <select class="form-input" id="sel-item"></select>
    </div>
    <div class="form-group">
      <label class="form-label">數量</label>
      <input type="number" min="1" class="form-input" id="inp-qty" value="1">
    </div>
    <div class="form-group">
      <label class="form-label">人員 / 事由</label>
      <input type="text" class="form-input" id="inp-person" placeholder="姓名或說明（選填）">
    </div>
    <div class="form-group">
      <label class="form-label">備註</label>
      <input type="text" class="form-input" id="inp-note" placeholder="選填">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modal-submit" onclick="submitModal()">確認</button>
    </div>
  </div>
</div>

<\!-- 新增裝備 Modal -->
<div class="overlay" id="add-overlay" onclick="closeAddOutside(event)">
  <div class="modal">
    <h2>新增裝備品項</h2>
    <div class="modal-sub">填寫後將立即出現在庫存清單中</div>
    <div class="form-group">
      <label class="form-label">品項名稱 <span style="color:var(--zero)">*</span></label>
      <input type="text" class="form-input" id="add-name" placeholder="例：安全帽 L">
    </div>
    <div class="form-group">
      <label class="form-label">類別（顯示於卡片頂端）</label>
      <input type="text" class="form-input" id="add-cat" placeholder="例：安全帽、手套、背心…">
    </div>
    <div class="form-group">
      <label class="form-label">群組分類</label>
      <select class="form-input" id="add-group">
        <option value="main">主要裝備</option>
        <option value="vest">背心</option>
        <option value="shoe">安全鞋</option>
        <option value="taichung">台中端</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">初始庫存數量</label>
      <input type="number" min="0" class="form-input" id="add-qty" value="0">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeAddModal()">取消</button>
      <button class="btn btn-accent" onclick="submitAdd()">新增</button>
    </div>
  </div>
</div>

<\!-- 新增採購申請 Modal -->
<div class="overlay" id="purchase-overlay" onclick="closePurchaseOutside(event)">
  <div class="modal">
    <h2 id="purchase-modal-title">新增採購申請</h2>
    <div class="modal-sub">同事需要採購裝備時，可在此記錄需求</div>
    <div class="form-group">
      <label class="form-label">品項 <span style="color:var(--zero)">*</span></label>
      <input type="text" class="form-input" id="purchase-item" list="purchase-item-list" placeholder="例：安全帽 L、雨鞋 40…">
      <datalist id="purchase-item-list"></datalist>
    </div>
    <div class="form-group">
      <label class="form-label">數量 <span style="color:var(--zero)">*</span></label>
      <input type="number" min="1" class="form-input" id="purchase-qty" value="1">
    </div>
    <div class="form-group">
      <label class="form-label">需求人員</label>
      <input type="text" class="form-input" id="purchase-requester" placeholder="提出採購需求的同事姓名">
    </div>
    <div class="form-group">
      <label class="form-label">編輯人員</label>
      <input type="text" class="form-input" id="purchase-editor" placeholder="登記此筆申請的人員姓名">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closePurchaseModal()">取消</button>
      <button class="btn btn-accent" id="purchase-submit-btn" onclick="submitPurchase()">新增</button>
    </div>
  </div>
</div>

<\!-- 刪除確認 Modal -->
<div class="overlay" id="del-overlay" onclick="closeDelOutside(event)">
  <div class="modal">
    <h2>確認刪除</h2>
    <div class="modal-sub" id="del-sub">此操作無法復原，該品項的異動紀錄將保留。</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeDelModal()">取消</button>
      <button class="btn btn-danger" onclick="confirmDelete()">確認刪除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULTS = [
  {id:'helmet', cat:'安全帽', name:'安全帽', qty:46, group:'main'},
  {id:'vest-o-xl', cat:'背心（橘色）', name:'橘背心 XL', qty:33, group:'vest'},
  {id:'vest-o-2xl', cat:'背心（橘色）', name:'橘背心 2XL', qty:49, group:'vest'},
  {id:'vest-o-3xl', cat:'背心（橘色）', name:'橘背心 3XL', qty:50, group:'vest'},

// 讓使用者選取 Excel 檔案並取得寫入權限
async function linkExcelFile() {
  if (!FSA_SUPPORTED) { showToast('瀏覽器不支援，請用 Chrome/Edge 86+'); return; }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'Excel 檔案', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }],
      multiple: false
    });
    // 請求寫入權限
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { showToast('需要讀寫權限才能同步'); return; }

    excelFileHandle = handle;
    localStorage.setItem('ppe_excel_linked', handle.name);

    // 立即讀入 Excel 資料
    await readFromExcelHandle(handle);

    // 更新 UI
    updateLinkUI(handle.name);
    showToast('✅ 已連結「' + handle.name + '」，之後操作將自動同步');
  } catch(e) {
    if (e.name !== 'AbortError') showToast('連結失敗：' + e.message);
  }
}

  excelFileHandle = null;
  localStorage.removeItem('ppe_excel_linked');
  updateLinkUI(null);
  setSyncStatus(null, '📂 點擊右上角「連結 Excel」即可開始即時同步');

// 從已授權 handle 讀入 Excel
async function readFromExcelHandle(handle) {
  if (typeof XLSX === 'undefined') { showToast('SheetJS 尚未載入'); return; }
  const file = await handle.getFile();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });

  // 找到「庫存總覽」或第一張工作表
  const sheetName = wb.SheetNames.find(n => n.includes('庫存') || n.includes('總覽')) || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

  let headerRow = -1, catCol = -1, nameCol = -1, qtyCol = -1;
  for (let r = 0; r < Math.min(rows.length, 10); r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) {
      const cell = String(row[c]).trim();
      if (cell === '類別') catCol = c;
      if (cell === '品項') nameCol = c;
      if (cell.includes('目前庫存')) qtyCol = c;
    }
    if (catCol >= 0 && nameCol >= 0 && qtyCol >= 0) { headerRow = r; break; }
  }
  if (headerRow < 0) { showToast('⚠️ 找不到標準欄位，保留現有資料'); return; }

  const catMap = {
    '安全帽': 'main', '手套': 'other', '手套夾': 'main',
    '安全眼鏡': 'main', '救生衣': 'main', '頭戴式LED': 'main',
    '滅火器': 'main', '對講機': 'main',
    '背心': 'vest', '安全鞋': 'shoe', '雨鞋': 'other', '雨衣': 'other',
    '台中端': 'taichung'
  };
  function guessGroup(cat, name) {
    for (const [k,v] of Object.entries(catMap)) if (cat.includes(k)||name.includes(k)) return v;
    return 'other';
  }
  function nameToId(n) { return 'xl_' + n.replace(/\\s+/g,'_'); }

  const imported = [];
  function parseCol(rows, headerRow, catC, nameC, qtyC) {
    for (let r = headerRow + 1; r < rows.length; r++) {
      const row = rows[r];
      const catRaw = String(row[catC] || '').replace(/^[^\\w\\u4e00-\\u9fff]+/, '').trim();
      const nameRaw = String(row[nameC] || '').trim();
      const qtyRaw = parseInt(row[qtyC]);
      if (!nameRaw || isNaN(qtyRaw)) continue;
      if (imported.find(i => i.name === nameRaw)) continue;
      const catClean = catRaw.replace(/^[\\u{1F900}-\\u{1FFFF}]/u, '').trim();
      imported.push({ id: nameToId(nameRaw), cat: catClean || nameRaw, name: nameRaw, qty: qtyRaw, group: guessGroup(catClean, nameRaw) });
    }
  }
  parseCol(rows, headerRow, catCol, nameCol, qtyCol);
  // 右欄（雙欄格式，偏移5）
  if (catCol + 5 < rows[headerRow].length) parseCol(rows, headerRow, catCol+5, nameCol+5, qtyCol+5);

  if (imported.length === 0) { showToast('⚠️ 未解析到品項'); return; }

  let updated = 0, added = 0;
  imported.forEach(xi => {
    const ex = inventory.find(i => i.name === xi.name);
    if (ex) { ex.qty = xi.qty; updated++; }
    else { inventory.push(xi); added++; }
  });

  // ── 一併讀入「採購申請」工作表（若存在）──
  const purchaseSheetName = wb.SheetNames.find(n => n.includes('採購'));
  if (purchaseSheetName) {
    const pws = wb.Sheets[purchaseSheetName];
    const prows = XLSX.utils.sheet_to_json(pws, { header: 1, defval: '' });
    let pHeaderRow = -1, cItem=-1, cQty=-1, cReq=-1, cEdit=-1, cTime=-1, cStatus=-1;
    for (let r = 0; r < Math.min(prows.length, 5); r++) {
      const row = prows[r];
      for (let c = 0; c < row.length; c++) {
        const cell = String(row[c]).trim();
        if (cell === '品項') cItem = c;
        if (cell === '數量') cQty = c;
        if (cell === '需求人員') cReq = c;
        if (cell === '編輯人員') cEdit = c;
        if (cell.includes('登記時間')||cell==='時間') cTime = c;
        if (cell === '狀態') cStatus = c;
      }
      if (cItem>=0 && cQty>=0) { pHeaderRow = r; break; }
    }
    if (pHeaderRow >= 0) {
      const importedPurchases = [];
      for (let r = pHeaderRow + 1; r < prows.length; r++) {
        const row = prows[r];
        const itemRaw = String(row[cItem]||'').trim();
        const qtyRaw = parseInt(row[cQty]);
        if (!itemRaw || isNaN(qtyRaw)) continue;
        const statusRaw = String(cStatus>=0?row[cStatus]:'').trim();
        importedPurchases.push({
          item: itemRaw, qty: qtyRaw,
          requester: cReq>=0?String(row[cReq]||'').trim():'',
          editor: cEdit>=0?String(row[cEdit]||'').trim():'',
          time: cTime>=0?String(row[cTime]||'').trim():'',
          status: statusRaw.includes('已採購') ? 'done' : 'pending'
        });
      }
      importedPurchases.forEach(ip => {
        const ex = purchases.find(p => p.item===ip.item && p.time===ip.time && p.requester===ip.requester);
        if (ex) { ex.qty = ip.qty; ex.editor = ip.editor; ex.status = ip.status; }
        else { purchases.push({ id: uid(), ...ip }); }
      });
    }
  }

  save(false); // 不觸發寫回，避免循環
  renderAll();
  setSyncStatus('ok', '🔗 已連結 ' + handle.name + ' ─ 操作後自動同步');
}

// 寫回 Excel（debounce 2秒）
function scheduleWriteBack() {
  if (!excelFileHandle) return;
  clearTimeout(syncTimer);
  setSyncStatus('writing', '⏳ 同步中…');
  syncTimer = setTimeout(() => writeBackToExcel(), 2000);
}

async function writeBackToExcel() {
  if (!excelFileHandle || typeof XLSX === 'undefined') return;
  try {
    const statusText = q => q===0?'❌ 缺貨':q<=4?'⚠️ 偏低':'✅ 充足';
    const typeText = t => t==='in'?'進貨':t==='out'?'領取':'盤點';
    const wb = XLSX.utils.book_new();

    // 工作表1：庫存總覽（雙欄）
    const overviewRows = [
      ['📊 個人防護具庫存總覽'],
      ['⚡ 最後同步：' + new Date().toLocaleString('zh-TW')],
      ['類別','品項','目前庫存','狀態','','類別','品項','目前庫存','狀態']
    ];
    const half = Math.ceil(inventory.length / 2);
    for (let i = 0; i < half; i++) {
      const l = inventory[i], r = inventory[i + half];
      const row = [l.cat, l.name, l.qty, statusText(l.qty), ''];
      if (r) row.push(r.cat, r.name, r.qty, statusText(r.qty));
      overviewRows.push(row);
    }
    overviewRows.push([], ['顏色說明'], ['✅ 充足（庫存 ≥ 5件）','⚠️ 偏低（庫存 1-4件）','❌ 缺貨（庫存 = 0件）']);
    const ws1 = XLSX.utils.aoa_to_sheet(overviewRows);
    ws1['!cols'] = [16,18,10,10,2,16,18,10,10].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws1, '📊 庫存總覽');

    // 工作表2：異動流水帳
    const logRows = [['時間','類型','品項名稱','異動數量','人員/事由','備註','異動前庫存','異動後庫存']];
    [...logs].reverse().forEach(l => logRows.push([
      l.time, typeText(l.type), l.name,
      (l.type==='in'?'+':'-') + l.qty,
      l.person||'', l.note||'', l.prev??'', l.after??''
    ]));
    const ws2 = XLSX.utils.aoa_to_sheet(logRows);
    ws2['!cols'] = [18,8,18,10,16,16,12,12].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws2, '📝 異動流水帳');

    // 工作表3：品項清單
    const itemRows = [['ID','類別','品項名稱','群組','目前庫存','狀態']];
    inventory.forEach(i => itemRows.push([i.id, i.cat, i.name, groupLabel(i.group), i.qty, statusText(i.qty)]));
    const ws3 = XLSX.utils.aoa_to_sheet(itemRows);
    ws3['!cols'] = [20,16,18,12,12,10].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws3, '🗂 品項清單');

    // 工作表4：採購申請
    const purchaseRows = [['品項','數量','需求人員','編輯人員','登記時間','狀態']];
    [...purchases].reverse().forEach(p => purchaseRows.push([
      p.item, p.qty, p.requester||'', p.editor||'', p.time, p.status==='done'?'✅ 已採購':'⏳ 待採購'
    ]));
    const ws4 = XLSX.utils.aoa_to_sheet(purchaseRows);
    ws4['!cols'] = [18,8,14,14,18,10].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws4, '🛒 採購申請');

    // 寫入本機檔案
    const wbBuf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const writable = await excelFileHandle.createWritable();
    await writable.write(new Blob([wbBuf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    await writable.close();

    setSyncStatus('ok', '✅ 已同步至 ' + excelFileHandle.name + '（' + new Date().toLocaleTimeString('zh-TW') + '）');
  } catch(e) {
    setSyncStatus('err', '❌ 同步失敗：' + e.message);
    console.error(e);
  }
}

function save(doSync = true) {
  localStorage.setItem('ppe_inv', JSON.stringify(inventory));

}
function uid() { return 'item_' + Date.now() + '_' + Math.random().toString(36).slice(2,6); }
function statusClass(q) { return q===0?'zero':q<=4?'low':'ok'; }
function statusLabel(q) { return q===0?'❌ 缺貨':q<=4?'⚠️ 偏低':'✅ 充足'; }
function pillClass(q) { return q===0?'pill-zero':q<=4?'pill-low':'pill-ok'; }
function barColor(q) { return q===0?'#E24B4A':q<=4?'#BA7517':'#1D9E75'; }
function groupLabel(g) { return {main:'主要裝備',vest:'背心',shoe:'安全鞋',taichung:'台中端',other:'其他'}[g]||g; }

function renderCharts() {

function renderBarList(id, items) {
  if (!items.length) { document.getElementById(id).innerHTML='<div class="empty">無品項</div>'; return; }
  const max = Math.max(...items.map(i=>i.qty), 1);
  document.getElementById(id).innerHTML = items.map(item => {
    const pct = Math.round(item.qty/max*100);
    return \`<div class="bar-row">
      <div class="bar-label">\${item.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:\${pct}%;background:\${barColor(item.qty)}"></div></div>
      <div class="bar-val">\${item.qty}</div>
    </div>\`;
  }).join('');
}

function renderLog() {

function renderManageTable() {
  const q = (document.getElementById('manage-search')||{value:''}).value.toLowerCase();
  const items = inventory.filter(i=>!q||i.name.toLowerCase().includes(q)||i.cat.toLowerCase().includes(q));
  const tbody = document.getElementById('manage-tbody');
  if (!items.length) { tbody.innerHTML='<tr><td colspan="5" class="empty">沒有符合的品項</td></tr>'; return; }
  tbody.innerHTML = items.map(item=>\`
    <tr>
      <td>
        <span id="name-display-\${item.id}">\${item.name}</span>
        <input class="edit-input" id="name-edit-\${item.id}" value="\${item.name}" style="display:none" onblur="saveEdit('\${item.id}','name')" onkeydown="editKeydown(event,'\${item.id}','name')">
      </td>
      <td>
        <span id="cat-display-\${item.id}">\${item.cat}</span>
        <input class="edit-input" id="cat-edit-\${item.id}" value="\${item.cat}" style="display:none" onblur="saveEdit('\${item.id}','cat')" onkeydown="editKeydown(event,'\${item.id}','cat')">
      </td>
      <td><span class="group-badge">\${groupLabel(item.group)}</span></td>

      <td style="text-align:center">

          <button class="btn btn-sm" onclick="startEdit('\${item.id}','name')">改名稱</button>
          <button class="btn btn-sm" onclick="startEdit('\${item.id}','cat')">改類別</button>

function updateLowBadge() {
  const c = inventory.filter(i=>i.qty<5).length;
  document.getElementById('low-badge').textContent = c;
  document.getElementById('low-badge').style.display = c?'inline-block':'none';
}

// ── 採購裝備申請 ──
function renderPurchase() {
  const tbody = document.getElementById('purchase-tbody');
  if (!purchases.length) { tbody.innerHTML='<tr><td colspan="7" class="empty">尚無採購申請</td></tr>'; return; }
  tbody.innerHTML = [...purchases].reverse().map(p=>\`
    <tr>
      <td>\${p.item}</td>
      <td style="font-weight:600">\${p.qty}</td>
      <td>\${p.requester||'—'}</td>
      <td>\${p.editor||'—'}</td>
      <td>\${p.time}</td>
      <td style="text-align:center">
        <span class="tag \${p.status==='done'?'tag-in':'tag-out'}" style="cursor:pointer" onclick="togglePurchaseDone('\${p.id}')" title="點擊切換狀態">\${p.status==='done'?'✅ 已採購':'⏳ 待採購'}</span>
      </td>
      <td style="text-align:center">
        <div style="display:flex;gap:6px;justify-content:center">
          <button class="btn btn-sm" onclick="startEditPurchase('\${p.id}')">編輯</button>
          <button class="btn btn-sm btn-danger" onclick="deletePurchase('\${p.id}')">刪除</button>
        </div>
      </td>
    </tr>\`).join('');
}

function updatePurchaseBadge() {
  const c = purchases.filter(p=>p.status!=='done').length;
  const badge = document.getElementById('purchase-badge');
  badge.textContent = c;
  badge.style.display = c?'inline-block':'none';
}

function openPurchaseModal() {
  editingPurchaseId = null;
  document.getElementById('purchase-modal-title').textContent = '新增採購申請';
  document.getElementById('purchase-submit-btn').textContent = '新增';
  document.getElementById('purchase-item-list').innerHTML = inventory.map(i=>\`<option value="\${i.name}">\`).join('');
  document.getElementById('purchase-item').value = '';
  document.getElementById('purchase-qty').value = 1;
  document.getElementById('purchase-requester').value = '';
  document.getElementById('purchase-editor').value = '';
  document.getElementById('purchase-overlay').classList.add('open');
  document.getElementById('purchase-item').focus();
}
function startEditPurchase(id) {
  const p = purchases.find(x=>x.id===id); if (!p) return;
  editingPurchaseId = id;
  document.getElementById('purchase-modal-title').textContent = '編輯採購申請';
  document.getElementById('purchase-submit-btn').textContent = '儲存';
  document.getElementById('purchase-item-list').innerHTML = inventory.map(i=>\`<option value="\${i.name}">\`).join('');
  document.getElementById('purchase-item').value = p.item;
  document.getElementById('purchase-qty').value = p.qty;
  document.getElementById('purchase-requester').value = p.requester||'';
  document.getElementById('purchase-editor').value = p.editor||'';
  document.getElementById('purchase-overlay').classList.add('open');
  document.getElementById('purchase-item').focus();
}
function closePurchaseModal() { document.getElementById('purchase-overlay').classList.remove('open'); editingPurchaseId = null; }
function closePurchaseOutside(e) { if(e.target===document.getElementById('purchase-overlay')) closePurchaseModal(); }
function submitPurchase() {
  const item = document.getElementById('purchase-item').value.trim();
  const qty = parseInt(document.getElementById('purchase-qty').value, 10);
  const requester = document.getElementById('purchase-requester').value.trim();
  const editor = document.getElementById('purchase-editor').value.trim();
  if (!item) { showToast('請填寫品項'); return; }
  if (!qty || qty < 1) { showToast('請輸入有效數量'); return; }
  const now = new Date();
  const time = \`\${now.getFullYear()}/\${String(now.getMonth()+1).padStart(2,'0')}/\${String(now.getDate()).padStart(2,'0')} \${String(now.getHours()).padStart(2,'0')}:\${String(now.getMinutes()).padStart(2,'0')}\`;
  if (editingPurchaseId) {
    const p = purchases.find(x=>x.id===editingPurchaseId);
    if (p) { p.item=item; p.qty=qty; p.requester=requester; p.editor=editor; p.time=time; }
    showToast('採購申請已更新');
  } else {
    purchases.push({ id: uid(), item, qty, requester, editor, time, status: 'pending' });
    showToast('採購申請已新增');
  }
  save(); renderAll(); closePurchaseModal();
}
function togglePurchaseDone(id) {
  const p = purchases.find(x=>x.id===id); if (!p) return;
  p.status = p.status==='done' ? 'pending' : 'done';
  save(); renderAll();
}
function deletePurchase(id) {
  const p = purchases.find(x=>x.id===id); if (!p) return;
  if (!confirm(\`確定要刪除「\${p.item}」的採購申請嗎？\`)) return;
  purchases = purchases.filter(x=>x.id!==id);
  save(); renderAll();
  showToast('採購申請已刪除');
}

// ── 編輯品名/類別 ──
function startEdit(id, field) {
  document.getElementById(\`\${field}-display-\${id}\`).style.display='none';
  const inp = document.getElementById(\`\${field}-edit-\${id}\`);
  inp.style.display='inline-block';
  inp.focus(); inp.select();
}
function saveEdit(id, field) {
  const inp = document.getElementById(\`\${field}-edit-\${id}\`);
  const val = inp.value.trim();
  if (val) { inventory.find(i=>i.id===id)[field] = val; save(); renderAll(); }
  else { inp.style.display='none'; document.getElementById(\`\${field}-display-\${id}\`).style.display='inline'; }
}
function editKeydown(e, id, field) {
  if (e.key==='Enter') { e.target.blur(); }
  if (e.key==='Escape') { e.target.style.display='none'; document.getElementById(\`\${field}-display-\${id}\`).style.display='inline'; }
}

// ── 刪除 ──
function askDelete(id) {
  pendingDeleteId = id;
  const item = inventory.find(i=>i.id===id);
  document.getElementById('del-sub').textContent = \`確定要刪除「\${item.name}」嗎？此操作無法復原。\`;
  document.getElementById('del-overlay').classList.add('open');
}
function confirmDelete() {
  if (!pendingDeleteId) return;
  const item = inventory.find(i=>i.id===pendingDeleteId);
  inventory = inventory.filter(i=>i.id!==pendingDeleteId);
  pendingDeleteId = null;
  save(); renderAll(); closeDelModal();
  showToast(\`「\${item.name}」已刪除\`);
}
function closeDelModal() { document.getElementById('del-overlay').classList.remove('open'); pendingDeleteId=null; }
function closeDelOutside(e) { if(e.target===document.getElementById('del-overlay')) closeDelModal(); }

// ── 新增 ──
function openAddModal() { document.getElementById('add-overlay').classList.add('open'); document.getElementById('add-name').focus(); }
function closeAddModal() { document.getElementById('add-overlay').classList.remove('open'); }
function closeAddOutside(e) { if(e.target===document.getElementById('add-overlay')) closeAddModal(); }
function submitAdd() {
  const name = document.getElementById('add-name').value.trim();
  if (!name) { showToast('請填寫品項名稱'); return; }
  const cat = document.getElementById('add-cat').value.trim() || name;
  const group = document.getElementById('add-group').value;
  const qty = Math.max(0, parseInt(document.getElementById('add-qty').value)||0);
  inventory.push({id:uid(), cat, name, qty, group});
  save(); renderAll(); closeAddModal();
  document.getElementById('add-name').value='';
  document.getElementById('add-cat').value='';
  document.getElementById('add-qty').value='0';
  showToast(\`「\${name}」已新增，初始庫存 \${qty} 件\`);
}

// ── 進貨/領取 Modal ──
function openModal(type, itemId) {
  modalType = type; preselect = itemId||null; setType(type);
  const sel = document.getElementById('sel-item');
  sel.innerHTML = inventory.map(i=>\`<option value="\${i.id}">\${i.name}（剩 \${i.qty}）</option>\`).join('');
  if (preselect) sel.value = preselect;
  document.getElementById('inp-qty').value=1;
  document.getElementById('inp-person').value='';
  document.getElementById('inp-note').value='';
  document.getElementById('overlay').classList.add('open');
}
function setType(t) {
  modalType=t;
  document.getElementById('tab-in').className='action-tab'+(t==='in'?' active-in':'');
  document.getElementById('tab-out').className='action-tab'+(t==='out'?' active-out':'');
  document.getElementById('modal-submit').className='btn '+(t==='in'?'btn-success':'btn-danger');
  document.getElementById('modal-submit').textContent=t==='in'?'確認進貨':'確認領取';
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
function closeModalOutside(e) { if(e.target===document.getElementById('overlay')) closeModal(); }
function submitModal() {
  const id=document.getElementById('sel-item').value;
  const qty=parseInt(document.getElementById('inp-qty').value,10);
  const person=document.getElementById('inp-person').value.trim();
  const note=document.getElementById('inp-note').value.trim();
  if(!qty||qty<1){showToast('請輸入有效數量');return;}
  const item=inventory.find(i=>i.id===id); if(!item)return;
  if(modalType==='out'&&qty>item.qty){showToast(\`庫存不足！\${item.name} 目前僅剩 \${item.qty} 件\`);return;}
  const prev=item.qty;
  item.qty=modalType==='in'?item.qty+qty:item.qty-qty;
  const now=new Date();
  const time=\`\${now.getFullYear()}/\${String(now.getMonth()+1).padStart(2,'0')}/\${String(now.getDate()).padStart(2,'0')} \${String(now.getHours()).padStart(2,'0')}:\${String(now.getMinutes()).padStart(2,'0')}\`;
  logs.push({time,type:modalType,id,name:item.name,qty,person,note,prev,after:item.qty});
  save(); renderAll(); closeModal();
  showToast(\`\${item.name} \${modalType==='in'?'進貨':'領取'} \${qty} 件，剩餘 \${item.qty} 件\`);
}

// ── Navigation ──
function showPage(page, el) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  el.classList.add('active');
}

// ── Toast ──
function showToast(msg) {

  setTimeout(()=>t.classList.remove('show'),3000);
}

// ── 取得今日日期字串 ──
function today() {
  const n = new Date();
  return \`\${n.getFullYear()}\${String(n.getMonth()+1).padStart(2,'0')}\${String(n.getDate()).padStart(2,'0')}\`;
}

// ── 匯出：目前庫存清冊 ──
function exportInventory() {
  const statusText = q => q===0?'缺貨':q<=4?'偏低':'充足';
  const rows = [['類別','品項名稱','群組','目前庫存','狀態']];
  inventory.forEach(i => rows.push([i.cat, i.name, groupLabel(i.group), i.qty, statusText(i.qty)]));
  downloadXlsx(rows, '庫存清冊', \`PPE_庫存清冊_\${today()}.xlsx\`, {
    colWidths: [16, 18, 12, 10, 8],
    headerColor: '1D9E75'
  });
  showToast('庫存清冊已下載');
}

// ── 匯出：異動紀錄 ──
function exportLogs() {
  const typeText = t => t==='in'?'進貨':t==='out'?'領取':'盤點';
  const rows = [['時間','類型','品項名稱','異動數量','人員/事由','備註','異動前','異動後']];
  [...logs].reverse().forEach(l => rows.push([
    l.time, typeText(l.type), l.name,
    (l.type==='in'?'+':'-') + l.qty,
    l.person||'', l.note||'',
    l.prev??'', l.after??''
  ]));
  downloadXlsx(rows, '異動紀錄', \`PPE_異動紀錄_\${today()}.xlsx\`, {
    colWidths: [18, 8, 18, 10, 14, 16, 10, 10],
    headerColor: '378ADD'
  });
  showToast('異動紀錄已下載');
}

// ── 匯出：採購申請 ──
function exportPurchases() {
  const rows = [['品項','數量','需求人員','編輯人員','登記時間','狀態']];
  [...purchases].reverse().forEach(p => rows.push([
    p.item, p.qty, p.requester||'', p.editor||'', p.time, p.status==='done'?'已採購':'待採購'
  ]));
  downloadXlsx(rows, '採購申請', \`PPE_採購申請_\${today()}.xlsx\`, {
    colWidths: [18, 8, 14, 14, 18, 10],
    headerColor: '378ADD'
  });
  showToast('採購申請已下載');
}

// ── 匯出：空白盤點表 ──
function exportCountSheet() {
  const rows = [['類別','品項名稱','群組','系統庫存（件）','實際清點（件）','差異','備註']];
  inventory.forEach(i => rows.push([i.cat, i.name, groupLabel(i.group), i.qty, '', '', '']));
  downloadXlsx(rows, '盤點表', \`PPE_盤點表_\${today()}.xlsx\`, {
    colWidths: [16, 18, 12, 14, 14, 10, 16],
    headerColor: 'BA7517'
  });
  showToast('空白盤點表已下載');
}

// ── 核心：用 SheetJS 產生 xlsx ──
function downloadXlsx(rows, sheetName, filename, opts) {
  if (typeof XLSX === 'undefined') { showToast('Excel 套件載入中，請稍後再試…'); return; }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);

  // 欄寬
  if (opts.colWidths) ws['!cols'] = opts.colWidths.map(w=>({wch:w}));

  // 標題列樣式（需要 xlsx-style；SheetJS community 版用 !ref 做即可）
  // 凍結首列
  ws['!freeze'] = {xSplit:0, ySplit:1};

  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename);
}

thead tr{background:var(--surface2)}
th{padding:9px 10px;text-align:left;font-weight:600;color:var(--muted);white-space:nowrap;
  font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border)}
td{padding:7px 9px;border-bottom:1px solid rgba(0,0,0,.05);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(79,124,255,.03)}
th.cg{text-align:center}

/* INPUTS */
.ei{background:#fafbfd;border:1px solid var(--border);color:var(--text);
  padding:4px 7px;border-radius:6px;font-size:12px;width:100%;min-width:70px;max-width:155px;
  transition:border-color .15s;font-family:var(--font)}
.ei:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,124,255,.1)}
.ei.chg{border-color:var(--warn);background:rgba(245,158,11,.05)}
.ei.rec{border-color:var(--ok);background:rgba(16,185,129,.06)}
.ei.new-field{border-color:var(--accent);min-width:90px}

/* ADD-PERSON PANEL */
.add-panel{margin-bottom:20px;background:var(--surface);border:1px dashed var(--accent);border-radius:12px;overflow:hidden}
.add-panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
  background:rgba(79,124,255,.05);cursor:pointer;user-select:none}
.add-panel-hdr:hover{background:rgba(79,124,255,.1)}
.add-panel-title{font-size:14px;font-weight:700;color:var(--accent)}
.add-panel-body{padding:16px;display:none}
.add-panel.open .add-panel-body{display:block}
.add-panel.open .caret{transform:rotate(0deg)!important}
.add-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.add-field label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600}
.add-field input,.add-field select{background:var(--bg);border:1px solid var(--accent);color:var(--text);
  padding:6px 10px;border-radius:7px;font-size:13px;width:100%;font-family:var(--font)}
.add-field input:focus,.add-field select:focus{outline:none;border-color:var(--ok)}
.add-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* DELETE BTN */
.del-btn{padding:3px 7px;border-radius:5px;border:none;cursor:pointer;font-size:11px;
  background:rgba(232,92,74,.08);color:var(--accent2);border:1px solid rgba(232,92,74,.2);
  transition:all .15s;white-space:nowrap}
.del-btn:hover{background:rgba(232,92,74,.18)}

/* NEW ROW HIGHLIGHT */
.new-row td{background:rgba(79,124,255,.04)!important}

/* INVENTORY */
.inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.inv-grid{grid-template-columns:1fr}}
.inv-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.inv-card-hdr{background:var(--surface2);padding:11px 15px;font-size:14px;font-weight:700;
  display:flex;justify-content:space-between;align-items:center}
.inv-table{width:100%;border-collapse:collapse;font-size:13px}
.inv-table th{padding:8px 12px;background:var(--surface2);color:var(--muted);font-size:11px;
  text-transform:uppercase;border-bottom:1px solid var(--border)}
.inv-table td{padding:7px 12px;border-bottom:1px solid rgba(0,0,0,.05);text-align:center}
.inv-table tr:last-child td{border-bottom:none}
.inv-table td:first-child{text-align:left}
.inv-num{background:#fafbfd;border:1px solid var(--border);color:var(--text);
  padding:3px 7px;border-radius:5px;font-size:12px;width:65px;text-align:center}
.inv-num:focus{outline:none;border-color:var(--accent)}
.inv-size-input{background:transparent;border:1px solid transparent;color:var(--text);
  padding:3px 6px;border-radius:5px;font-size:12px;width:80px;font-weight:600;font-family:var(--font)}
.inv-size-input:hover{border-color:var(--border)}
.inv-size-input:focus{outline:none;border-color:var(--accent);background:#fafbfd}
.inv-add-row{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:rgba(79,124,255,.03)}
.inv-add-row label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.inv-add-row input{background:var(--surface);border:1px solid var(--accent);color:var(--text);
  padding:5px 9px;border-radius:6px;font-size:12px;font-family:var(--font)}
.inv-add-row input:focus{outline:none;border-color:var(--ok)}
.size-del{background:none;border:none;cursor:pointer;color:var(--accent2);font-size:12px;
  padding:2px 5px;opacity:.4;transition:opacity .15s}
.size-del:hover{opacity:1}
.size-tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);
  padding:2px 7px;border-radius:4px;font-size:11px;white-space:nowrap}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-bottom:20px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.scard h3{font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600;text-transform:uppercase}
.srow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.srow:last-child{border-bottom:none}
.sv{font-size:14px;font-weight:700;color:var(--accent)}
.sv.g{color:var(--ok)} .sv.r{color:var(--accent2)}
.sum-row td{background:rgba(79,124,255,.06);font-weight:700;color:var(--accent)}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:#fff;border:1px solid var(--ok);
  color:var(--ok);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;
  opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.toast.show{opacity:1;transform:translateY(0)}

/* MODAL OVERLAY for add-person on mobile / large */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;
  max-width:700px;width:100%;margin:16px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal h2{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--accent)}
.modal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.mfield label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600}
.mfield input,.mfield select{background:#fafbfd;border:1px solid var(--border);color:var(--text);
  padding:7px 10px;border-radius:7px;font-size:13px;width:100%;font-family:var(--font)}
.mfield input:focus,.mfield select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,124,255,.1)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
</style>
</head>

</div>

<\!-- ADD PERSON MODAL -->
<div class="modal-overlay" id="modal-overlay">

      <div class="mfield"><label>褲子尺寸EU</label><input id="m-peu" placeholder="e.g. 50"/></div>
      <div class="mfield"><label>褲子尺寸UK</label><input id="m-puk" placeholder="e.g. 34-36 (M)"/></div>
      <div class="mfield"><label>褲子實際領用</label><input id="m-prec" placeholder="e.g. M*1"/></div>
      <div class="mfield"><label>冬季外套尺寸</label><input id="m-wj" placeholder="e.g. 40-42 (M)"/></div>
      <div class="mfield"><label>冬季外套實際領用</label><input id="m-wrec" placeholder="e.g. M*1"/></div>

      <button class="btn btn-s" onclick="closeModal()">取消</button>
      <button class="btn btn-p" onclick="confirmAddEmployee()">✓ 確認新增</button>
    </div>
  </div>
</div>

<div class="main">
  <\!-- 台中 -->
  <div id="page-taichung" class="page active">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">

  <\!-- 台北 -->

  <\!-- 庫存 -->

  </div>
</div>

// ===== LOCALSTORAGE PERSISTENCE =====
const LS_EMP = 'coverall_employees_v1';
const LS_INV = 'coverall_inventory_v1';

function loadFromStorage() {
  try {
    const empData = localStorage.getItem(LS_EMP);
    const invData = localStorage.getItem(LS_INV);
    if (empData) employees = JSON.parse(empData);
    if (invData) inventory = JSON.parse(invData);
  } catch(e) {
    console.warn('localStorage 讀取失敗，使用預設資料', e);
  }
}

function persistToStorage() {
  try {
    localStorage.setItem(LS_EMP, JSON.stringify(employees));
    localStorage.setItem(LS_INV, JSON.stringify(inventory));
  } catch(e) {
    console.warn('localStorage 寫入失敗', e);
  }
}

function resetToDefault() {
  if (!confirm('確定要清除所有儲存的資料，回復到原始預設值嗎？\\n（此動作無法復原）')) return;
  localStorage.removeItem(LS_EMP);
  localStorage.removeItem(LS_INV);
  location.reload();
}
