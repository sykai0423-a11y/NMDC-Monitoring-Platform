<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTV監控平台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg-void: #F5F7FA;
  --bg-panel: #FFFFFF;
  --bg-panel-2: #F0F2F7;
  --line: #DDE1EC;
  --accent: #4F7CFF;
  --red: #FF5A5F;
  --amber: #FFB020;
  --green: #10B981;
  --text: #1E2235;
  --text-dim: #7A82A0;
}
* { box-sizing: border-box; }
body {
  margin: 0; display: flex; min-height: 100vh;
  background: var(--bg-void); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
}
.mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: .02em; }
.text-dim { color: var(--text-dim); }
.warn-text { color: var(--red); }

.sidebar { width: 220px; flex-shrink: 0; background: var(--bg-panel); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 24px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.brand-title { font-weight: 700; font-size: 15px; }
.brand-sub { font-size: 10px; color: var(--text-dim); }
.nav-list { display: flex; flex-direction: column; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; background: transparent; border: 1px solid transparent; color: var(--text-dim); padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; text-align: left; width: 100%; text-decoration: none; box-sizing: border-box; }
.nav-item:hover { background: var(--bg-panel-2); color: var(--text); }
.nav-item.active { background: rgba(79,124,255,.08); color: var(--accent); border-color: rgba(79,124,255,.35); }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid var(--line); background: var(--bg-panel); }
.topbar-title { font-size: 13px; color: var(--text-dim); }
.clock { display: flex; gap: 10px; font-size: 13px; color: var(--text-dim); }
.clock-time { color: var(--accent); }
.excel-actions { display: flex; gap: 8px; }

.content { flex: 1; overflow-y: auto; padding: 28px; }
.page-title { font-size: 20px; font-weight: 700; margin: 0 0 20px; }
.section-title { font-size: 15px; font-weight: 600; margin: 0; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 12px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } .sidebar { width: 72px; } .brand-title, .brand-sub, .nav-item span { display: none; } }

.viewfinder { position: relative; }
.corner { position: absolute; width: 12px; height: 12px; border: 2px solid var(--accent); opacity: .55; }
.corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
.corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
.corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

.card { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 4px; padding: 18px; }
.card-head { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 12px; }
.card-head span:first-of-type { flex: 1; }

.pill { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-family: monospace; }
.pill-green { background: rgba(51,209,122,.12); color: var(--green); border: 1px solid rgba(51,209,122,.4); }
.pill-red { background: rgba(255,90,95,.12); color: var(--red); border: 1px solid rgba(255,90,95,.4); }
.pill-amber { background: rgba(255,176,32,.14); color: #B4790A; border: 1px solid rgba(255,176,32,.5); }
.pill-gray { background: rgba(140,140,150,.14); color: #6b6b76; border: 1px solid rgba(140,140,150,.4); }

/* 路由器更換表：統計卡片＋進度條 */
.stat-num { font-size: 26px; font-weight: 700; line-height: 1.1; }
.stat-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.progress-card { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; margin-bottom: 24px; }
.progress-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font-size: 13px; }
.progress-track { height: 8px; border-radius: 999px; background: var(--bg-panel-2); overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-radius: 999px; }
.site-tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--bg-panel-2); color: var(--text-dim); }

.light-row { display: flex; gap: 18px; font-size: 13px; flex-wrap: wrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-light { display: inline-flex; align-items: center; font-size: 13px; cursor: pointer; background: none; border: none; color: var(--text); padding: 0; }

/* 首頁 台中端/通霄端 卡片：點已完成/待辦/未完成 展開清單 */
.dash-expand-panel { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.dash-expand-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.dash-expand-close { background: none; border: none; color: var(--text-dim); font-size: 16px; line-height: 1; cursor: pointer; padding: 0 2px; }
.dash-expand-close:hover { color: var(--text); }

.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; padding: 8px 14px; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--bg-panel-2); color: var(--text); }
.btn.primary { background: var(--accent); color: #06201C; border-color: var(--accent); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.danger { background: rgba(255,90,95,.1); color: var(--red); border-color: rgba(255,90,95,.35); }
.btn.full { width: 100%; justify-content: center; margin-top: 10px; }
.btn.small { padding: 5px 10px; font-size: 12px; }
.icon-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px 6px; border-radius: 4px; font-size: 13px; }
.icon-btn:hover { color: var(--text); background: var(--bg-panel-2); }
.icon-btn.danger:hover { color: var(--red); }

.filter-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
.input { background: var(--bg-void); border: 1px solid var(--line); color: var(--text); border-radius: 4px; padding: 8px 10px; font-size: 13px; width: 100%; }
textarea.input { min-height: 70px; resize: vertical; font-family: inherit; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; padding: 10px 12px; background: var(--bg-panel-2); color: var(--text-dim); font-weight: 500; border-bottom: 1px solid var(--line); white-space: nowrap; }
.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.data-table tr:last-child td { border-bottom: none; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tab { background: none; border: none; color: var(--text-dim); padding: 10px 16px; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal-panel { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px; width: 440px; max-width: 92vw; max-height: 86vh; overflow-y: auto; }
.modal-panel.wide { width: 640px; }
.modal-panel.confirm { width: 380px; }
.maint-entry { background: var(--bg-panel-2); border-radius: 4px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
.maint-list { display: flex; flex-direction: column; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
.photo-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid var(--line); }
.lightbox-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox-backdrop img { max-width: 92vw; max-height: 92vh; border-radius: 4px; box-shadow: 0 0 40px rgba(0,0,0,.6); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 13px; }
.modal-body { padding: 18px; }

.form-grid { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 11px; color: var(--text-dim); }
.row-end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

.plan-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.plan-row { display: flex; align-items: center; gap: 10px; background: var(--bg-panel-2); border-radius: 4px; padding: 8px 10px; }
.plan-row.compact { padding: 6px 10px; gap: 8px; }
.plan-text { flex: 1; font-size: 13px; }
.compact-card { padding: 14px 18px; }
.row-form { display: flex; gap: 8px; align-items: center; background: var(--bg-panel-2); padding: 10px; border-radius: 4px; }
.row-form .input { width: auto; flex: 1; }
@media (max-width: 700px) { .row-form { flex-wrap: wrap; } }
/* 工作日誌頁「明日預計工作」的標題+輸入列：往下捲動清單時固定在畫面上方，方便邊看下方項目邊輸入新項目 */
.tomorrow-sticky-head { position: sticky; top: 0; z-index: 5; background: var(--bg-panel); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
/* 明日預計工作：台中端／通霄端 左右兩欄表格，日期、工作內容、完成狀態（打勾/打叉）各自一欄，
   仿照使用者原本 Excel 的呈現方式；每欄各自固定高度、內部捲動，上方輸入列不會被推走 */
.tmrw-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 900px) { .tmrw-wrap { grid-template-columns: 1fr; } }
.tmrw-col { max-height: 48vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; }
.tmrw-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tmrw-table th.tmrw-table-head { position: sticky; top: 0; z-index: 2; background: #FFE066; color: #4A3B00; font-weight: 700; text-align: center; padding: 8px; font-size: 13px; border-bottom: 1px solid var(--line); }
.tmrw-table td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 6px 8px; vertical-align: middle; }
.tmrw-table td:last-child { border-right: none; }
.tmrw-table tr:last-child td { border-bottom: none; }
.tmrw-date { width: 58px; white-space: nowrap; font-family: monospace; font-size: 11.5px; color: var(--text-dim); }
.tmrw-task { word-break: break-word; width: auto; }
.tmrw-status { width: 82px; text-align: center; padding: 6px 4px; }
.tmrw-status-inner { display: flex; align-items: center; justify-content: center; gap: 4px; }
.tmrw-mark { cursor: pointer; font-weight: 700; font-size: 14px; user-select: none; line-height: 1; }
.tmrw-mark-done { color: var(--green); }
.tmrw-mark-bad { color: var(--red); }
.tmrw-mark-pending { color: var(--text-dim); }
.tmrw-del-btn { opacity: .45; padding: 2px 4px; font-size: 11px; line-height: 1; }
.tmrw-del-btn:hover { opacity: 1; }
.inline-add { display: flex; flex-direction: column; gap: 8px; background: var(--bg-panel-2); padding: 12px; border-radius: 4px; margin-top: 8px; }

.cal-head { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 14px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; position: relative; }
.cal-cell.day { background: var(--bg-panel-2); border: 1px solid transparent; border-radius: 4px; cursor: pointer; color: var(--text); }
.cal-cell.day:hover { border-color: var(--line); }
.cal-cell.day.today { border-color: var(--accent); }
.cal-cell.day.selected { background: rgba(79,124,255,.15); }
.cal-cell.day.has-file { color: var(--accent); }
.cal-cell.empty { visibility: hidden; }
.cal-cell.cal-label { color: var(--text-dim); font-size: 11px; }
.file-dot { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

.monitor-layout { display: flex; gap: 16px; align-items: flex-start; }
.monitor-list { width: 320px; flex-shrink: 0; max-height: 65vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 4px; padding: 8px; background: var(--bg-panel); }
.monitor-row { display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 4px; cursor: pointer; background: var(--bg-panel-2); border: 1px solid transparent; }
.monitor-row:hover { border-color: var(--line); }
.monitor-row.selected { border-color: var(--accent); background: rgba(79,124,255,.12); }
.monitor-row.today .monitor-row-date span:first-child { color: var(--accent); }
.monitor-row-check { display: flex; align-items: center; flex-shrink: 0; cursor: pointer; }
.monitor-row-check input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
.monitor-row-check input[disabled] { cursor: not-allowed; opacity: .35; }
.monitor-row-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.monitor-row-date { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.monitor-row-status { display: flex; align-items: center; gap: 8px; }
.monitor-download-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.monitor-detail { flex: 1; min-width: 260px; }
@media (max-width: 900px) { .monitor-layout { flex-direction: column; } .monitor-list { width: 100%; } }

.duty-list { display: flex; flex-direction: column; gap: 8px; }
.duty-row { display: flex; align-items: flex-start; gap: 14px; padding: 12px 14px; border-radius: 4px; background: var(--bg-panel-2); border: 1px solid transparent; }
.duty-row.today { border-color: var(--accent); background: rgba(79,124,255,.08); }
.duty-row.weekend { border-left: 3px solid var(--amber); }
.duty-date { flex-shrink: 0; width: 120px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; padding-top: 4px; }
@media (max-width: 700px) { .duty-row { flex-wrap: wrap; } .duty-date { width: 100%; flex-direction: row; gap: 8px; } }

.week-widget { display: flex; flex-direction: column; gap: 6px; }
.week-widget-row { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.week-widget-row.today { background: rgba(79,124,255,.1); }
.week-widget-day { width: 78px; flex-shrink: 0; color: var(--text-dim); }
.reminder-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.reminder-item { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.reminder-item:last-child { border-bottom: none; }
.mini-bar-wrap { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.mini-bar-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.mini-bar-label { width: 110px; flex-shrink: 0; color: var(--text-dim); }
.mini-bar-track { flex: 1; height: 8px; border-radius: 4px; background: var(--bg-void); overflow: hidden; }
.mini-bar-fill { height: 100%; border-radius: 4px; }
.mini-bar-val { width: 48px; text-align: right; flex-shrink: 0; font-family: monospace; font-size: 11px; color: var(--text-dim); }
.monitor-summary-title { display: flex; align-items: center; gap: 8px; font-weight: 600; margin: 28px 0 12px; }
.monitor-summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.monitor-summary-card { border: 1px solid var(--line); border-radius: 4px; padding: 12px; background: var(--bg-panel); display: flex; flex-direction: column; gap: 8px; }
.monitor-summary-card.uploaded { border-color: rgba(51,209,122,.3); }
.monitor-summary-card.missing { border-color: rgba(255,90,95,.25); }
.ms-card-top { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.ms-card-status { display: flex; align-items: center; font-size: 12px; }
.ms-card-filename { min-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-card-actions { display: flex; gap: 6px; margin-top: 2px; }
.ms-card-actions .btn { padding: 6px 8px; font-size: 12px; justify-content: center; }
.ms-card-files { display: flex; flex-direction: column; gap: 6px; }
.ms-file-row { display: flex; align-items: flex-start; gap: 4px; font-size: 12px; background: var(--bg-panel-2); border-radius: 4px; padding: 6px 6px 6px 8px; }
.ms-file-name { flex: 1; overflow-wrap: anywhere; white-space: normal; line-height: 1.4; min-width: 0; padding-top: 2px; }
.ms-file-row .icon-btn { flex-shrink: 0; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.link { color: var(--accent); text-decoration: underline; font-size: 13px; cursor: pointer; }
.cat-block { margin-top: 8px; }
.empty-hint { color: var(--text-dim); }
.links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.link-card { position: relative; border: 1px solid var(--line); border-radius: 4px; background: var(--bg-panel); display: flex; flex-direction: column; }
.link-card-name { font-weight: 600; font-size: 13px; text-align: center; padding: 10px 34px 10px 10px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.link-card-url-wrap { padding: 10px; text-align: center; }
.link-card-url { color: var(--accent); text-decoration: underline; font-size: 12.5px; overflow-wrap: anywhere; }
.link-card-actions { position: absolute; top: 4px; right: 4px; display: flex; gap: 2px; }
.ppe-frame { width: 100%; height: calc(100vh - 170px); border: 1px solid var(--line); border-radius: 6px; background: #fff; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">
    <span class="rec-dot"></span>
    <div>
      <div class="brand-title">CCTV監控平台</div>
      <div class="brand-sub mono">SITE SURVEILLANCE OPS</div>
    </div>
  </div>
  <div class="nav-list" id="navList"></div>
</div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title mono" id="topbarTitle"></div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="excel-actions">
        <button class="btn small ghost" onclick="exportExcel()">匯出Excel</button>
        <button class="btn small ghost" onclick="document.getElementById('importFile').click()">匯入Excel</button>
        <input type="file" id="importFile" accept=".xlsx" style="display:none" onchange="importExcel(event)">
      </div>
      <div class="clock mono" id="clockBox"></div>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
/* ============================= Google Apps Script 雲端同步 ============================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbxReHCmCeF1kPhYlxFSOzZv2dgnHAkvsh6i9LD91lSFM_gx8RJzb8Hl84_CfGU6qe_S/exec';
const BOOK = 'cctv';

function getCurrentUser() {
  let u = localStorage.getItem('cctv-current-user');
  if (!u) {
    u = (prompt('請輸入您的姓名（用於紀錄建立/修改人員，僅需輸入一次，之後可在瀏覽器清除資料後重新輸入）：', '') || '').trim() || '未知人員';
    localStorage.setItem('cctv-current-user', u);
  }
  return u;
}

async function apiList(sheet) {
  const url = `${API_URL}?action=list&book=${BOOK}&sheet=${encodeURIComponent(sheet)}`;
  const res = await fetch(url);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '讀取失敗');
  return json.data;
}
async function apiUpsert(sheet, record) {
  showBusyToast('儲存中...');
  try {
    const payload = { action: 'upsert', book: BOOK, sheet, record, user: getCurrentUser() };
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '寫入失敗');
    return json.data;
  } finally {
    hideBusyToast();
  }
}
async function apiDelete(sheet, idValue) {
  showBusyToast('刪除中...');
  try {
    const payload = { action: 'delete', book: BOOK, sheet, id: idValue };
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '刪除失敗');
  } finally {
    hideBusyToast();
  }
}
// 批次刪除（一次網路請求刪多筆），需要 Apps Script 有加 deleteMany action；
// 若後端尚未更新（回傳 unknown action），呼叫端會收到例外，可自行 fallback 成逐筆 apiDelete。
async function apiDeleteMany(sheet, ids) {
  showBusyToast('刪除中...');
  try {
    const payload = { action: 'deleteMany', book: BOOK, sheet, ids };
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '批次刪除失敗');
  } finally {
    hideBusyToast();
  }
}
async function apiUploadFile(file, subfolder, oldFileUrl) {
  showUploadToast();
  try {
    const dataUrl = await fileToBase64(file);
    const payload = { action: 'uploadFile', book: BOOK, filename: file.name, base64Data: dataUrl, mimeType: file.type, subfolder: subfolder || '', oldFileUrl: oldFileUrl || '' };
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '檔案上傳失敗');
    return json.url;
  } finally {
    hideUploadToast();
  }
}

/* ============================= 處理中提示模塊 ============================= */
// 任何跟 Google 試算表/雲端硬碟溝通的動作（存檔、刪除、上傳檔案…）都會顯示這個
// 浮動提示，讓使用者知道「系統正在處理」而不是網頁當掉了。用計數器處理同時有
// 多個請求在跑的情況：全部結束才會真的把提示收起來。
let __busyCount = 0;
function showBusyToast(msg) {
  __busyCount++;
  let el = document.getElementById('uploadToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'uploadToast';
    el.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--bg-panel-2,#F0F2F7);color:var(--text,#1E2235);border:1px solid var(--accent,#4F7CFF);border-radius:10px;padding:12px 20px;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.15);';
    el.innerHTML = '<span style="width:14px;height:14px;border:2px solid var(--accent,#4F7CFF);border-top-color:transparent;border-radius:50%;display:inline-block;animation:uploadSpin .7s linear infinite;flex-shrink:0;"></span><span class="busy-toast-msg">處理中...</span>';
    document.body.appendChild(el);
    if (!document.getElementById('uploadToastStyle')) {
      const style = document.createElement('style');
      style.id = 'uploadToastStyle';
      style.textContent = '@keyframes uploadSpin{to{transform:rotate(360deg);}}';
      document.head.appendChild(style);
    }
  }
  el.querySelector('.busy-toast-msg').textContent = msg || '處理中...';
  el.style.display = 'flex';
}
function hideBusyToast() {
  __busyCount = Math.max(0, __busyCount - 1);
  if (__busyCount > 0) return; // 還有其他請求在跑，先別收起提示
  const el = document.getElementById('uploadToast');
  if (el) el.style.display = 'none';
}

// 監看紀錄表月彙總：每個月可以有「多筆檔案」，不再是一個月只能一筆。
// 主鍵仍然是「月份」這個欄位（沿用現有 Apps Script 設定，不需要再去後端改 ID_COLUMNS），
// 但實際寫入的值變成「YYYY-MM__隨機碼」這種格式，確保每一筆上傳都有自己獨立的主鍵、
// 彼此不會互相覆蓋；讀取時再把前面的 YYYY-MM 取出來，用來判斷這筆檔案屬於哪個月份。
// 舊資料（主鍵就是單純的 "YYYY-MM"，沒有 "__隨機碼"）一樣可以正常被讀到、歸到對應月份。
async function apiListMonitorMonthly() {
  const rows = await apiList('監看紀錄表月彙總');
  const obj = {};
  rows.forEach(r => {
    const key = r['月份'];
    if (!key) return;
    const month = String(key).split('__')[0];
    if (!obj[month]) obj[month] = [];
    obj[month].push({ key: String(key), filename: r['檔名'], fileUrl: r['雲端硬碟檔案連結'], uploader: r['上傳人'], uploadTime: r['上傳時間'] });
  });
  // 同一個月內，新上傳的檔案排在前面
  Object.values(obj).forEach(arr => arr.sort((a, b) => String(b.uploadTime||'').localeCompare(String(a.uploadTime||''))));
  return obj;
}
async function apiSaveMonitorMonthly(month, filename, fileUrl) {
  const key = month + '__' + uid();
  await apiUpsert('監看紀錄表月彙總', { '月份': key, '檔名': filename, '雲端硬碟檔案連結': fileUrl, '上傳人': getCurrentUser(), '上傳時間': new Date().toISOString() });
  return key;
}

    DB.router = routerRows.map(SHEET_MAP.router.fromRow);
    DB.links = linkRows.map(SHEET_MAP.links.fromRow).sort((a,b) => String(a.createdAt).localeCompare(String(b.createdAt)));
  } catch (err) {
    contentEl.innerHTML = `<div class="page"><p class="warn-text">雲端資料讀取失敗：${esc(String(err))}</p><button class="btn primary" onclick="loadAllData()">重試</button></div>`;
    return;
  }
  render();
}

async function reloadOne(type) {
  if (type === 'monitorFiles') { DB.monitorFiles = await apiListMonitor(); return; }
  if (type === 'monitorMonthly') { DB.monitorMonthly = await apiListMonitorMonthly(); return; }
  if (type === 'links') {
    const rows = await apiList('附屬網址');
    DB.links = rows.map(SHEET_MAP.links.fromRow).sort((a,b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    return;
  }
  const map = SHEET_MAP[type];
  const rows = await apiList(map.sheet);
  DB[type] = rows.map(map.fromRow);
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function fileToBase64(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function esc(s) { return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function openFile(url) { if (url) window.open(url, '_blank'); }
function cleanDate(v) {
  if (!v) return v;
  const s = String(v);
  // 把可能殘留的完整時間戳記（例如 2026-04-27T16:00:00.000Z）裁成純日期
  return (s.length >= 10 && s[4] === '-' && s[7] === '-') ? s.slice(0, 10) : s;
}
function toPreviewUrl(url) {
  if (!url) return '';
  const m = url.match(/\/document\/d\/([^\/]+)/);
  if (m) return `https://docs.google.com/document/d/${m[1]}/preview`;
  return '';
}
// 把 Google Drive 的「檢視連結」轉成「直接下載連結」，
// 點擊後才會真的觸發瀏覽器下載檔案到電腦，而不是進到雲端硬碟／文件線上檢視頁。
function toDriveDownloadUrl(url) {
  if (!url) return '';
  // 上傳的 .doc/.docx 如果被 Google 自動轉成 Google 文件格式，連結會是
  // .../document/d/ID/edit 這種形式，要用 export 端點強制輸出成 .docx 才會觸發下載，
  // 不然點下去只會打開線上編輯畫面（就是使用者截圖看到的狀況）。
  const docMatch = url.match(/\/document\/d\/([^\/]+)/);
  if (docMatch) return `https://docs.google.com/document/d/${docMatch[1]}/export?format=docx`;
  const m = url.match(/\/file\/d\/([^\/]+)/) || url.match(/[?&]id=([^&]+)/);
  if (m) return `https://drive.google.com/uc?export=download&id=${m[1]}`;
  return url;
}

  const url = \`\${WT_API_URL}?action=list&book=\${WT_BOOK}&sheet=\${encodeURIComponent(WT_SHEET)}\`;

  return row ? row['資料內容'] : null;

async function wtApiSave(jsonString){
  const payload = { action: 'upsert', book: WT_BOOK, sheet: WT_SHEET, record: { '設定ID': WT_RECORD_ID, '資料內容': jsonString } };
  const res = await fetch(WT_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || '儲存失敗');
}

function ensureRowLength(id){
  const row = state.checks[id] || [];
  while(row.length < state.columns.length) row.push(false);
  state.checks[id] = row.slice(0, state.columns.length);
}

function totalItems(){
  return SECTION_META.reduce((n,s)=>n+(state.items[s.id]||[]).length,0);

async function loadState(){
  try{
    const res = await wtApiLoad();
    if(res){
      const parsed = JSON.parse(res);
      if(parsed.columns && parsed.columns.length) state.columns = parsed.columns;
      if(parsed.checks) state.checks = parsed.checks;
      if(parsed.items) state.items = parsed.items;
      if(parsed.notes) state.notes = parsed.notes;
    }
  }catch(e){
    // no saved state yet, use defaults
  }
  // fill in default items for any section not yet in saved state
  SECTION_META.forEach(sec=>{
    if(!state.items[sec.id]){
      state.items[sec.id] = DEFAULT_ITEMS[sec.id].map(([zh,en],i)=>({id:\`\${sec.id}-\${i}\`, zh, en}));

  });
  SECTION_META.forEach(sec=>{
    state.items[sec.id].forEach(it=>ensureRowLength(it.id));
  });

              \${openAddForm===sec.id ? \`
                <div class="new-item-form">
                  <input class="zh" placeholder="項目名稱（中文）" id="new-zh-\${sec.id}" />
                  <input class="en" placeholder="Item name (English，可留空)" id="new-en-\${sec.id}" />
                  <button class="btn" data-sec="\${sec.id}" data-action="confirm-add">新增</button>
                  <button class="btn ghost" data-action="cancel-add">取消</button>
                </div>
              \` : \`
                <button class="add-row-btn" data-sec="\${sec.id}" data-action="open-add">新增項目</button>
              \`}
            </td>
          </tr>
        </tbody>
      </table>
    \`;
    root.appendChild(section);
  });

  // wire events
  root.querySelectorAll(".checkbox").forEach(box=>{
    box.addEventListener("click", ()=>{
      const id = box.dataset.id;
      const ci = parseInt(box.dataset.ci,10);
      ensureRowLength(id);
      state.checks[id][ci] = !state.checks[id][ci];
      box.classList.toggle("checked");
      updateSectionProgress(box.closest(".section"));
      scheduleSave();
    });
  });

  root.querySelectorAll(".colname").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const ci = parseInt(inp.dataset.ci,10);
      state.columns[ci] = inp.value;
      scheduleSave();
    });
  });

  root.querySelectorAll(".note-input").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const id = inp.dataset.id;
      state.notes[id] = inp.value;
      scheduleSave();
    });
  });

  root.querySelectorAll(".rm-col").forEach(x=>{
    x.addEventListener("click", ()=>{
      const ci = parseInt(x.dataset.ci,10);
      state.columns.splice(ci,1);
      Object.keys(state.checks).forEach(id=>{
        state.checks[id].splice(ci,1);
      });
      render();
      scheduleSave();
    });
  });

  root.querySelectorAll(".add-col-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.columns.push("");
      SECTION_META.forEach(sec=>state.items[sec.id].forEach(it=>ensureRowLength(it.id)));
      render();
      scheduleSave();
    });
  });

  root.querySelectorAll(".rm-row").forEach(x=>{
    x.addEventListener("click", ()=>{
      const secId = x.dataset.sec;
      const id = x.dataset.id;
      if(!confirm("確定要刪除這個項目嗎？")) return;
      state.items[secId] = state.items[secId].filter(it=>it.id!==id);
      delete state.checks[id];
      delete state.notes[id];
      render();
      scheduleSave();
    });
  });

  root.querySelectorAll('[data-action="open-add"]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      openAddForm = btn.dataset.sec;
      render();
      const inp = document.getElementById(\`new-zh-\${openAddForm}\`);
      if(inp) inp.focus();
    });
  });

  root.querySelectorAll('[data-action="cancel-add"]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      openAddForm = null;
      render();
    });
  });

  root.querySelectorAll('[data-action="confirm-add"]').forEach(btn=>{
    btn.addEventListener("click", ()=>submitNewItem(btn.dataset.sec));
  });

  root.querySelectorAll('.new-item-form input').forEach(inp=>{
    inp.addEventListener("keydown", (e)=>{
      if(e.key==="Enter"){
        const secId = inp.id.split("-").pop();
        submitNewItem(secId);
      }
    });
  });
}

function submitNewItem(secId){
  const zhInp = document.getElementById(\`new-zh-\${secId}\`);
  const enInp = document.getElementById(\`new-en-\${secId}\`);
  const zh = (zhInp && zhInp.value.trim()) || "";
  const en = (enInp && enInp.value.trim()) || "";
  if(!zh){
    if(zhInp) zhInp.focus();
    return;
  }
  const id = \`\${secId}-custom-\${Date.now()}\`;
  state.items[secId].push({id, zh, en});
  ensureRowLength(id);
  openAddForm = null;
  render();
  scheduleSave();
}

function escapeHtml(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function updateSectionProgress(sectionEl){
  if(!sectionEl) return;
  const secId = sectionEl.dataset.secId;
  const items = state.items[secId] || [];
  const done = items.reduce((n,it)=>{
    const row = state.checks[it.id] || [];
    return n + (row.some(Boolean) ? 1 : 0);
  },0);
  const pct = items.length ? Math.round(done/items.length*100) : 0;
  const pill = sectionEl.querySelector(".progress-pill span");
  const fill = sectionEl.querySelector(".progress-fill");
  if(pill) pill.textContent = \`\${done}/\${items.length||0} 已標記\`;
  if(fill) fill.style.width = pct + "%";
}

function escapeAttr(s){
  return String(s).replace(/"/g,"&quot;");
}

document.getElementById("reset-btn").addEventListener("click", ()=>{
  if(!confirm("確定要清空所有勾選狀態嗎？")) return;
  Object.keys(state.checks).forEach(id=>{
    state.checks[id] = state.checks[id].map(()=>false);
  });
  render();
  scheduleSave();
});

/* ============================= Dashboard ============================= */
// 「明日預計工作」排序用：工作項目文字常常自己打了日期（例如「8/31 …」「9/4(三) …」），
// 有的話優先用它排序；沒有的話退回新增當下記錄的日期。首頁卡片展開清單、工作日誌頁面共用同一套排序邏輯。
function tomorrowSortKey(it) {
  const m = (it.task || '').match(/^(\d{1,2})\/(\d{1,2})/);
  if (m) {
    const year = (it.date || todayStr()).slice(0, 4);
    return `${year}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  }
  return it.date || '9999-99-99';
}

// 首頁 台中端/通霄端 卡片：點「已完成/待辦/未完成」展開對應清單（可同時展開多個），點右上角 × 收合
function toggleDashExpand(key) {
  state.dashboardExpanded[key] = !state.dashboardExpanded[key];
  render();
}

function renderDashboard() {
  const patrol = DB.patrol;
  const tomorrow = DB.tomorrow;
  const poeChecks = DB.poeChecks;
  const monitorFiles = DB.monitorFiles;
  const reservations = DB.poeReservation;
  const today = todayStr();

  const DASH_STATUS_LABEL = { done: '已完成', pending: '待辦', incomplete: '未完成' };
  const DASH_STATUS_COLOR = { done: 'var(--green)', pending: 'var(--amber)', incomplete: 'var(--red)' };
  function siteCard(site) {
    const done = patrol.some(p => p.date === today && p.site === site);
    const plans = tomorrow.filter(t => t.site === site);
    const counts = { done:0, pending:0, incomplete:0 };
    plans.forEach(p => counts[p.status] = (counts[p.status]||0)+1);
    const panels = ['done','pending','incomplete'].map(k => {
      const expandKey = site + '__' + k;
      if (!state.dashboardExpanded[expandKey]) return '';
      const items = plans.filter(p => p.status === k).slice().sort((a, b) => tomorrowSortKey(a).localeCompare(tomorrowSortKey(b)));
      const body = items.length
        ? `<div class="reminder-list">${items.map(p => `<div class="reminder-item"><span>${esc(p.task||'（未填寫工作項目）')}</span><span class="text-dim">${esc(p.assignee||'')}</span></div>`).join('')}</div>`
        : `<p class="text-dim" style="margin:0;">目前沒有項目</p>`;
      return `<div class="dash-expand-panel">
        <div class="dash-expand-head"><span style="color:${DASH_STATUS_COLOR[k]};">${DASH_STATUS_LABEL[k]}（${counts[k]||0}）</span><button class="dash-expand-close" onclick="toggleDashExpand('${expandKey}')" title="收合">×</button></div>
        ${body}
      </div>`;
    }).join('');
    return `<div class="viewfinder card">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="card-head"><span>${site}</span><span class="pill ${done?'pill-green':'pill-red'}">${done?'今日已巡檢':'今日尚未巡檢'}</span></div>
      <div class="light-row">
        <button class="status-light" onclick="toggleDashExpand('${site}__done')"><span class="dot" style="background:var(--green)"></span>${counts.done||0} 已完成</button>
        <button class="status-light" onclick="toggleDashExpand('${site}__pending')"><span class="dot" style="background:var(--amber)"></span>${counts.pending||0} 待辦</button>
        <button class="status-light" onclick="toggleDashExpand('${site}__incomplete')"><span class="dot" style="background:var(--red)"></span>${counts.incomplete||0} 未完成</button>
      </div>
      ${panels}
    </div>`;
  }

  const missing = [];
  for (let i=1;i<=7;i++) { const d = new Date(); d.setDate(d.getDate()-i); const ds = d.toISOString().slice(0,10); if (!monitorFiles[ds]) missing.push(ds); }
  const pendingImprove = poeChecks.filter(p => p.improveStatus && p.improveStatus !== '已完成').length;
  const resCounts = { done:0, pending:0, incomplete:0 };
  reservations.forEach(r => resCounts[r.status] = (resCounts[r.status]||0)+1);

  // ── 本週值班表 ──
  const weekLabel = ['一','二','三','四','五','六','日'];
  const monday = thisWeekMonday();
  const weekDates = weekDatesFrom(monday);
  const weekRows = weekDates.map((ds, i) => {
    const recs = DB.duty.filter(x => x.date === ds);
    const isToday = ds === today;
    const content = recs.length
      ? recs.map(r => { const [,color] = DUTY_TYPE_MAP[r.type]||DUTY_TYPE_MAP['正常值班']; return `<span style="color:${color};">●</span> ${esc(r.person)}${r.type!=='正常值班'?`（${r.type}）`:''}` ; }).join('　')
      : `<span class="text-dim">未排班</span>`;
    return `<div class="week-widget-row ${isToday?'today':''}">
      <span class="week-widget-day mono">週${weekLabel[i]} ${ds.slice(5)}</span>
      <span style="flex:1;">${content}</span>
    </div>`;
  }).join('');

  // ── 本週巡檢統計（過去7天，兩端達成天數）──
  function siteWeekRate(site) {
    let count = 0;
    for (let i=0;i<7;i++) { const d = new Date(); d.setDate(d.getDate()-i); const ds = d.toISOString().slice(0,10); if (patrol.some(p=>p.date===ds && p.site===site)) count++; }
    return count;
  }
  const tcRate = siteWeekRate('台中端'), txRate = siteWeekRate('通霄端');
  const barChart = `<div class="mini-bar-wrap">
    <div class="mini-bar-row"><span class="mini-bar-label">台中端</span><div class="mini-bar-track"><div class="mini-bar-fill" style="width:${tcRate/7*100}%;background:var(--accent);"></div></div><span class="mini-bar-val">${tcRate}/7 天</span></div>
    <div class="mini-bar-row"><span class="mini-bar-label">通霄端</span><div class="mini-bar-track"><div class="mini-bar-fill" style="width:${txRate/7*100}%;background:var(--accent);"></div></div><span class="mini-bar-val">${txRate}/7 天</span></div>
  </div>`;

  return `
  <h1 class="page-title">首頁儀表板</h1>
  <div class="grid-2">${siteCard('台中端')}${siteCard('通霄端')}</div>
  <div class="grid-2" style="margin-top:20px;">
    <div class="viewfinder card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="card-head"><span>監看紀錄表 · 缺件提醒</span></div>
      <p class="${missing.length?'warn-text':'text-dim'}">${missing.length ? '尚未上傳：'+missing.join('、') : '近 7 日紀錄完整'}</p>
    </div>
    <div class="viewfinder card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="card-head"><span>POE抽查事項</span></div>
      <p class="${pendingImprove>0?'warn-text':'text-dim'}" style="margin-bottom:8px;">${pendingImprove>0 ? `缺失待改善：${pendingImprove} 筆` : '缺失待改善：無'}</p>
      <div class="light-row">
        <span><span class="dot" style="background:var(--green)"></span>${resCounts.done||0} 預約已完成</span>
        <span><span class="dot" style="background:var(--amber)"></span>${resCounts.pending||0} 預約待辦</span>
        <span><span class="dot" style="background:var(--red)"></span>${resCounts.incomplete||0} 預約未完成</span>
      </div>
    </div>
  </div>
  <div class="viewfinder card" style="margin-top:20px;"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="card-head"><span>📅 本週值班表（監看CCTV）</span><button class="btn ghost" onclick="goPage('duty')">前往排班管理</button></div>
    <div class="week-widget">${weekRows}</div>
  </div>
  <div class="viewfinder card" style="margin-top:20px;"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="card-head"><span>📊 本週巡檢達成率（過去7天）</span></div>
    ${barChart}
  </div>`;
}

/* ============================= 值班排班表（監看CCTV） ============================= */
const DUTY_TYPE_MAP = {
  '正常值班': ['正常值班', 'var(--accent)'],
  '假日加班': ['假日加班', 'var(--amber)'],
  '請假代班': ['請假代班', 'var(--red)'],
};
function getDutyPeople() {
  const names = new Set();
  DB.duty.forEach(d => { if (d.person) names.add(d.person); if (d.backup) names.add(d.backup); });
  return [...names].sort();
}
function weekDatesFrom(monday) {
  const arr = [];
  for (let i=0;i<7;i++) { const d = new Date(monday); d.setDate(monday.getDate()+i); arr.push(d.toISOString().slice(0,10)); }
  return arr;
}
function thisWeekMonday() {
  const d = new Date();
  const dow = d.getDay(); // 0=日 ... 6=六
  const diff = dow === 0 ? -6 : 1 - dow; // 週一為一週開始
  d.setDate(d.getDate()+diff);
  return d;
}
function renderDuty() {
  const cursor = state.dutyCursor;
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const weekLabel = ['日','一','二','三','四','五','六'];
  const people = getDutyPeople();

  const rows = [];
  for (let d=1; d<=daysInMonth; d++) {
    const dateObj = new Date(year, month, d);
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const wd = dateObj.getDay();
    const isWeekend = wd===0 || wd===6;
    const isToday = key === todayStr();
    const recs = DB.duty.filter(x => x.date === key).sort((a,b)=>(a.id||'').localeCompare(b.id||''));
    const recHtml = recs.map(r => {
      const [label, color] = DUTY_TYPE_MAP[r.type] || DUTY_TYPE_MAP['正常值班'];
      return `<div class="plan-row compact" style="margin-bottom:6px;">
        <span class="pill" style="background:${color}22;color:${color};border:1px solid ${color}66;flex-shrink:0;">${label}</span>
        <div class="plan-text"><b>${esc(r.person)}</b>${r.backup?`　代班：${esc(r.backup)}`:''}${r.note?`　<span class="text-dim">${esc(r.note)}</span>`:''}</div>
        <button class="icon-btn" onclick="showDutyForm('${r.id}')">✎</button>
        <button class="icon-btn danger" onclick="confirmDelDuty('${r.id}')">✕</button>
      </div>`;
    }).join('') || `<p class="text-dim" style="padding:4px 0;font-size:13px;">尚未排班</p>`;
    rows.push(`<div class="duty-row ${isToday?'today':''} ${isWeekend?'weekend':''}">
      <div class="duty-date">
        <span class="mono">${key}</span><span class="text-dim" style="font-size:11px;">週${weekLabel[wd]}${isWeekend?'・假日':''}${isToday?'・今天':''}</span>
      </div>
      <div style="flex:1;min-width:0;">${recHtml}</div>
      <button class="btn ghost" style="flex-shrink:0;" onclick="showDutyForm(null,'${key}')">＋ 排班</button>
    </div>`);
  }

  return `
  <h1 class="page-title">📅 值班排班表</h1>
  <p class="text-dim" style="margin-bottom:16px;">監看CCTV人員排班，含假日加班與請假代班標記。</p>
  <div class="cal-head" style="justify-content:flex-start;gap:16px;margin-bottom:14px;">
    <button class="icon-btn" onclick="shiftDutyMonth(-1)">◀ 上個月</button>
    <span class="mono">${year} / ${String(month+1).padStart(2,'0')}</span>
    <button class="icon-btn" onclick="shiftDutyMonth(1)">下個月 ▶</button>
    <button class="btn primary" onclick="showDutyForm()">＋ 新增排班</button>
  </div>
  <datalist id="duty-people-list">${people.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
  <div class="duty-list">${rows.join('')}</div>`;
}
function shiftDutyMonth(delta) { const c = state.dutyCursor; state.dutyCursor = new Date(c.getFullYear(), c.getMonth()+delta, 1); render(); }
function showDutyForm(id, presetDate) {
  const item = id ? DB.duty.find(r => r.id === id) : null;
  openModal(item ? '編輯排班' : '新增排班', `
    <div class="form-grid">
      <input type="hidden" id="du-id" value="${item?item.id:''}">
      <label class="field"><span class="field-label mono">日期</span><input class="input" type="date" id="du-date" value="${item?item.date:(presetDate||todayStr())}"></label>
      <label class="field"><span class="field-label mono">值班人員</span><input class="input" id="du-person" list="duty-people-list" value="${item?esc(item.person):''}" placeholder="輸入姓名"></label>
      <label class="field"><span class="field-label mono">班別</span><select class="input" id="du-type">
        <option ${item&&item.type==='正常值班'?'selected':''}>正常值班</option>
        <option ${item&&item.type==='假日加班'?'selected':''}>假日加班</option>
        <option ${item&&item.type==='請假代班'?'selected':''}>請假代班</option>
      </select></label>
      <label class="field"><span class="field-label mono">代班人員（請假時填寫）</span><input class="input" id="du-backup" list="duty-people-list" value="${item?esc(item.backup):''}" placeholder="選填"></label>
      <label class="field"><span class="field-label mono">備註</span><input class="input" id="du-note" value="${item?esc(item.note):''}" placeholder="選填"></label>
      <div class="row-end"><button class="btn primary" id="du-save-btn" onclick="saveDuty(this)">儲存</button></div>
    </div>`);
}
async function saveDuty(btn) {
  const idVal = document.getElementById('du-id').value;
  const rec = {
    id: idVal || undefined,
    date: document.getElementById('du-date').value,
    person: document.getElementById('du-person').value.trim(),
    type: document.getElementById('du-type').value,
    backup: document.getElementById('du-backup').value.trim(),
    note: document.getElementById('du-note').value.trim(),
  };
  if (!rec.date || !rec.person) { alert('請填寫日期與值班人員'); return; }
  const originalLabel = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '儲存中...'; }
  try { await apiUpsert(SHEET_MAP.duty.sheet, SHEET_MAP.duty.toRow(rec)); await reloadOne('duty'); }
  catch (err) {
    alert('儲存失敗：' + err + '\n（若是第一次使用，請確認 Google 試算表已新增「監看值班表」分頁）');
    if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
    return;
  }
  closeModal(); render();
}
function confirmDelDuty(id) { confirmDialog('確定要刪除這筆排班嗎？', `doDelDuty('${id}')`); }
async function doDelDuty(id) {
  try { await apiDelete(SHEET_MAP.duty.sheet, id); await reloadOne('duty'); }
  catch (err) { alert('刪除失敗：' + err); }
  closeModal(); render();
}

/* ============================= 工作日誌 ============================= */
function renderWorklog() {
  const patrol = DB.patrol;
  const tomorrow = DB.tomorrow;
  window.__filterSite = window.__filterSite || '全部';
  window.__filterDate = window.__filterDate || '';

  const STATUS_MAP = { done:['已完成','var(--green)'], pending:['待完成','var(--amber)'], incomplete:['未完成','var(--red)'] };
  const WEEKDAY_CN = ['日','一','二','三','四','五','六'];

  // 把工作項目文字拆成「日期」跟「內容」兩部分：大家習慣把日期打在最前面（例如「9/30(三) 通霄-...」），
  // 這裡抓出來單獨顯示在日期欄，內容欄就不會重複出現同一個日期。抓不到日期格式的話，
  // 就用這筆記錄本身的日期（新增當下的日期）＋自動算出的星期幾來顯示。
  function splitTomorrowDate(it) {
    const task = it.task || '';
    const m = task.match(/^(\d{1,2})\/(\d{1,2})(?:\s*[\(（]([^\)）]{1,3})[\)）])?\s*[-－:：、]?\s*/);
    let mm, dd, rest;
    if (m) {
      mm = Number(m[1]); dd = Number(m[2]); rest = task.slice(m[0].length).trim();
    } else {
      const parts = (it.date || todayStr()).split('-');
      mm = Number(parts[1]||0); dd = Number(parts[2]||0); rest = task;
    }
    const year = (it.date || todayStr()).slice(0,4);
    const full = `${year}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const d = new Date(full + 'T00:00:00');
    const wd = isNaN(d.getTime()) ? '' : WEEKDAY_CN[d.getDay()];
    const label = (mm && dd) ? `${mm}/${dd}${wd?`(${wd})`:''}` : '—';
    return { label, text: rest || task };
  }

  // 狀態點擊一次照原本邏輯在「待完成→已完成→未完成」之間循環，只是改用打勾/打叉的樣式顯示
  function tomorrowMark(status) {
    if (status === 'done') return { sym: '✓', cls: 'tmrw-mark-done', title: STATUS_MAP.done[0] + '（點擊切換）' };
    if (status === 'incomplete') return { sym: '✕', cls: 'tmrw-mark-bad', title: STATUS_MAP.incomplete[0] + '（點擊切換）' };
    return { sym: '－', cls: 'tmrw-mark-pending', title: STATUS_MAP.pending[0] + '（點擊切換）' };
  }

  function tomorrowSiteTable(site) {
    const items = tomorrow.filter(it => it.site === site).slice().sort((a, b) => tomorrowSortKey(a).localeCompare(tomorrowSortKey(b)));
    const rows = items.map(it => {
      const { label, text } = splitTomorrowDate(it);
      const mark = tomorrowMark(it.status);
      return `<tr>
        <td class="tmrw-date">${esc(label)}</td>
        <td class="tmrw-task">${esc(text)}${it.assignee?` <span class="text-dim mono" style="font-size:11px;">（${esc(it.assignee)}）</span>`:''}</td>
        <td class="tmrw-status"><div class="tmrw-status-inner">
          <span class="tmrw-mark ${mark.cls}" onclick="cycleTomorrow('${it.id}')" title="${mark.title}">${mark.sym}</span>
          <button class="icon-btn tmrw-del-btn" onclick="showTomorrowForm('${it.id}')" title="編輯">✎</button>
          <button class="icon-btn danger tmrw-del-btn" onclick="delTomorrow('${it.id}')" title="刪除">✕</button>
        </div></td>
      </tr>`;
    }).join('') || `<tr><td colspan="3" class="text-dim" style="text-align:center;padding:12px;">尚無項目</td></tr>`;
    return `<div class="tmrw-col">
      <table class="tmrw-table">
        <thead><tr><th colspan="3" class="tmrw-table-head">${site}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  const tomorrowWidget = `<div class="viewfinder card compact-card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="tomorrow-sticky-head">
      <div class="card-head"><span>明日預計工作</span></div>
      <div class="row-form">
        <select class="input" id="tw-site" style="width:110px;flex-shrink:0;"><option>台中端</option><option>通霄端</option></select>
        <input class="input" id="tw-task" placeholder="工作項目（可在最前面打上日期，例如 9/30 ...，會自動拆到左側日期欄）">
        <input class="input" id="tw-assignee" placeholder="負責人員（選填）" style="width:140px;flex-shrink:0;">
        <button class="btn primary" style="flex-shrink:0;" onclick="addTomorrow(document.getElementById('tw-site').value)">＋新增</button>
      </div>
    </div>
    <div class="tmrw-wrap" style="margin-top:10px;">${tomorrowSiteTable('台中端')}${tomorrowSiteTable('通霄端')}</div>
  </div>`;

  const filtered = patrol.filter(p => (window.__filterSite==='全部'||p.site===window.__filterSite) && (!window.__filterDate||p.date===window.__filterDate));
  const rows = filtered.map(p => {
    const [label, color] = STATUS_MAP[p.status] || STATUS_MAP.pending;
    return `<tr>
    <td>${p.date}</td><td>${p.site}</td><td>${esc(p.personnel)}</td><td>${esc(p.timeRange)}</td><td>${esc(p.items)}</td>
    <td><button class="status-light" onclick="cyclePatrol('${p.id}')"><span class="dot" style="background:${color};box-shadow:0 0 8px ${color}"></span>${label}</button></td>
    <td>${esc(p.abnormalNote)||'—'}</td><td>${esc(p.signer)}</td>
    <td><button class="icon-btn danger" onclick="confirmDelPatrol('${p.id}')">🗑</button></td>
  </tr>`;
  }).join('') || `<tr><td colspan="9" class="text-dim" style="text-align:center;padding:20px;">尚無紀錄</td></tr>`;

  return `
  <h1 class="page-title">工作日誌</h1>
  ${tomorrowWidget}
  <div class="section-head"><h2 class="section-title">今日巡檢紀錄</h2><button class="btn primary" onclick="showPatrolForm()">＋ 新增紀錄</button></div>
  <div class="filter-row">
    <select class="input" style="width:140px" onchange="window.__filterSite=this.value;render()">
      <option ${window.__filterSite==='全部'?'selected':''}>全部</option>
      <option ${window.__filterSite==='台中端'?'selected':''}>台中端</option>
      <option ${window.__filterSite==='通霄端'?'selected':''}>通霄端</option>
    </select>
    <input class="input" style="width:160px" type="date" value="${window.__filterDate}" onchange="window.__filterDate=this.value;render()">
  </div>
  <div class="table-wrap"><table class="data-table">
    <thead><tr><th>日期</th><th>地點</th><th>人員</th><th>時段</th><th>巡檢項目</th><th>狀態（點擊切換）</th><th>異常說明</th><th>簽核人</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

async function addTomorrow(site) {
  const task = document.getElementById('tw-task').value.trim();
  const assignee = document.getElementById('tw-assignee').value.trim();
  if (!task) return;
  try {
    await apiUpsert(SHEET_MAP.tomorrow.sheet, SHEET_MAP.tomorrow.toRow({ site, task, assignee, status: 'pending', date: todayStr() }));
    await reloadOne('tomorrow');
  } catch (err) { alert('新增失敗：' + err); }
  render();
}
async function cycleTomorrow(id) {
  const it = DB.tomorrow.find(r => r.id === id);
  if (!it) return;
  const order = ['pending','done','incomplete'];
  const nextStatus = order[(order.indexOf(it.status)+1) % order.length];
  try {
    await apiUpsert(SHEET_MAP.tomorrow.sheet, SHEET_MAP.tomorrow.toRow({ ...it, status: nextStatus }));
    await reloadOne('tomorrow');
  } catch (err) { alert('更新失敗：' + err); }
  render();
}
async function delTomorrow(id) {
  try { await apiDelete(SHEET_MAP.tomorrow.sheet, id); await reloadOne('tomorrow'); }
  catch (err) { alert('刪除失敗：' + err); }
  render();
}

/* ============================= 監看紀錄表 ============================= */
function renderMonitor() {
  const files = DB.monitorFiles;
  const cursor = state.monitorCursor;
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const dateKey = d => `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const weekLabel = ['日','一','二','三','四','五','六'];

  // 直立式清單：由該月最後一天往回排到第一天（最新在最上面）
  const rows = [];
  for (let d = daysInMonth; d >= 1; d--) {
    const key = dateKey(d);
    const rec = files[key];
    const noWork = !!rec && rec.filename === MONITOR_NO_WORK;
    const has = !!rec && !noWork;
    const isToday = key === todayStr();
    const sel = state.monitorSelected === key;
    const wd = weekLabel[new Date(year, month, d).getDay()];
    const checked = state.monitorDownloadSelected.has(key);
    rows.push(`<div class="monitor-row ${sel?'selected':''} ${isToday?'today':''}" onclick="selectMonitorDate('${key}')">
      <label class="monitor-row-check" onclick="event.stopPropagation()" title="${has?'勾選以加入批次下載':'此日期無檔案，無法下載'}">
        <input type="checkbox" ${checked?'checked':''} ${has?'':'disabled'} onchange="toggleMonitorDownload('${key}')">
      </label>
      <div class="monitor-row-main">
        <div class="monitor-row-date">
          <span class="mono">${key}</span><span class="text-dim" style="font-size:11px;">週${wd}${isToday?'・今天':''}</span>
        </div>
        <div class="monitor-row-status">
          ${has ? `<span class="pill pill-green">已上傳</span><span class="text-dim" style="font-size:12px;">${esc(rec.filename)}</span>` : noWork ? `<span class="pill pill-gray">未出工</span>` : `<span class="pill pill-red">未上傳</span>`}
        </div>

    } else if (noWorkSel) {
      detail = `<div class="viewfinder card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <div class="card-head"><span>${state.monitorSelected}</span></div>
        <p><span class="pill pill-gray">未出工</span></p>

        </div>
      </div>`;

function shiftMonth(delta) { const c = state.monitorCursor; state.monitorCursor = new Date(c.getFullYear(), c.getMonth()+delta, 1); render(); }
function renderPreserveScroll() {
  const list = document.querySelector('.monitor-list');
  const listScroll = list ? list.scrollTop : 0;
  const contentEl = document.getElementById('content');
  const contentScroll = contentEl ? contentEl.scrollTop : 0;
  render();
  const newList = document.querySelector('.monitor-list');
  if (newList) newList.scrollTop = listScroll;
  const newContent = document.getElementById('content');
  if (newContent) newContent.scrollTop = contentScroll;
}
function selectMonitorDate(key) {
  state.monitorSelected = key;
  renderPreserveScroll();
}
async function handleMonitorFile(e) {
  const file = e.target.files[0];
  if (!file || !state.monitorSelected) return;
  const existing = DB.monitorFiles[state.monitorSelected];
  if (existing) {
    state.pendingUpload = { date: state.monitorSelected, file };
    confirmDialog(`${state.monitorSelected} 已存在檔案（${esc(existing.filename)}），是否要覆蓋？`, 'doMonitorUpload()');
  } else {
    await doMonitorUploadWith(state.monitorSelected, file, 0);
  }
  e.target.value = '';
}
async function doMonitorUpload() {
  if (!state.pendingUpload) return;
  const existing = DB.monitorFiles[state.pendingUpload.date];
  const count = (existing && existing.overwriteCount ? Number(existing.overwriteCount) : 0) + 1;
  await doMonitorUploadWith(state.pendingUpload.date, state.pendingUpload.file, count);
  state.pendingUpload = null;
  closeModal();
}
async function doMonitorUploadWith(date, file, overwriteCount) {
  try {
    const existing = DB.monitorFiles[date];
    const url = await apiUploadFile(file, '監看紀錄表檔案', existing ? existing.fileUrl : '');
    const saveResult = await apiSaveMonitor(date, file.name, url, overwriteCount);
    await reloadOne('monitorFiles');
    alert('✅ 上傳成功！\n\n日期：' + date + '\n檔名：' + file.name + '\n雲端硬碟連結：' + url + '\n\n試算表回傳資料：' + JSON.stringify(saveResult));
  } catch (err) {
    alert('❌ 上傳過程發生錯誤：\n' + err);
  }
  renderPreserveScroll();
}
// 標記「未出工」：現場當天無人出工、不需要監看紀錄，登記後該日期就不會再出現在「缺件提醒」清單。
async function markMonitorNoWork(date) {
  try {
    await apiSaveMonitor(date, MONITOR_NO_WORK, '', 0);
    await reloadOne('monitorFiles');
  } catch (err) {
    alert('❌ 標記失敗：\n' + err);
  }
  renderPreserveScroll();
}
function confirmCancelNoWork(date) {
  confirmDialog(`確定要取消 ${date} 的「未出工」標記嗎？`, `doCancelNoWork('${date}')`);
}
async function doCancelNoWork(date) {
  try {
    await apiDelete('監看紀錄表', date);
    await reloadOne('monitorFiles');
  } catch (err) {
    alert('❌ 取消失敗：\n' + err);
  }
  closeModal();
  renderPreserveScroll();
}
function downloadMonitorFile(date) {
  const rec = DB.monitorFiles[date];
  if (!rec || !rec.fileUrl) return;
  window.open(toDriveDownloadUrl(rec.fileUrl), '_blank');
}
function toggleMonitorDownload(key) {
  if (state.monitorDownloadSelected.has(key)) state.monitorDownloadSelected.delete(key);
  else state.monitorDownloadSelected.add(key);
  renderPreserveScroll();
}
function selectAllMonitorInMonth(year, month) {
  const daysInMonth = new Date(year, month+1, 0).getDate();
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = DB.monitorFiles[key];
    if (rec && rec.filename !== MONITOR_NO_WORK) state.monitorDownloadSelected.add(key);
  }
  renderPreserveScroll();
}
function clearMonitorDownloadSelection() {
  state.monitorDownloadSelected.clear();
  renderPreserveScroll();
}
// 逐一觸發瀏覽器下載每個勾選日期的檔案（各自獨立的檔案，不會合併成單一壓縮檔，
// 因為檔案原始存放在各自的 Google 雲端硬碟連結上）。用小間隔錯開觸發時間，
// 降低瀏覽器把後面的下載誤判為快顯視窗而擋掉的機率。
function downloadSelectedMonitorFiles() {
  const keys = [...state.monitorDownloadSelected].filter(k => DB.monitorFiles[k]).sort();
  if (keys.length === 0) { alert('請先勾選要下載的日期'); return; }
  keys.forEach((key, i) => {
    setTimeout(() => {
      const rec = DB.monitorFiles[key];
      if (rec && rec.fileUrl) window.open(toDriveDownloadUrl(rec.fileUrl), '_blank');
    }, i * 400);
  });
}

// 每月可以有多份檔案，所以上傳一律是「新增」，不會覆蓋同月份已經存在的檔案。
async function handleMonitorMonthlyFile(e) {
  const file = e.target.files[0];
  const month = window.__monitorMonthlyUploadKey;
  e.target.value = '';
  if (!file || !month) return;
  try {
    const url = await apiUploadFile(file, '監看紀錄表月彙總檔案', '');

function findMonitorMonthlyByKey(key) {
  for (const month in DB.monitorMonthly) {

}

async function saveRouter(btn) {
  const idVal = document.getElementById('rf-id').value;
  const rec = {
    id: idVal || undefined,
    site: document.getElementById('rf-site').value,
    type: document.getElementById('rf-type').value.trim(),
    code: document.getElementById('rf-code').value.trim(),
    cur: document.getElementById('rf-cur').value,
    next: document.getElementById('rf-next').value,
    date: document.getElementById('rf-date').value.trim(),
    status: document.getElementById('rf-status').value,
    note: document.getElementById('rf-note').value.trim(),
  };
  if (!rec.code) { alert('請填寫設備編號'); return; }
  const originalLabel = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '儲存中...'; }

  if (window.__poeTab === 'check') {

      <div class="table-wrap"><table class="data-table"><thead><tr><th>日期</th><th>窗口</th><th>地點</th><th>項目</th><th>結果</th><th>改善狀態</th><th>附件</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else if (window.__poeTab === 'extra') {
    const cards = extra.map(e => `<div class="viewfinder card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="card-head"><span>${e.date}</span><span class="text-dim">${esc(e.inspector)}</span></div>
      <p>${esc(e.description)}</p>

      </div>
    </div>`).join('') || `<p class="text-dim">尚無其他需求檔案</p>`;
    body = `<div class="section-head"><span></span><button class="btn primary" onclick="showPoeExtraForm()">＋ 新增需求</button></div><div class="grid-2">${cards}</div>`;
  } else {
    const rows = reservations.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(r => {
      const [label, color] = STATUS_MAP[r.status] || STATUS_MAP.pending;
      return `<div class="plan-row compact">
        <span class="pill mono">${r.date}</span>
        <button class="status-light" onclick="cyclePoeReservation('${r.id}')"><span class="dot" style="background:${color};box-shadow:0 0 8px ${color}"></span>${label}</button>
        <div class="plan-text">${esc(r.note)}</div>
        <button class="icon-btn danger" onclick="delPoeReservation('${r.id}')">✕</button>
      </div>`;
    }).join('') || `<p class="text-dim" style="padding:8px 0;">尚無預約紀錄</p>`;
    body = `<div class="viewfinder card compact-card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="card-head"><span>POE預約抽查</span></div>

        <input class="input" id="pr-note" placeholder="說明（例如：預約項目、聯絡窗口）">

  return `

  <div class="tabs">
    <button class="tab ${window.__poeTab==='check'?'active':''}" onclick="window.__poeTab='check';render()">定期抽查紀錄</button>
    <button class="tab ${window.__poeTab==='extra'?'active':''}" onclick="window.__poeTab='extra';render()">其他需求檔案</button>
    <button class="tab ${window.__poeTab==='reservation'?'active':''}" onclick="window.__poeTab='reservation';render()">預約抽查</button>
  </div>
  ${body}`;
}

async function addPoeReservation() {
  const date = document.getElementById('pr-date').value;
  const note = document.getElementById('pr-note').value.trim();
  if (!date) return;
  try {
    await apiUpsert(SHEET_MAP.poeReservation.sheet, SHEET_MAP.poeReservation.toRow({ date, note, status: 'pending' }));
    await reloadOne('poeReservation');
  } catch (err) { alert('新增失敗：' + err); }
  render();
}
async function cyclePoeReservation(id) {
  const it = DB.poeReservation.find(r => r.id === id);
  if (!it) return;
  const order = ['pending','done','incomplete'];
  const nextStatus = order[(order.indexOf(it.status)+1) % order.length];
  try {
    await apiUpsert(SHEET_MAP.poeReservation.sheet, SHEET_MAP.poeReservation.toRow({ ...it, status: nextStatus }));
    await reloadOne('poeReservation');
  } catch (err) { alert('更新失敗：' + err); }
  render();
}
async function delPoeReservation(id) {
  try { await apiDelete(SHEET_MAP.poeReservation.sheet, id); await reloadOne('poeReservation'); }

  render();
}

function toImageThumb(url, size) {
  if (!url) return '';
  const m = url.match(/\/d\/([^\/]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${size||300}`;
  return url;
}
function showLightbox(url) {
  const div = document.createElement('div');
  div.className = 'lightbox-backdrop';
  div.onclick = () => div.remove();
  div.innerHTML = `<img src="${toImageThumb(url, 1400)}">`;
  document.body.appendChild(div);
}

function gpsFieldScore(d) { return ['imei','mac','origin','model','name','location','note'].reduce((s,k)=>s+(d[k]?1:0),0); }

async function dedupeGpsByNum(silent) {
  const groups = {};
  DB.gpsDevices.forEach(d => { if (!d.num) return; (groups[d.num] = groups[d.num] || []).push(d); });
  const dupGroups = Object.values(groups).filter(g => g.length > 1);
  if (dupGroups.length === 0) { if (!silent) alert('沒有發現重複的 NUM 編號'); return 0; }

  const idsToRemove = [];
  for (const g of dupGroups) {
    // 保留欄位資料最完整的一筆，其餘視為重複資料刪除
    const sorted = [...g].sort((a, b) => gpsFieldScore(b) - gpsFieldScore(a));
    sorted.slice(1).forEach(d => idsToRemove.push(d.id));
  }

  let removed = 0;
  try {
    // 優先嘗試批次刪除（一次網路請求），需要 Apps Script 已加入 deleteMany
    await apiDeleteMany(SHEET_MAP.gpsDevices.sheet, idsToRemove);
    removed = idsToRemove.length;
  } catch (e) {
    // 後端尚未更新支援批次刪除，改成逐筆刪除（速度較慢，但仍能正確完成）
    for (const id of idsToRemove) {
      try { await apiDelete(SHEET_MAP.gpsDevices.sheet, id); removed++; } catch (e2) { /* 略過單筆刪除失敗 */ }
    }
  }
  await reloadOne('gpsDevices');
  render();
  if (!silent) alert(`已清除 ${removed} 筆重複資料，目前剩下 ${DB.gpsDevices.length} 台（不重複）`);
  return removed;
}

// 批次上傳照片：依檔名比對 GPS_FILE_NUM_MAP（原始相機檔名 -> NUM），
// 找不到對照表比對時，會退而求其次嘗試「檔名本身就是NUM」（例如已重新命名成 TW24100145.jpg 的情況）。
async function bulkUploadGpsPhotos(event) {
  const files = Array.from(event.target.files || []);
  if (files.length === 0) return;

  const btn = document.getElementById('gpsPhotoBulkBtn');
  const status = document.getElementById('gpsImportStatus');
  if (btn) btn.disabled = true;

  const fileMap = {};
  GPS_FILE_NUM_MAP.forEach(m => { fileMap[m.file.toUpperCase()] = m.num; });

  let uploaded = 0, failed = 0, unmatched = [];
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    if (status) status.textContent = `照片上傳中… ${i + 1} / ${files.length}`;
    const base = file.name.replace(/\.[^.]+$/, '').toUpperCase();
    const num = fileMap[base] || (DB.gpsDevices.find(d => d.num && d.num.toUpperCase() === base) ? base : null);
    const target = num ? DB.gpsDevices.find(d => d.num && d.num.toUpperCase() === num.toUpperCase()) : null;

    if (!target) { unmatched.push(file.name); continue; }

    try {
      const url = await apiUploadFile(file, 'GPS機台照片', target.photo || '');
      const rec = { ...target, photo: url };
      await apiUpsert(SHEET_MAP.gpsDevices.sheet, SHEET_MAP.gpsDevices.toRow(rec));
      target.photo = url; // 直接更新本機快取，畫面立即反映
      uploaded++;
    } catch (e) {
      failed++;
    }
  }

  if (status) status.textContent = '';
  if (btn) btn.disabled = false;
  event.target.value = '';
  render();

  let msg = `批次上傳完成：成功 ${uploaded} 張${failed?`，失敗 ${failed} 張`:''}`;
  if (unmatched.length) {
    msg += `\n\n找不到對應NUM、未上傳的檔案（${unmatched.length}張）：\n${unmatched.slice(0, 15).join('、')}${unmatched.length>15?'…等':''}`;
  }
  alert(msg);
}

async function importGpsExcel(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined') { alert('SheetJS 尚未載入'); return; }
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const sheetName = wb.SheetNames.includes('GPS機台資料表') ? 'GPS機台資料表' : wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName]);
  const validRows = rows.filter(r => String(r['NUM編號'] || r['NUM'] || '').trim());

  const btn = document.getElementById('gpsImportBtn');
  const status = document.getElementById('gpsImportStatus');
  if (btn) btn.disabled = true;

  // 匯入前先重新從雲端拉一次最新資料，避免用到過舊的本機快取而誤判「不存在」導致重複新增
  if (status) status.textContent = '匯入前先同步最新資料…';
  try { await reloadOne('gpsDevices'); } catch (e) {}

  let added = 0, updated = 0, failed = 0, firstError = '';
  for (let i = 0; i < validRows.length; i++) {
    const r = validRows[i];
    if (status) status.textContent = `匯入中… ${i + 1} / ${validRows.length}`;
    const num = String(r['NUM編號'] || r['NUM'] || '').trim();
    const existing = DB.gpsDevices.find(d => d.num === num);
    const rec = {
      id: existing ? existing.id : undefined,
      num, site: r['區域'] || existing?.site || '未分類',
      name: r['品名'] || existing?.name || 'GPS定位卡',
      model: r['型號'] || existing?.model || '',
      imei: String(r['IMEI'] || existing?.imei || ''),
      mac: String(r['MAC'] || existing?.mac || ''),
      origin: r['產地'] || existing?.origin || '',
      location: r['安裝位置'] || existing?.location || '',
      note: r['備註'] || existing?.note || '',
      photo: existing?.photo || '',
    };
    try {
      await apiUpsert(SHEET_MAP.gpsDevices.sheet, SHEET_MAP.gpsDevices.toRow(rec));
      if (existing) { updated++; } else { added++; DB.gpsDevices.push({ ...rec, id: rec.id || 'temp_' + num }); }
    } catch (e) {
      failed++;
      if (!firstError) firstError = String(e.message || e);
    }
  }
  if (status) status.textContent = '檢查是否有重複資料…';
  try { await reloadOne('gpsDevices'); } catch (e) {}
  const dupRemoved = await dedupeGpsByNum(true).catch(() => 0);
  if (status) status.textContent = '';
  if (btn) btn.disabled = false;
  event.target.value = '';
  render();
  if (failed > 0 && added === 0 && updated === 0) {
    alert(`匯入失敗（0 筆成功）。\n\n第一筆錯誤訊息：${firstError}\n\n請確認：\n1. Apps Script 的 ID_COLUMNS 是否已加入「GPS機台資料表」並重新部署\n2. Google Sheets 是否已新增「GPS機台資料表」這個分頁（名稱要完全一致）`);
  } else {
    alert(`匯入完成：新增 ${added} 筆，更新 ${updated} 筆${failed?`，失敗 ${failed} 筆（第一筆錯誤：${firstError}）`:''}${dupRemoved?`\n（另外自動清除了 ${dupRemoved} 筆重複資料）`:''}`);
  }
}

  try { await apiUpsert(SHEET_MAP.links.sheet, SHEET_MAP.links.toRow(rec)); await reloadOne('links'); }
  catch (err) {
    alert('儲存失敗：' + err + '\n（若是第一次使用，請確認 Google 試算表已新增「附屬網址」分頁）');
    if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
    return;
  }
  closeModal(); render();
}
function confirmDelLink(id, name) { confirmDialog(`確定要刪除「${name}」這筆網址嗎？`, `doDelLink('${id}')`); }
async function doDelLink(id) {
  try { await apiDelete(SHEET_MAP.links.sheet, id); await reloadOne('links'); }
  catch (err) { alert('刪除失敗：' + err); return; }
  render();
}

/* ============================= Excel 匯出 / 匯入 ============================= */
function exportExcel() {
  const wb = XLSX.utils.book_new();
  const patrol = DB.patrol.map(p => ({日期:p.date,地點:p.site,人員:p.personnel,時段:p.timeRange,巡檢項目:p.items,狀態:p.status,異常說明:p.abnormalNote,處理結果:p.handledResult,簽核人:p.signer}));
  const tomorrow = DB.tomorrow.map(t => ({日期:t.date,地點:t.site,工作項目:t.task,負責人員:t.assignee,狀態:t.status}));
  const poeChecks = DB.poeChecks.map(p => ({日期:p.date,窗口:p.inspector,地點:p.site,項目:p.item,結果:p.result,缺失事項:p.defect,改善期限:p.deadline,改善狀態:p.improveStatus,附件連結:p.fileUrl,附件檔名:p.fileName}));
  const poeExtra = DB.poeExtra.map(e => ({日期:e.date,窗口:e.inspector,說明:e.description,附件連結:e.fileUrl,附件檔名:e.fileName}));
  const equipT = DB.equipTaichung.map(e => ({類別:e.category,名稱:e.name,位置:e.location,型號:e.model,安裝日期:e.installDate,保固期限:e.warranty,最近維護:e.lastMaintenance,狀態:e.status,負責廠商:e.vendor,備註:e.note}));
  const equipX = DB.equipTongxiao.map(e => ({類別:e.category,名稱:e.name,位置:e.location,型號:e.model,安裝日期:e.installDate,保固期限:e.warranty,最近維護:e.lastMaintenance,狀態:e.status,負責廠商:e.vendor,備註:e.note}));
  const monitorFiles = DB.monitorFiles;
  const monitorRows = Object.keys(monitorFiles).sort().map(d => ({日期:d,檔名:monitorFiles[d].filename,連結:monitorFiles[d].fileUrl,上傳人:monitorFiles[d].uploader,上傳時間:monitorFiles[d].uploadTime}));

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(patrol), '工作日誌');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tomorrow), '明日預計工作');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(monitorRows), '監看紀錄表');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(poeChecks), 'POE抽查日誌');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(poeExtra), 'POE其他需求');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(equipT), '台中端');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(equipX), '通霄端');
  XLSX.writeFile(wb, `CCTV監控平台備份_${todayStr()}.xlsx`);
}

async function importExcel(event) {
  const file = event.target.files[0];
  if (!file) return;
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  function sheetJson(name) { return wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name]) : []; }

  const patrol = sheetJson('工作日誌').map(r => ({ date: r['日期'], site: r['地點'], personnel: r['人員'], timeRange: r['時段'], items: r['巡檢項目'], status: r['狀態'], abnormalNote: r['異常說明'], handledResult: r['處理結果'], signer: r['簽核人'] }));
  const tomorrow = sheetJson('明日預計工作').map(r => ({ date: r['日期'], site: r['地點'], task: r['工作項目'], assignee: r['負責人員'], status: r['狀態'] || 'pending' }));
  const poeChecks = sheetJson('POE抽查日誌').map(r => ({ date: r['日期'], inspector: r['窗口'], site: r['地點'], item: r['項目'], result: r['結果'], defect: r['缺失事項'], deadline: r['改善期限'], improveStatus: r['改善狀態'] }));
  const poeExtra = sheetJson('POE其他需求').map(r => ({ date: r['日期'], inspector: r['窗口'], description: r['說明'] }));
  const equipT = sheetJson('台中端').map(r => ({ category: r['類別'], name: r['名稱'], location: r['位置'], model: r['型號'], installDate: r['安裝日期'], warranty: r['保固期限'], lastMaintenance: r['最近維護'], status: r['狀態'] || 'normal', vendor: r['負責廠商'], note: r['備註'] }));
  const equipX = sheetJson('通霄端').map(r => ({ category: r['類別'], name: r['名稱'], location: r['位置'], model: r['型號'], installDate: r['安裝日期'], warranty: r['保固期限'], lastMaintenance: r['最近維護'], status: r['狀態'] || 'normal', vendor: r['負責廠商'], note: r['備註'] }));

  const jobs = [
    ...patrol.map(r => () => apiUpsert(SHEET_MAP.patrol.sheet, SHEET_MAP.patrol.toRow(r))),
    ...tomorrow.map(r => () => apiUpsert(SHEET_MAP.tomorrow.sheet, SHEET_MAP.tomorrow.toRow(r))),
    ...poeChecks.map(r => () => apiUpsert(SHEET_MAP.poeChecks.sheet, SHEET_MAP.poeChecks.toRow(r))),
    ...poeExtra.map(r => () => apiUpsert(SHEET_MAP.poeExtra.sheet, SHEET_MAP.poeExtra.toRow(r))),
    ...equipT.map(r => () => apiUpsert(SHEET_MAP.equipTaichung.sheet, SHEET_MAP.equipTaichung.toRow(r))),
    ...equipX.map(r => () => apiUpsert(SHEET_MAP.equipTongxiao.sheet, SHEET_MAP.equipTongxiao.toRow(r))),
  ];
  if (jobs.length === 0) { alert('這份 Excel 裡沒有可辨識的資料列'); event.target.value = ''; return; }
  if (!confirm(`即將把 ${jobs.length} 筆資料寫入 Google 雲端試算表，這個動作無法復原，確定要匯入嗎？`)) { event.target.value = ''; return; }
  document.getElementById('content').innerHTML = '<div class="page"><p class="text-dim">匯入中，資料量較大時請耐心等候…</p></div>';
  for (const job of jobs) {
    try { await job(); } catch (err) { console.error('匯入某一列失敗', err); }
  }
  alert('匯入完成！（注意：監看紀錄表的原始 Word/PDF 檔案不會透過 Excel 匯入匯出，僅同步清單資訊）');
  event.target.value = '';
  await loadAllData();
}

tickClock();
loadAllData();
