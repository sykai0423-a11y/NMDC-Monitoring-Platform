/* ============================= 路由器更換表 ============================= */
function routerStatusPill(status) {
  const map = { '已更換':'pill-green', '未更換':'pill-red', '損壞待換':'pill-red', '已下單待貨':'pill-amber' };
  return `<span class="pill ${map[status]||'pill-amber'}">${status}</span>`;
}

function renderRouter() {
  window.__routerFilterSite = window.__routerFilterSite || '全部';
  window.__routerFilterStatus = window.__routerFilterStatus || '全部';
  const data = DB.router;

  const total = data.length;
  const done = data.filter(r => r.status === '已更換').length;
  const pending = data.filter(r => r.status === '未更換').length;
  const tc = data.filter(r => r.site === '台中端').length;
  const tx = data.filter(r => r.site === '通霄端').length;
  const pct = total ? Math.round(done / total * 100) : 0;

  const statCards = [
    { label: '設備總數', num: total, color: 'var(--text)' },
    { label: '已更換', num: done, color: 'var(--green)' },
    { label: '未更換', num: pending, color: 'var(--red)' },
    { label: '台中端', num: tc, color: 'var(--accent)' },
    { label: '通霄端', num: tx, color: 'var(--accent)' },
  ].map(s => `<div class="viewfinder card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="stat-num" style="color:${s.color}">${s.num}</div>
    <div class="stat-label">${s.label}</div>
  </div>`).join('');

  const filtered = data.filter(r => (window.__routerFilterSite==='全部' || r.site===window.__routerFilterSite) && (window.__routerFilterStatus==='全部' || r.status===window.__routerFilterStatus));
  const rows = filtered.map((r, i) => {
    const expanded = !!state.routerExpanded[r.id];
    const mainRow = `<tr>
      <td><button class="icon-btn" onclick="toggleRouterExpand('${r.id}')" title="展開／收合更換紀錄">${expanded?'▾':'▸'}</button></td>
      <td class="mono text-dim">${i+1}</td>
      <td><span class="site-tag">${esc(r.site)}</span></td>
      <td>${esc(r.type)}</td>
      <td class="mono">${esc(r.code)}</td>
      <td>${esc(r.cur)}</td>
      <td>${r.next ? esc(r.next) : '<span class="text-dim">—</span>'}</td>
      <td class="text-dim">${esc(r.date)||'—'}</td>
      <td>${routerStatusPill(r.status)}</td>
      <td class="text-dim">${esc(r.note)||'—'}</td>
      <td>
        <button class="icon-btn" onclick="showRouterForm('${r.id}')">✎</button>
        <button class="icon-btn danger" onclick="confirmDelRouter('${r.id}')">🗑</button>
      </td>
    </tr>`;
    if (!expanded) return mainRow;
    // 點開後顯示這台設備「歷次」更換紀錄（同一台可能換過不只一次版本，所以是列表，不是單一欄位）
    const logs = DB.routerLog.filter(l => l.equipId === r.id).sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')));
    const logListHtml = logs.map(l => `<div class="router-log-entry">
        <span class="mono">${esc(l.date)||'—'}</span>
        <span class="pill" style="background:var(--accent)22;color:var(--accent);border:1px solid var(--accent)66;flex-shrink:0;">${esc(l.version)||'—'}</span>
        <span class="text-dim" style="flex:1;min-width:0;">${esc(l.note)||''}</span>
        <button class="icon-btn danger" onclick="delRouterLog('${l.id}','${r.id}')">🗑</button>
      </div>`).join('') || `<p class="text-dim" style="font-size:13px;margin:0;">尚無更換紀錄，在下方新增第一筆。</p>`;
    const expandRow = `<tr class="router-log-row"><td colspan="11">
      <div class="router-log-panel">
        <div class="router-log-head">📜 ${esc(r.code)} · 更換歷史紀錄（共 ${logs.length} 次）</div>
        <div class="router-log-list">${logListHtml}</div>
        <div class="router-log-add">
          <input class="input" type="date" id="rl-date-${r.id}" value="${todayStr()}" style="width:150px;">
          <input class="input" id="rl-version-${r.id}" list="router-version-list" placeholder="版本（例如：第三版）" style="width:170px;">
          <input class="input" id="rl-note-${r.id}" placeholder="備註（選填）" style="flex:1;min-width:140px;">
          <button class="btn primary" onclick="saveRouterLog('${r.id}')">＋ 新增紀錄</button>
        </div>
      </div>
    </td></tr>`;
    return mainRow + expandRow;
  }).join('') || `<tr><td colspan="11" class="text-dim" style="text-align:center;padding:20px;">沒有符合篩選條件的設備</td></tr>`;

  return `
  <h1 class="page-title">📡 路由器更換表</h1>
  <p class="text-dim" style="margin:-12px 0 20px;font-size:13px;line-height:1.6;">目前全數安裝第一版路由器，廠商將陸續提供第二版機台，設備損壞或廠商更換時請於下表登記狀態與日期。點選每列最左邊的箭頭可展開查看該設備「歷次」更換紀錄。</p>

  <div class="grid-3">${statCards}</div>

  <div class="progress-card">
    <div class="progress-head"><span>整體更換進度</span><span class="mono" style="color:var(--green)">${done} / ${total}（${pct}%）</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>

  <div class="section-head"><h2 class="section-title">設備清單</h2><button class="btn primary" onclick="showRouterForm()">＋ 新增設備</button></div>
  <div class="filter-row">
    <span class="text-dim mono" style="font-size:12px;">站點篩選：</span>
    <select class="input" style="width:120px" onchange="window.__routerFilterSite=this.value;render()">
      <option ${window.__routerFilterSite==='全部'?'selected':''}>全部</option>
      <option ${window.__routerFilterSite==='台中端'?'selected':''}>台中端</option>
      <option ${window.__routerFilterSite==='通霄端'?'selected':''}>通霄端</option>
    </select>
    <span class="text-dim mono" style="font-size:12px;margin-left:8px;">狀態篩選：</span>
    <select class="input" style="width:120px" onchange="window.__routerFilterStatus=this.value;render()">
      <option ${window.__routerFilterStatus==='全部'?'selected':''}>全部</option>
      <option ${window.__routerFilterStatus==='未更換'?'selected':''}>未更換</option>
      <option ${window.__routerFilterStatus==='已更換'?'selected':''}>已更換</option>
      <option ${window.__routerFilterStatus==='損壞待換'?'selected':''}>損壞待換</option>
      <option ${window.__routerFilterStatus==='已下單待貨'?'selected':''}>已下單待貨</option>
    </select>
  </div>
  <datalist id="router-version-list"><option value="第一版"><option value="第二版"><option value="第三版"></datalist>
  <div class="table-wrap"><table class="data-table">
    <thead><tr><th></th><th>序號</th><th>站點</th><th>設備類型</th><th>設備編號</th><th>目前版本</th><th>更換後版本</th><th>更換日期</th><th>狀態</th><th>備註</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}
function toggleRouterExpand(id) { state.routerExpanded[id] = !state.routerExpanded[id]; render(); }
async function saveRouterLog(equipId) {
  const date = document.getElementById(`rl-date-${equipId}`).value;
  const version = document.getElementById(`rl-version-${equipId}`).value.trim();
  const note = document.getElementById(`rl-note-${equipId}`).value.trim();
  if (!version) { alert('請填寫版本'); return; }
  try {
    await apiUpsert(SHEET_MAP.routerLog.sheet, SHEET_MAP.routerLog.toRow({ equipId, date, version, note }));
    await reloadOne('routerLog');
  } catch (err) {
    alert('儲存失敗：' + err + '\n（若是第一次使用，請確認 Google 試算表已新增「路由器更換紀錄」分頁）');
    return;
  }
  state.routerExpanded[equipId] = true;
  render();
}
async function delRouterLog(id, equipId) {
  try { await apiDelete(SHEET_MAP.routerLog.sheet, id); await reloadOne('routerLog'); }
  catch (err) { alert('刪除失敗：' + err); return; }
  state.routerExpanded[equipId] = true;
  render();
}

      <label class="field"><span class="field-label mono">狀態</span><select class="input" id="rf-status">

async function saveRouter(btn) {
  const idVal = document.getElementById('rf-id').value;
  const rec = {
    id: idVal || undefined,
    site: document.getElementById('rf-site').value,
    type: document.getElementById('rf-type').value.trim(),
    code: document.getElementById('rf-code').value.trim(),
    cur: document.getElementById('rf-cur').value,
    next: document.getElementById('rf-next').value,
    date: document.getElementById('rf-date').value.trim(),
    status: document.getElementById('rf-status').value,
    note: document.getElementById('rf-note').value.trim(),
  };
  if (!rec.code) { alert('請填寫設備編號'); return; }
  const originalLabel = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '儲存中...'; }
  try { await apiUpsert(SHEET_MAP.router.sheet, SHEET_MAP.router.toRow(rec)); await reloadOne('router'); }
  catch (err) {
    alert('儲存失敗：' + err + '\n（若是第一次使用，請確認 Google 試算表已新增「路由器更換表」分頁）');
    if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
    return;
  }
  closeModal(); render();
}
function confirmDelRouter(id) { confirmDialog('確定要刪除這筆設備資料嗎？', `doDelRouter('${id}')`); }
async function doDelRouter(id) {
  try { await apiDelete(SHEET_MAP.router.sheet, id); await reloadOne('router'); }
  catch (err) { alert('刪除失敗：' + err); return; }
  render();
}

/* ============================= POE抽查日誌 ============================= */
function renderPoe() {
  window.__poeTab = window.__poeTab || 'check';
  const checks = DB.poeChecks;
  const extra = DB.poeExtra;
  const reservations = DB.poeReservation;
  const STATUS_MAP = { done:['已完成','var(--green)'], pending:['待辦','var(--amber)'], incomplete:['未完成','var(--red)'] };

  let body = '';
  if (window.__poeTab === 'check') {
    const rows = checks.map(p => `<tr>
      <td>${p.date}</td><td>${esc(p.inspector)}</td><td>${p.site}</td><td>${esc(p.item)}</td>
      <td>${p.result==='合格'?'<span class="pill pill-green">合格</span>':'<span class="pill pill-red">有缺失</span>'}</td>
      <td>${esc(p.improveStatus)||'—'}</td>
      <td>${p.fileUrl?`<a class="link" onclick="openFile('${p.fileUrl}')">${esc(p.fileName||'附件')}</a>`:'—'}</td>
      <td><button class="icon-btn danger" onclick="confirmDelPoeCheck('${p.id}')">🗑</button></td>
    </tr>`).join('') || `<tr><td colspan="8" class="text-dim" style="text-align:center;padding:20px;">尚無紀錄</td></tr>`;
    body = `<div class="section-head"><span></span><button class="btn primary" onclick="showPoeCheckForm()">＋ 新增抽查紀錄</button></div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>日期</th><th>窗口</th><th>地點</th><th>項目</th><th>結果</th><th>改善狀態</th><th>附件</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else if (window.__poeTab === 'extra') {
    const cards = extra.map(e => `<div class="viewfinder card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="card-head"><span>${e.date}</span><span class="text-dim">${esc(e.inspector)}</span></div>
      <p>${esc(e.description)}</p>
      ${e.fileUrl?`<a class="link" onclick="openFile('${e.fileUrl}')">${esc(e.fileName||'附件')}</a>`:''}
      <div class="row-end" style="margin-top:10px;">
        <button class="btn ghost" onclick="showPoeExtraForm('${e.id}')">編輯</button>
        <button class="btn danger" onclick="confirmDelPoeExtra('${e.id}')">刪除</button>
      </div>
    </div>`).join('') || `<p class="text-dim">尚無其他需求檔案</p>`;
    body = `<div class="section-head"><span></span><button class="btn primary" onclick="showPoeExtraForm()">＋ 新增需求</button></div><div class="grid-2">${cards}</div>`;
  } else {
    const rows = reservations.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(r => {
      const [label, color] = STATUS_MAP[r.status] || STATUS_MAP.pending;
      return `<div class="plan-row compact">
        <span class="pill mono">${r.date}</span>
        <button class="status-light" onclick="cyclePoeReservation('${r.id}')"><span class="dot" style="background:${color};box-shadow:0 0 8px ${color}"></span>${label}</button>
        <div class="plan-text">${esc(r.note)}</div>
        <button class="icon-btn danger" onclick="delPoeReservation('${r.id}')">✕</button>
      </div>`;
    }).join('') || `<p class="text-dim" style="padding:8px 0;">尚無預約紀錄</p>`;
    body = `<div class="viewfinder card compact-card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="card-head"><span>POE預約抽查</span></div>
      <div class="row-form">
        <input class="input" type="date" id="pr-date" style="width:150px;flex-shrink:0;" value="${todayStr()}">
        <input class="input" id="pr-note" placeholder="說明（例如：預約項目、聯絡窗口）">
        <button class="btn primary" style="flex-shrink:0;" onclick="addPoeReservation()">＋新增預約</button>
      </div>
      <div class="plan-list" style="margin-top:10px;">${rows}</div>
    </div>`;
  }

  return `
  <h1 class="page-title">POE抽查日誌</h1>
  <div class="tabs">
    <button class="tab ${window.__poeTab==='check'?'active':''}" onclick="window.__poeTab='check';render()">定期抽查紀錄</button>
    <button class="tab ${window.__poeTab==='extra'?'active':''}" onclick="window.__poeTab='extra';render()">其他需求檔案</button>
    <button class="tab ${window.__poeTab==='reservation'?'active':''}" onclick="window.__poeTab='reservation';render()">預約抽查</button>
  </div>
  ${body}`;
}

async function addPoeReservation() {
  const date = document.getElementById('pr-date').value;
  const note = document.getElementById('pr-note').value.trim();
  if (!date) return;
  try {
    await apiUpsert(SHEET_MAP.poeReservation.sheet, SHEET_MAP.poeReservation.toRow({ date, note, status: 'pending' }));
    await reloadOne('poeReservation');
  } catch (err) { alert('新增失敗：' + err); }
  render();
}
async function cyclePoeReservation(id) {
  const it = DB.poeReservation.find(r => r.id === id);
  if (!it) return;
  const order = ['pending','done','incomplete'];
  const nextStatus = order[(order.indexOf(it.status)+1) % order.length];
  try {
    await apiUpsert(SHEET_MAP.poeReservation.sheet, SHEET_MAP.poeReservation.toRow({ ...it, status: nextStatus }));
    await reloadOne('poeReservation');
  } catch (err) { alert('更新失敗：' + err); }
  render();
}
async function delPoeReservation(id) {
  try { await apiDelete(SHEET_MAP.poeReservation.sheet, id); await reloadOne('poeReservation'); }
  catch (err) { alert('刪除失敗：' + err); }
  render();
}

function toImageThumb(url, size) {
  if (!url) return '';
  const m = url.match(/\/d\/([^\/]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${size||300}`;
  return url;
}
// Google 的縮圖服務在同時大量請求時容易被限流，造成圖片顯示不出來。
// 這裡在圖片載入失敗時自動重試一次（延遲後），若仍失敗才放棄顯示，避免整頁圖片一次全部壞掉。
function handleImgError(img) {
  const tries = parseInt(img.dataset.retry || '0', 10);
  if (tries >= 2) { img.style.display = 'none'; return; }
  img.dataset.retry = String(tries + 1);
  const base = img.dataset.baseSrc || img.src.split('&_r=')[0];
  img.dataset.baseSrc = base;
  setTimeout(() => { img.src = base + '&_r=' + Math.random(); }, 1200 * (tries + 1));
}
function showLightbox(url) {
  const div = document.createElement('div');
  div.className = 'lightbox-backdrop';
  div.onclick = () => div.remove();
  div.innerHTML = `<img src="${toImageThumb(url, 1400)}">`;
  document.body.appendChild(div);
}

  const idVal = document.getElementById('gf-id').value;
  const dup = DB.gpsDevices.find(d => d.id !== idVal && d.num === num);
  if (dup) { alert('此 NUM 編號已存在，請確認是否重複'); return; }

  const btn = document.getElementById('gf-save-btn');
  const status = document.getElementById('gf-save-status');
  const fileInput = document.getElementById('gf-photo-file');
  let photoUrl = document.getElementById('gf-photo').value || '';
  const oldPhotoUrl = photoUrl;

  if (btn) btn.disabled = true;
  if (fileInput && fileInput.files && fileInput.files[0]) {
    if (status) status.textContent = '照片上傳中…';
    try {
      photoUrl = await apiUploadFile(fileInput.files[0], 'GPS機台照片', oldPhotoUrl);
    } catch (err) {
      if (btn) btn.disabled = false;
      if (status) status.textContent = '';
      alert('照片上傳失敗：' + err);
      return;
    }
  }
  if (status) status.textContent = '儲存中…';

  const rec = {
    id: idVal || undefined, num, site: document.getElementById('gf-site').value,
    name: document.getElementById('gf-name').value.trim(),
    model: document.getElementById('gf-model').value.trim(),
    imei: document.getElementById('gf-imei').value.trim(),
    mac: document.getElementById('gf-mac').value.trim().toUpperCase(),
    origin: document.getElementById('gf-origin').value.trim(),
    location: document.getElementById('gf-location').value.trim(),
    note: document.getElementById('gf-note').value.trim(),
    photo: photoUrl,
  };
  try { await apiUpsert(SHEET_MAP.gpsDevices.sheet, SHEET_MAP.gpsDevices.toRow(rec)); await reloadOne('gpsDevices'); }
  catch (err) { if (btn) btn.disabled = false; if (status) status.textContent = ''; alert('儲存失敗：' + err); return; }
  closeModal(); render();
}

function confirmDelGps(id) { confirmDialog('確定要刪除這台 GPS 機台資料嗎？', `doDelGps('${id}')`); }
async function doDelGps(id) {

function gpsFieldScore(d) { return ['imei','mac','origin','model','name','location','note'].reduce((s,k)=>s+(d[k]?1:0),0); }

async function dedupeGpsByNum(silent) {
  const groups = {};
  DB.gpsDevices.forEach(d => { if (!d.num) return; (groups[d.num] = groups[d.num] || []).push(d); });
  const dupGroups = Object.values(groups).filter(g => g.length > 1);
  if (dupGroups.length === 0) { if (!silent) alert('沒有發現重複的 NUM 編號'); return 0; }

  const idsToRemove = [];
  for (const g of dupGroups) {
    // 保留欄位資料最完整的一筆，其餘視為重複資料刪除
    const sorted = [...g].sort((a, b) => gpsFieldScore(b) - gpsFieldScore(a));
    sorted.slice(1).forEach(d => idsToRemove.push(d.id));
  }

  let removed = 0;
  try {
    // 優先嘗試批次刪除（一次網路請求），需要 Apps Script 已加入 deleteMany
    await apiDeleteMany(SHEET_MAP.gpsDevices.sheet, idsToRemove);
    removed = idsToRemove.length;
  } catch (e) {
    // 後端尚未更新支援批次刪除，改成逐筆刪除（速度較慢，但仍能正確完成）
    for (const id of idsToRemove) {
      try { await apiDelete(SHEET_MAP.gpsDevices.sheet, id); removed++; } catch (e2) { /* 略過單筆刪除失敗 */ }
    }
  }
  await reloadOne('gpsDevices');
  render();
  if (!silent) alert(`已清除 ${removed} 筆重複資料，目前剩下 ${DB.gpsDevices.length} 台（不重複）`);
  return removed;
}

// 批次上傳照片：依檔名比對 GPS_FILE_NUM_MAP（原始相機檔名 -> NUM），
// 找不到對照表比對時，會退而求其次嘗試「檔名本身就是NUM」（例如已重新命名成 TW24100145.jpg 的情況）。
async function bulkUploadGpsPhotos(event) {
  const files = Array.from(event.target.files || []);
  if (files.length === 0) return;

  const btn = document.getElementById('gpsPhotoBulkBtn');
  const status = document.getElementById('gpsImportStatus');
  if (btn) btn.disabled = true;

  const fileMap = {};
  GPS_FILE_NUM_MAP.forEach(m => { fileMap[m.file.toUpperCase()] = m.num; });

  let uploaded = 0, failed = 0, unmatched = [];
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    if (status) status.textContent = `照片上傳中… ${i + 1} / ${files.length}`;
    const base = file.name.replace(/\.[^.]+$/, '').toUpperCase();
    const num = fileMap[base] || (DB.gpsDevices.find(d => d.num && d.num.toUpperCase() === base) ? base : null);
    const target = num ? DB.gpsDevices.find(d => d.num && d.num.toUpperCase() === num.toUpperCase()) : null;

    if (!target) { unmatched.push(file.name); continue; }

    try {
      const url = await apiUploadFile(file, 'GPS機台照片', target.photo || '');
      const rec = { ...target, photo: url };
      await apiUpsert(SHEET_MAP.gpsDevices.sheet, SHEET_MAP.gpsDevices.toRow(rec));
      target.photo = url; // 直接更新本機快取，畫面立即反映
      uploaded++;
    } catch (e) {
      failed++;
    }
  }

  if (status) status.textContent = '';
  if (btn) btn.disabled = false;
  event.target.value = '';
  render();

  let msg = `批次上傳完成：成功 ${uploaded} 張${failed?`，失敗 ${failed} 張`:''}`;
  if (unmatched.length) {
    msg += `\n\n找不到對應NUM、未上傳的檔案（${unmatched.length}張）：\n${unmatched.slice(0, 15).join('、')}${unmatched.length>15?'…等':''}`;
  }
  alert(msg);
}

async function importGpsExcel(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined') { alert('SheetJS 尚未載入'); return; }
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const sheetName = wb.SheetNames.includes('GPS機台資料表') ? 'GPS機台資料表' : wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName]);
  const validRows = rows.filter(r => String(r['NUM編號'] || r['NUM'] || '').trim());

  const btn = document.getElementById('gpsImportBtn');
  const status = document.getElementById('gpsImportStatus');
  if (btn) btn.disabled = true;

  // 匯入前先重新從雲端拉一次最新資料，避免用到過舊的本機快取而誤判「不存在」導致重複新增
  if (status) status.textContent = '匯入前先同步最新資料…';
  try { await reloadOne('gpsDevices'); } catch (e) {}

  let added = 0, updated = 0, failed = 0, firstError = '';
  for (let i = 0; i < validRows.length; i++) {
    const r = validRows[i];
    if (status) status.textContent = `匯入中… ${i + 1} / ${validRows.length}`;
    const num = String(r['NUM編號'] || r['NUM'] || '').trim();
    const existing = DB.gpsDevices.find(d => d.num === num);
    const rec = {
      id: existing ? existing.id : undefined,
      num, site: r['區域'] || existing?.site || '未分類',
      name: r['品名'] || existing?.name || 'GPS定位卡',
      model: r['型號'] || existing?.model || '',
      imei: String(r['IMEI'] || existing?.imei || ''),
      mac: String(r['MAC'] || existing?.mac || ''),
      origin: r['產地'] || existing?.origin || '',
      location: r['安裝位置'] || existing?.location || '',
      note: r['備註'] || existing?.note || '',
      photo: existing?.photo || '',
    };
    try {
      await apiUpsert(SHEET_MAP.gpsDevices.sheet, SHEET_MAP.gpsDevices.toRow(rec));
      if (existing) { updated++; } else { added++; DB.gpsDevices.push({ ...rec, id: rec.id || 'temp_' + num }); }
    } catch (e) {
      failed++;
      if (!firstError) firstError = String(e.message || e);
    }
  }
  if (status) status.textContent = '檢查是否有重複資料…';
  try { await reloadOne('gpsDevices'); } catch (e) {}
  const dupRemoved = await dedupeGpsByNum(true).catch(() => 0);
  if (status) status.textContent = '';
  if (btn) btn.disabled = false;
  event.target.value = '';
  render();
  if (failed > 0 && added === 0 && updated === 0) {
    alert(`匯入失敗（0 筆成功）。\n\n第一筆錯誤訊息：${firstError}\n\n請確認：\n1. Apps Script 的 ID_COLUMNS 是否已加入「GPS機台資料表」並重新部署\n2. Google Sheets 是否已新增「GPS機台資料表」這個分頁（名稱要完全一致）`);
  } else {
    alert(`匯入完成：新增 ${added} 筆，更新 ${updated} 筆${failed?`，失敗 ${failed} 筆（第一筆錯誤：${firstError}）`:''}${dupRemoved?`\n（另外自動清除了 ${dupRemoved} 筆重複資料）`:''}`);
  }
}

  return u;
}

async function importExcel(event) {
  const file = event.target.files[0];
  if (!file) return;
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  function sheetJson(name) { return wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name]) : []; }

  const patrol = sheetJson('工作日誌').map(r => ({ date: r['日期'], site: r['地點'], personnel: r['人員'], timeRange: r['時段'], items: r['巡檢項目'], status: r['狀態'], abnormalNote: r['異常說明'], handledResult: r['處理結果'], signer: r['簽核人'] }));
  const tomorrow = sheetJson('明日預計工作').map(r => ({ date: r['日期'], site: r['地點'], task: r['工作項目'], assignee: r['負責人員'], status: r['狀態'] || 'pending' }));
  const poeChecks = sheetJson('POE抽查日誌').map(r => ({ date: r['日期'], inspector: r['窗口'], site: r['地點'], item: r['項目'], result: r['結果'], defect: r['缺失事項'], deadline: r['改善期限'], improveStatus: r['改善狀態'] }));
  const poeExtra = sheetJson('POE其他需求').map(r => ({ date: r['日期'], inspector: r['窗口'], description: r['說明'] }));
  const equipT = sheetJson('台中端').map(r => ({ category: r['類別'], name: r['名稱'], location: r['位置'], model: r['型號'], installDate: r['安裝日期'], warranty: r['保固期限'], lastMaintenance: r['最近維護'], status: r['狀態'] || 'normal', vendor: r['負責廠商'], note: r['備註'] }));
  const equipX = sheetJson('通霄端').map(r => ({ category: r['類別'], name: r['名稱'], location: r['位置'], model: r['型號'], installDate: r['安裝日期'], warranty: r['保固期限'], lastMaintenance: r['最近維護'], status: r['狀態'] || 'normal', vendor: r['負責廠商'], note: r['備註'] }));

  const jobs = [
    ...patrol.map(r => () => apiUpsert(SHEET_MAP.patrol.sheet, SHEET_MAP.patrol.toRow(r))),
    ...tomorrow.map(r => () => apiUpsert(SHEET_MAP.tomorrow.sheet, SHEET_MAP.tomorrow.toRow(r))),
    ...poeChecks.map(r => () => apiUpsert(SHEET_MAP.poeChecks.sheet, SHEET_MAP.poeChecks.toRow(r))),
    ...poeExtra.map(r => () => apiUpsert(SHEET_MAP.poeExtra.sheet, SHEET_MAP.poeExtra.toRow(r))),
    ...equipT.map(r => () => apiUpsert(SHEET_MAP.equipTaichung.sheet, SHEET_MAP.equipTaichung.toRow(r))),
    ...equipX.map(r => () => apiUpsert(SHEET_MAP.equipTongxiao.sheet, SHEET_MAP.equipTongxiao.toRow(r))),
  ];
  if (jobs.length === 0) { alert('這份 Excel 裡沒有可辨識的資料列'); event.target.value = ''; return; }
  if (!confirm(`即將把 ${jobs.length} 筆資料寫入 Google 雲端試算表，這個動作無法復原，確定要匯入嗎？`)) { event.target.value = ''; return; }
  document.getElementById('content').innerHTML = '<div class="page"><p class="text-dim">匯入中，資料量較大時請耐心等候…</p></div>';
  for (const job of jobs) {
    try { await job(); } catch (err) { console.error('匯入某一列失敗', err); }
  }
  alert('匯入完成！（注意：監看紀錄表的原始 Word/PDF 檔案不會透過 Excel 匯入匯出，僅同步清單資訊）');
  event.target.value = '';
  await loadAllData();
}

/* ---------- 3D 場景 ---------- */
let T, scene, cam, ren, orbit, hemi, sun, clock, grassM, HOME, HT, G = 0;

/* 樓層擺設（右側牆面留給螢幕，擺設都放在左半邊） */

function startLoop() { if (S.built && S.visible && !S.raf) S.raf = requestAnimationFrame(loop); }

  const t = clock.getElapsedTime(), dt = Math.min(.05, t - last); last = t;
  anims.forEach(a => a(t));
  elevs.forEach(e => {
    const tg = e.baseY + e.ty * L, d = tg - e.y, st = dt * L / .3;
    if (Math.abs(d) <= st) { e.y = tg; if (e.done) { const r = e.done; e.done = null; drawDisp(e); r(); } } else e.y += Math.sign(d) * st;

  });

    f.people.forEach(p => { if (p.userData.walker) return; let d = p.userData.ty - p.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); p.rotation.y += d * .1; });
    const st = f.status.st;
    f.light.visible = st !== 'alarm' || Math.sin(t * 10) > 0;
    f.light.scale.setScalar(st === 'warn' ? .8 + Math.abs(Math.sin(t * 3)) * .6 : 1);
    if (st === 'alarm') f.gm.emissive.setRGB(.55 * k, 0, 0); else f.gm.emissive.set(S.night ? 0x6b4a10 : 0x000000);
  });
  if (follow) { const w = follow.cab.getWorldPosition(V(0, 0, 0)); camT.t = w.clone().add(V(0, .8, 0)); camT.p = w.clone().add(V(3.5, 2.6, 10)); }
  if (camT.p) { const a = 1 - Math.pow(.94, dt * 60); cam.position.lerp(camT.p, a); orbit.target.lerp(camT.t, a); }
  orbit.update(); ren.render(scene, cam);
}

/* ---------- 狀態 ---------- */
function calcStatus(key) {
  if (!S.dataReady) return { st: 'load', msg: '', rows: [['狀態', '讀取資料中…']] };
  try { const fn = FLOOR_STATUS[key]; return fn ? fn() : { st: 'none', msg: '', rows: [] }; }
  catch (e) { console.warn('樓層狀態計算失敗', key, e); return { st: 'none', msg: '', rows: [] }; }
}
function updateStatuses() {
  if (!S.built) return;
  floors.forEach(f => { f.status = calcStatus(f.key); f.status.msg = f.status.msg || ''; drawLbl(f); f.light.material.color.set(SC[f.status.st]); });
  const df = floors.find(f => f.tags);
  if (df && S.dataReady) { const t = todayStr(), names = DB.duty.filter(x => x.date === t).map(x => x.person); df.tags.forEach((s, i) => s.userData.set(names[i] ? '值班 ' + names[i] : '')); }
  const al = $('fm-alarms'), list = floors.filter(f => f.status.st === 'alarm' || f.status.st === 'warn').sort((a, b) => (b.status.st === 'alarm') - (a.status.st === 'alarm'));
  al.innerHTML = `<div class="fm-al-head">⚠ 警報清單</div>` + (S.dataReady ? (list.map(f => `<div class="fm-al-row" data-k="${f.key}"><span class="fm-al-dot" style="background:${SC[f.status.st]}"></span><b>${f.code}</b> ${esc(f.label)} · ${esc(f.status.msg)}</div>`).join('') || `<div class="fm-al-row"><span class="fm-al-dot" style="background:${SC.ok}"></span>目前沒有警報</div>`) : `<div class="fm-al-row">讀取資料中…</div>`);
  al.querySelectorAll('[data-k]').forEach(r => r.onclick = () => { if (!S.inPage && !S.busy) enter(byKey[r.dataset.k]); });
  decorateNav();
}

/* ---------- 左側選單＝電梯面板 ---------- */
function decorateNav() {
  const list = $('navList'); if (!list) return;
  list.querySelectorAll('.fm-x').forEach(e => e.remove());
  if (!S.on || !S.built) return;
  let sepDone = false;
  list.querySelectorAll('button.nav-item').forEach(b => {
    const m = (b.getAttribute('onclick') || '').match(/goPage\('([^']+)'\)/); const f = m && byKey[m[1]]; if (!f) return;
    if (f.right && !sepDone) { const s = document.createElement('div'); s.className = 'fm-nav-sep fm-x'; s.textContent = '附屬館'; list.insertBefore(s, b); sepDone = true; }
    const c = document.createElement('span'); c.className = 'fm-code fm-x'; c.textContent = f.code; b.insertBefore(c, b.firstChild);
    const d = document.createElement('span'); d.className = 'fm-ndot fm-x'; d.style.background = SC[f.status.st]; b.appendChild(d);
    if (!S.inPage) b.classList.remove('active');
  });
  const h = document.createElement('button'); h.className = 'nav-item fm-x' + (S.inPage ? '' : ' active');
  h.innerHTML = '<span>🏢 大樓總覽</span>'; h.onclick = () => goHome(); list.insertBefore(h, list.firstChild);
}

/* ---------- 進出樓層 ---------- */
function inPos(f) { return { p: f.g.localToWorld(V(f.w / 2 - 2.7, 1.0, -1.2)), t: f.g.localToWorld(V(f.w / 2 - .14, .97, -1.2)) }; }
function scrRect(f) {
  cam.updateMatrixWorld(); const W = stage.clientWidth, H = stage.clientHeight; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  [[.5, 1], [.5, -1], [-.5, 1], [-.5, -1]].forEach(([dy, dz]) => { const v = f.g.localToWorld(V(f.w / 2 - .14, .97 + dy, -1.2 + dz)).project(cam); const px = (v.x + 1) / 2 * W, py = (1 - v.y) / 2 * H; x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); });
  return { x: x0, y: y0, w: Math.max(20, x1 - x0), h: Math.max(10, y1 - y0) };
}
function toRect(r) { return `translate(${r.x}px,${r.y}px) scale(${r.w / stage.clientWidth},${r.h / stage.clientHeight})`; }
function turn(f, on) { const cx = f.w / 2 - 2.7, cz = -1.2; f.people.forEach(p => { if (p.userData.walker) return; setTimeout(() => p.userData.ty = on ? Math.atan2(cx - p.position.x, cz - p.position.z) : p.userData.r0, on ? Math.random() * 500 : 0); }); }
function camArrive(maxMs) {
  return new Promise(r => { const t0 = performance.now(); (function chk() {
    if (!camT.p || cam.position.distanceTo(camT.p) < .12 || performance.now() - t0 > maxMs) { if (camT.p) { cam.position.copy(camT.p); orbit.target.copy(camT.t); } r(); return; }
    setTimeout(chk, 50); })(); });
}
function labels(v) { floors.forEach(f => f.lb.visible = v); }
function hud(v) { ['fm-alarms', 'fm-hint'].forEach(id => $(id).style.visibility = v ? '' : 'hidden'); }
function showStage() { stage.style.display = 'block'; S.visible = true; layout(); startLoop(); }
function hideStage() { stage.style.display = 'none'; S.visible = false; $('fm-card').style.opacity = 0; }
function resetContent() { contentEl.classList.remove('fm-zoom'); contentEl.style.transition = ''; contentEl.style.transform = ''; contentEl.style.opacity = ''; }
function ding() {
  if (!S.sound) return;
  try {
    S.actx = S.actx || new (window.AudioContext || window.webkitAudioContext)();
    [[1318, 0], [1046, .2]].forEach(([fq, t0]) => { const a = S.actx, o = a.createOscillator(), g = a.createGain(), n = a.currentTime + t0; o.frequency.value = fq; g.gain.setValueAtTime(0, n); g.gain.linearRampToValueAtTime(.18, n + .02); g.gain.exponentialRampToValueAtTime(.001, n + .9); o.connect(g).connect(a.destination); o.start(n); o.stop(n + 1); });
  } catch (e) {}
}
function homeView() {
  floors.forEach(f => { drawScreen(f, 'idle'); f.people.forEach(p => p.userData.ty = p.userData.r0); });
  elevs.forEach(e => e.door = 0); labels(true); hud(true); follow = null;
  if (hov) { hov.slab.material = mat(0xF1EFE8); hov = null; }
}

async function enter(f) {
  if (S.busy || S.inPage || !f) return; S.busy = true; S.cur = f;
  $('fm-card').style.opacity = 0; if (hov) { hov.slab.material = mat(0xF1EFE8); hov = null; }
  orbit.autoRotate = false; orbit.enabled = false;
  if (S.quick) {
    origGoPage(f.key); placeAt(f); hideStage(); S.inPage = true; S.busy = false; updateCtl(); decorateNav(); return;
  }
  labels(false); hud(false);
  const e = f.elev;
  follow = e;
  if (e.lv !== f.lv || Math.abs(e.y - (e.baseY + f.lv * L)) > .01) { e.door = 0; await wait(400); await ride(e, f.lv); await wait(150); } else await wait(700);
  ding(); e.door = 1; await wait(550);
  follow = null; const v = inPos(f); camT.p = v.p; camT.t = v.t; turn(f, 1); await wait(500); await camArrive(4000);
  for (let i = 0; i <= 20; i++) { drawScreen(f, 'load', i / 20); await wait(40); }
  drawScreen(f, 'ok'); await wait(300);
  origGoPage(f.key); contentEl.scrollTop = 0;
  const r = scrRect(f);
  contentEl.classList.add('fm-zoom'); contentEl.style.transition = 'none'; contentEl.style.transform = toRect(r); void contentEl.offsetWidth;
  contentEl.style.transition = 'transform .55s cubic-bezier(.2,.7,.2,1)'; contentEl.style.transform = 'none';
  await wait(600);
  hideStage(); resetContent();
  S.inPage = true; S.busy = false; updateCtl(); decorateNav();
}

async function goBack() {
  if (S.busy || !S.inPage) return; S.busy = true; const f = S.cur;
  showStage();
  if (!S.quick && f) {
    const v = inPos(f); cam.position.copy(v.p); orbit.target.copy(v.t); camT.p = v.p.clone(); camT.t = v.t.clone(); orbit.update(); ren.render(scene, cam);
    contentEl.classList.add('fm-zoom'); contentEl.style.transition = 'none'; contentEl.style.transform = 'none'; void contentEl.offsetWidth;
    contentEl.style.transition = 'transform .5s cubic-bezier(.5,0,.8,.3)'; contentEl.style.transform = toRect(scrRect(f));
    await wait(520); contentEl.style.transition = 'opacity .15s'; contentEl.style.opacity = '0'; await wait(160);
  }
  resetContent(); S.inPage = false; homeView(); updateCtl(); decorateNav();
  if (S.quick) { cam.position.copy(HOME); orbit.target.copy(HT); camT.p = null; }
  else { camT.p = HOME.clone(); camT.t = HT.clone(); await wait(400); await camArrive(5000); camT.p = null; }
  orbit.enabled = true; orbit.autoRotate = true; S.busy = false;
}
function goHome() { if (S.inPage) goBack(); }

function placeAt(to) {
  const prev = S.cur; if (prev && prev !== to) { drawScreen(prev, 'idle'); turn(prev, 0); prev.elev.door = 0; }
  const e = to.elev; e.ty = e.lv = to.lv; e.y = e.baseY + to.lv * L; e.done = null; drawDisp(e); e.door = 1;
  const v = inPos(to); cam.position.copy(v.p); orbit.target.copy(v.t); camT.p = v.p.clone(); camT.t = v.t.clone();
  drawScreen(to, 'ok'); turn(to, 1); S.cur = to;
}

async function hop(to) {
  if (S.busy) return; S.busy = true; const from = S.cur;
  if (S.quick || !from) { origGoPage(to.key); placeAt(to); S.busy = false; decorateNav(); return; }
  doors.style.display = 'block'; void doors.offsetWidth; doors.classList.add('closed'); await wait(380);
  const cnt = $('fm-counter'); cnt.style.opacity = 1; $('fm-cn').textContent = to.label;
  const seq = [];
  if (to.elev === from.elev) { const s = Math.sign(to.lv - from.lv) || 1; for (let i = from.lv; i !== to.lv + s; i += s) seq.push(to.elev.codes[i]); $('fm-ca').textContent = s > 0 ? '▲' : '▼'; }
  else { seq.push('連通橋', to.code); $('fm-ca').textContent = '⇄'; }
  for (const c of seq) { $('fm-ct').textContent = c; await wait(c.length > 3 ? 550 : 200); }
  ding(); origGoPage(to.key); contentEl.scrollTop = 0; placeAt(to); decorateNav();
  await wait(200); cnt.style.opacity = 0; doors.classList.remove('closed'); await wait(380); doors.style.display = 'none';
  S.busy = false;
}

/* ---------- 掛勾原本的 goPage / renderNav / render ---------- */
const origGoPage = window.goPage, origRenderNav = window.renderNav, origRender = window.render;
window.goPage = function (key) {
  if (!S.on || !S.built) return origGoPage(key);
  const f = byKey[key]; if (!f) return origGoPage(key);
  if (S.busy) return;
  if (!S.inPage) return enter(f);
  if (f === S.cur) return origGoPage(key);
  return hop(f);
};
window.renderNav = function () { origRenderNav.apply(this, arguments); decorateNav(); updateCtl(); };
window.render = function () { origRender.apply(this, arguments); S.dataReady = true; if (S.on) updateStatuses(); };

/* ---------- 日夜 / 模式切換 ---------- */
function applyNight() {
  const h = new Date().getHours();
  S.night = S.nightMode === 'night' || (S.nightMode === 'auto' && (h >= 18 || h < 6));
  stage.classList.toggle('night', S.night); updateCtl();
  if (!S.built) return;
  hemi.intensity = S.night ? .3 : .75; sun.intensity = S.night ? .15 : .7;
  floors.forEach(f => { f.gm.color.set(S.night ? 0xFAC775 : 0xCFE6FA); f.gm.opacity = S.night ? .3 : .14; drawLbl(f); });
  elevs.forEach(e => { e.gm.color.set(S.night ? 0xFAC775 : 0xCFE6FA); e.gm.opacity = S.night ? .22 : .12; });
  grassM.color.set(S.night ? 0x27500A : 0x97C459);
}
setInterval(() => { if (S.nightMode === 'auto') applyNight(); }, 60000);

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('無法載入 ' + src)); document.head.appendChild(s); }); }
async function ensure3D() {
  if (S.built) return;
  if (!window.THREE) await loadScript(THREE_SRC);
  if (!window.THREE.OrbitControls) await loadScript(ORBIT_SRC);
  build();
}
async function setMode(on) {
  if (on && window.innerWidth < 900) { alert('樓層模式需要較寬的螢幕（至少 900px），手機或小視窗請使用原版模式。'); on = false; }
  S.on = on; LS.set('mode', on ? '1' : '0'); document.body.classList.toggle('fm-on', on);
  if (!on) { hideStage(); doors.style.display = 'none'; doors.classList.remove('closed'); resetContent(); S.inPage = false; S.busy = false; updateCtl(); if ($('navList').children.length) renderNav(); return; }
  S.inPage = false; S.busy = false; showStage(); $('fm-loading').style.display = 'flex'; updateCtl();
  try { await ensure3D(); }
  catch (e) { console.error(e); alert('3D 大樓載入失敗，已切回原版模式。\n' + (e.message || e)); return setMode(false); }
  if (!S.on) return;
  $('fm-loading').style.display = 'none';
  homeView(); cam.position.copy(HOME); orbit.target.copy(HT); camT.p = null; orbit.enabled = true; orbit.autoRotate = true;
  layout(); updateStatuses(); updateCtl(); startLoop();
}

$('fm-b-mode').onclick = () => setMode(!S.on);
$('fm-b-home').onclick = goHome;
$('fm-b-night').onclick = () => { S.nightMode = { auto: 'day', day: 'night', night: 'auto' }[S.nightMode]; LS.set('night', S.nightMode); applyNight(); };
$('fm-b-quick').onclick = () => { S.quick = !S.quick; LS.set('quick', S.quick ? '1' : '0'); updateCtl(); };
$('fm-b-snd').onclick = () => { S.sound = !S.sound; LS.set('sound', S.sound ? '1' : '0'); updateCtl(); ding(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.on && S.inPage && !document.getElementById('modalBackdrop')) goBack(); });

updateCtl();
if (LS.get('mode', '0') === '1') setMode(true);
window.FloorMode = { setMode, state: S, floors };
})();
</script>

<!-- ============================= 左側選單：隱藏式 =============================
  ▸ 左上角 ☰ 按鈕：切換「隱藏／固定顯示」，會記住上次的設定（預設隱藏）
  ▸ 隱藏時：滑鼠移到畫面最左邊，選單會自動滑出；滑鼠離開或點選頁面後自動收起
  ▸ 原版模式、樓層模式都適用
================================================================================== -->
<style id="sb-style">
.sb-title-wrap { display: flex; align-items: center; gap: 10px; }
#sb-toggle { font-size: 18px; line-height: 1; padding: 4px 8px; }
body.sb-hidden .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 60; transform: translateX(-100%); transition: transform .22s ease, box-shadow .22s; overflow-y: auto; }
body.sb-hidden.sb-peek .sidebar { transform: none; box-shadow: 6px 0 24px rgba(30,34,53,.16); }
#sb-edge { position: fixed; left: 0; top: 0; bottom: 0; width: 12px; z-index: 59; display: none; }
body.sb-hidden #sb-edge { display: block; }
#sb-pin { margin: -12px 6px 0; font-size: 12px; }
body:not(.sb-hidden) #sb-pin { display: none; }
/* ---- 手機／窄螢幕：選單改為完整文字的滑出抽屜 ---- */
@media (max-width: 900px) {
  .sidebar { width: 250px; max-width: 82vw; }
  .brand-title, .brand-sub { display: block; }
  .nav-item span { display: inline; }
  .nav-item .fm-ndot { display: inline-block; }
  #sb-pin, body.sb-hidden #sb-edge { display: none !important; }
  .topbar { flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
  .topbar > div:last-child { flex-wrap: wrap; gap: 8px !important; }
  .content { padding: 16px 14px; }
}
</style>
<script>
(function () {
  const KEY = 'cctv-sidebar-hidden';
  const get = () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
  const set = v => { try { localStorage.setItem(KEY, v); } catch (e) {} };
  const sidebar = document.querySelector('.sidebar'), title = document.getElementById('topbarTitle');

  // 左上角 ☰ 按鈕（放在頁面標題左邊）
  const wrap = document.createElement('div'); wrap.className = 'sb-title-wrap';
  title.parentNode.insertBefore(wrap, title);
  const btn = document.createElement('button'); btn.id = 'sb-toggle'; btn.className = 'icon-btn';
  btn.textContent = '☰'; wrap.appendChild(btn); wrap.appendChild(title);

  // 滑出時，選單上方的「固定顯示」按鈕
  const pin = document.createElement('button'); pin.id = 'sb-pin'; pin.className = 'btn small ghost'; pin.textContent = '📌 固定顯示選單';
  sidebar.insertBefore(pin, sidebar.children[1] || null);

  // 左邊緣感應區
  const edge = document.createElement('div'); edge.id = 'sb-edge'; document.body.appendChild(edge);

  let timer = null;
  const peek = on => { clearTimeout(timer); document.body.classList.toggle('sb-peek', on); };
  function apply(hidden) {
    document.body.classList.toggle('sb-hidden', hidden); peek(false); set(hidden ? '1' : '0');
    btn.title = hidden ? '顯示選單（或把滑鼠移到畫面最左邊）' : '隱藏選單';
  }
  btn.onclick = () => {
    const hidden = document.body.classList.contains('sb-hidden');
    if (hidden && !document.body.classList.contains('sb-peek')) peek(true);   // 隱藏中：先滑出
    else if (hidden) peek(false);
    else apply(true);
  };
  pin.onclick = () => apply(false);
  edge.addEventListener('mouseenter', () => peek(true));
  sidebar.addEventListener('mouseenter', () => clearTimeout(timer));
  sidebar.addEventListener('mouseleave', () => { if (document.body.classList.contains('sb-hidden')) timer = setTimeout(() => peek(false), 350); });
  // 點了選單中的頁面後自動收起
  sidebar.addEventListener('click', e => { if (e.target.closest('.nav-item') && document.body.classList.contains('sb-hidden')) setTimeout(() => peek(false), 150); });

  document.addEventListener('click', e => { if (document.body.classList.contains('sb-peek') && !sidebar.contains(e.target) && !btn.contains(e.target)) peek(false); });

  // 手機／窄螢幕：一律使用滑出式選單（不佔畫面），不影響電腦版記住的設定
  const mq = window.matchMedia('(max-width: 900px)');
  const initFor = () => {
    if (mq.matches) { document.body.classList.add('sb-hidden'); peek(false); btn.title = '顯示選單'; }
    else apply(get() !== '0');   // 預設隱藏
  };
  if (mq.addEventListener) mq.addEventListener('change', initFor); else if (mq.addListener) mq.addListener(initFor);
  initFor();
})();
</script>
